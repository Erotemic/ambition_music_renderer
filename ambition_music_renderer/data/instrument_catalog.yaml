schema: ambition.instrument_catalog.v1
policy:
  installer: download_ambition_audio_tools.sh
  default_audio_tools_root: /data/audio-tools
  default_install_profile: pro
  expectation: Entries marked expected are part of the normal Ambition authoring environment. A missing local file is an environment/setup
    problem, not a reason for an agent to avoid the instrument.
  inventory: Generated files under AMBITION_AUDIO_TOOLS_ROOT describe what is actually installed on one machine; they do not
    define the supported instrument vocabulary.
sources:
  freepats.upright_piano_kw:
    label: FreePats Upright Piano KW
    expected: true
    install_profile: starter
    relative_root: sfz/FreePats/UprightPianoKW
  freepats.salamander_grand:
    label: FreePats Salamander Grand Piano
    expected: true
    install_profile: pro
    relative_root: sfz/FreePats/SalamanderGrandPiano
  virtual_playing_orchestra:
    label: Virtual Playing Orchestra
    expected: true
    install_profile: starter
    relative_root: sfz/Virtual-Playing-Orchestra3
    notes:
    - The wave archive and SFZ script archives must be extracted into the same tree.
    - Performance patches may use CC1/modulation for dynamics; drive CC1 when choosing a -perf patch.
  karoryfer.shinyguitar:
    label: Karoryfer Shinyguitar
    expected: true
    install_profile: starter
    relative_root: sfz/Karoryfer/Shinyguitar
    notes:
    - The installer creates Programs/acoustic and Programs/electric sample-directory symlinks required by the plain sfizz
      renderer.
    - The electric_five program requires startup CC100=64 and CC107=127 to produce the intended sustained electric sound.
  karoryfer.emilyguitar:
    label: Karoryfer Emilyguitar
    expected: true
    install_profile: starter
    license: CC0-1.0
    relative_root: sfz/Karoryfer/Emilyguitar
    notes:
    - emily_chords is chord/voicing oriented and has keyswitch states 33..35; use a basic/single-note program when writing
      lead lines.
  karoryfer.growlybass:
    label: Karoryfer Growlybass
    expected: true
    install_profile: starter
    relative_root: sfz/Karoryfer/Growlybass
    notes:
    - The clean program is the neutral finger-bass choice; dirty/angry/vicious/excessive/strange/shifty programs are character
      variants.
  karoryfer.black_and_blue_basses:
    label: Karoryfer Black And Blue Basses
    expected: true
    install_profile: starter
    license: CC0-1.0
    relative_root: sfz/Karoryfer/BlackAndBlueBasses
  karoryfer.fashionbass:
    label: Karoryfer Fashionbass
    expected: true
    install_profile: starter
    license: CC0-1.0
    relative_root: sfz/Karoryfer/Fashionbass
  karoryfer.pastabass:
    label: Karoryfer Pastabass
    expected: true
    install_profile: starter
    license: CC0-1.0
    relative_root: sfz/Karoryfer/Pastabass
  karoryfer.gogodze:
    label: Karoryfer Gogodze Phu Vol II
    expected: true
    install_profile: starter
    relative_root: sfz/Karoryfer/GogodzePhuVolII
  karoryfer.big_rusty_drums:
    label: Karoryfer Big Rusty Drums
    expected: true
    install_profile: starter
    license: CC0-1.0
    relative_root: sfz/Karoryfer/BigRustyDrums
    notes:
    - Use the 01-full top-level program for the normal kit; mappings/ helper SFZs are implementation files, not authoring
      targets.
  sfzinstruments.ganjo:
    label: Ganjo guitar-banjo
    expected: true
    install_profile: starter
    relative_root: sfz/SFZInstruments/Ganjo
  jlearman.jrhodes3c:
    label: jRhodes3c Rhodes Mark I
    expected: true
    install_profile: starter
    relative_root: sfz/SFZInstruments/jRhodes3c
  karoryfer.black_and_green_guitars:
    label: Karoryfer Black And Green Guitars
    expected: true
    install_profile: pro
    relative_root: sfz/Karoryfer/BlackAndGreenGuitars
    notes:
    - The keyswitch programs use keys around 36..38. Prefer dedicated sustain/staccato/twang programs when the articulation
      is known.
  karoryfer.swagbass:
    label: Karoryfer Swagbass
    expected: true
    install_profile: pro
    relative_root: sfz/Karoryfer/Swagbass
  versilian.etherealwinds_harp_ii_ce:
    label: Etherealwinds Harp II CE
    expected: true
    install_profile: pro
    relative_root: sfz/Versilian/EtherealwindsHarpII_CE
  karoryfer.war_tuba:
    label: Karoryfer War Tuba
    expected: true
    install_profile: pro
    relative_root: sfz/Karoryfer/WarTuba
    notes:
    - Sustain programs can respond strongly to CC1/modulation; treat CC1 as an expressive timbre/dynamics control when using
      them.
  karoryfer.bigcat_cello:
    label: Karoryfer Bigcat Cello
    expected: true
    install_profile: pro
    relative_root: sfz/Karoryfer/BigcatCello
  karoryfer.string_cyborgs:
    label: Karoryfer String Cyborgs
    expected: true
    install_profile: pro
    relative_root: sfz/Karoryfer/StringCyborgs
  karoryfer.horse_pulse:
    label: Karoryfer Horse Pulse
    expected: true
    install_profile: pro
    relative_root: sfz/Karoryfer/HorsePulse
    notes:
    - The main keyswitch program exposes states 31..36 and ships startup controls including CC31, CC107, and CC110.
  karoryfer.meatbass:
    label: Karoryfer Meatbass
    expected: true
    install_profile: pro
    relative_root: sfz/Karoryfer/Meatbass
  karoryfer.weresax:
    label: Karoryfer Weresax
    expected: true
    install_profile: pro
    relative_root: sfz/Karoryfer/Weresax
  vsco2_ce:
    label: VSCO 2 Community Edition
    expected: true
    install_profile: pro
    license: CC0-1.0
    relative_root: sfz/VSCO2CE
  vcsl:
    label: Versilian Community Sample Library
    expected: true
    install_profile: pro
    relative_root: sfz/Versilian/VCSL
  sonatina:
    label: Sonatina Symphonic Orchestra
    expected: true
    install_profile: pro
    relative_root: sfz/Sonatina/SymphonicOrchestra
  naked_drums:
    label: Naked Drums
    expected: true
    install_profile: pro
    license: CC-BY-4.0
    relative_root: sfz/WilkinsonAudio/NakedDrums
    notes:
    - Attribution is required when redistributing the samples. Use the User/Naked Drums GM.sfz program for a conventional
      drum map.
  muldjord_kit:
    label: Muldjord Kit
    expected: true
    install_profile: pro
    license: CC-BY-4.0
    relative_root: sfz/DrumGizmo/MuldjordKit
    notes:
    - Attribution is required when redistributing the samples. Prefer the Stereo kit program for normal rendering.
