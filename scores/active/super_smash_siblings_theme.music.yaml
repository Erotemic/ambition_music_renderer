    humanize_velocity_pct: 3

  low_answer_gm:
    kind: motif
    instruments: [trombones_stacc, celli]
    motif: sibling_answer_gm
    root: G2
    starts: [[20, 0.0], [44, 0.0], [52, 0.0], [60, 0.0]]
    velocity: 84
    articulation: marcato
    gate: 0.80
    instrument_octave_offsets: {trombones_stacc: 0, celli: 1}
    instrument_velocity_offsets: {trombones_stacc: 0, celli: -10}
    humanize_ms: 4
    humanize_velocity_pct: 3

  bridge_winds:
    kind: motif
    instruments: [oboes, clarinets]
    motif: wind_relay
    roots: [D5, D5, D5, D5]
    starts: [[24, 0.0]]
    repeats: 4
    every_bars: 4
    velocity: 78
    articulation: tenuto
    gate: 0.90
    instrument_octave_offsets: {oboes: 0, clarinets: -1}
    instrument_velocity_offsets: {oboes: 0, clarinets: -8}
    humanize_ms: 4
    humanize_velocity_pct: 3
    dynamics:
      - {start_bar: 24, bars: 16, from: 0.90, to: 1.08, curve: smooth}

  flute_relay:
    kind: motif
    instrument: flutes
    motif: wind_relay
    root: D5
    starts: [[28, 0.0], [36, 0.0], [42, 0.0], [50, 0.0]]
    velocity: 82
    articulation: tenuto
    gate: 0.88
    humanize_ms: 3
    humanize_velocity_pct: 3
    dynamics:
