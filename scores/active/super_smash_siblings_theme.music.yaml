  brass_main_call:
    kind: motif
    instruments: [horns_stacc, trumpets_stacc]
    motif: sibling_call
    root: D4
    starts: [[0, 0.0], [8, 0.0], [16, 0.0], [40, 0.0], [48, 0.0], [56, 0.0]]
    velocity: 94
    articulation: marcato
    gate: 0.82
