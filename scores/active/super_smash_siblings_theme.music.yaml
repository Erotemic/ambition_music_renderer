    articulation: marcato
    humanize_ms: 3
    humanize_velocity_pct: 2

  horn_bed:
    kind: pad_chords
    instrument: horns_sus
    octave: 3
    every_bars: 1
    duration_beats: 3.85
    velocity: 44
    articulation: tenuto
    voicing: triad
