schema: ambition.musicir.v1
id: super_smash_siblings_character_select
title: Roster Ignition - Super Smash Siblings Character Select
seed: 2026080602
notes: 'High-energy symphonic character-selection loop for Super Smash Siblings. A four-bar E-minor roster hook alternates between brass, strings, and woodwinds over continuous sixteenth-note string motion, punchy low-orchestra responses, and driving orchestral percussion. The arrangement stays urgent and loop-ready rather than resolving like a title anthem: every eight bars creates a fresh selection pulse, the middle relay clears space for character browsing, and the final surge hands directly back to the opening E-minor hit. All orchestral roles prefer the existing Sonatina/VCSL SFZ libraries and retain General MIDI fallbacks.'
