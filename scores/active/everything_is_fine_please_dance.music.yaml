schema: ambition.musicir.v1
id: everything_is_fine_please_dance
title: Everything Is Fine, Please Dance
seed: 202608072012
notes: >-
  Earworm-first rebuild. The cue is organized around one two-bar hook that is deliberately
  simple enough to sing after a single statement: repeated tonic, a compact rise to the fifth,
  a short descent, and a long answering second. The hook returns unchanged every two bars in
  the main sections; development happens in bass, harmony, drums, register, and doubling rather
  than by continually rewriting the melody. The arrangement stays small and dry so each group
  has a clear job and the hook can dominate perceptually without simply being much louder than
  the rest of the mix. A four-bar opening exposes the groove, the hook arrives immediately after,
  a brief stripped section creates appetite for its return, and the final section adds octave
  support rather than a competing counter-melody.

