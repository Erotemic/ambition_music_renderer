motifs:
# The whole song is built around this. Two bars, eight notes, no ornamental rewrite.
# Scale degrees in A major: 1 1 3 5 | 3 2 1 2. The final 2 hangs for 3.5 beats,
# so the listener gets a long anticipation before the repeated tonic returns.
- id: main_hook
  root: A5
  intervals: [0, 0, 4, 7, 4, 2, 0, 2]
  rhythm: [0.5, 0.5, 0.5, 1.5, 0.5, 0.5, 1.0, 3.0]
  velocities: [0.88, 0.76, 0.84, 1.0, 0.82, 0.76, 0.90, 0.94]
- id: hook_fragment
  root: A5
  intervals: [0, 0, 4, 7]
  rhythm: [0.5, 0.5, 0.5, 2.5]
  velocities: [0.84, 0.74, 0.82, 0.96]

