    - flac
    optional: true
    fallback_backend: pretty-midi
authoring:
  audition_axis: counter-rhythm becomes a call-and-reply identity
  bass_policy: Every single-note bass event at beats 0 and 2 is copied exactly from polish 78.
  backing_revision: Chord hits keep their exact timing but replace close add-2 clusters with open triads, sevenths, and
    dominant shells.
  melody_revision: A two-hit answer motif recurs across the eight-bar phrase, with short pickups only at structural turns.
  special_hook: The left hand states the asymmetric pulse; the lead answers mainly at .75 and 2.75, with a recurring
    rise-then-release contour.
  foreshadowing_policy: No wrong note. A single quiet E over the returning D harmony functions as a ninth and resolves
    inside the next phrase.
  subtle_foreshadowing_color:
    bar: 32
    beat: 0.75
    pitch: E5
    duration: 0.72
    velocity: 69
    idea: A quiet ninth over D on the final return; familiar enough to pass as color.
  instrument: freepats.salamander_grand
