title: 'Fia Act I Deep Polish 81 — Second Hand: Threaded Reply'
seed: 20260816
notes: Deep composition polish. Preserve every bass hit and the defining off-beat rhythm, but open the chord voicings
  so the counter-rhythm reads clearly, then shape the lead as a recurring call/reply rather than a stream of legal chord
  tones.
