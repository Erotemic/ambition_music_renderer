parts:
  - id: first_fiddle_part
    instrument: first_fiddle
    voices:
      - id: call
        clips:
          - {id: call_01, at: {bar: 1, beat: 1}, use: call_first_voice}
          - {id: call_09, at: {bar: 9, beat: 1}, use: call_second_voice}
          - {id: call_17, at: {bar: 17, beat: 1}, use: call_leave_space}
          - {id: call_25, at: {bar: 25, beat: 1}, use: call_together}
          - {id: call_33, at: {bar: 33, beat: 1}, use: call_walk_back}
  - id: second_fiddle_part
    instrument: second_fiddle
    voices:
      - id: answer
        clips:
          - {id: answer_01, at: {bar: 1, beat: 1}, use: answer_first_voice}
          - {id: answer_09, at: {bar: 9, beat: 1}, use: answer_second_voice}
          - {id: answer_17, at: {bar: 17, beat: 1}, use: answer_leave_space}
          - {id: answer_25, at: {bar: 25, beat: 1}, use: answer_together}
          - {id: answer_33, at: {bar: 33, beat: 1}, use: answer_walk_back}
  - id: accordion_part
    instrument: accordion
    voices:
      - id: bellows
        clips:
          - {id: bellows_01, at: {bar: 1, beat: 1}, use: bellows_first_voice, transpose: -12}
          - {id: bellows_09, at: {bar: 9, beat: 1}, use: bellows_second_voice, transpose: -12}
          - {id: bellows_17, at: {bar: 17, beat: 1}, use: bellows_leave_space, transpose: -12}
          - {id: bellows_25, at: {bar: 25, beat: 1}, use: bellows_together, transpose: -12}
          - {id: bellows_33, at: {bar: 33, beat: 1}, use: bellows_walk_back, transpose: -12}
  - id: bass_part
    instrument: bass
    voices:
      - id: bassline
        clips:
          - {id: bassline_01, at: {bar: 1, beat: 1}, use: bassline_first_voice}
          - {id: bassline_09, at: {bar: 9, beat: 1}, use: bassline_second_voice}
          - {id: bassline_17, at: {bar: 17, beat: 1}, use: bassline_leave_space}
          - {id: bassline_25, at: {bar: 25, beat: 1}, use: bassline_together}
          - {id: bassline_33, at: {bar: 33, beat: 1}, use: bassline_walk_back}
  - id: feet_and_hands_part
    instrument: feet_and_hands
    voices:
      - id: stomp
        clips:
          - {id: stomp_01, at: {bar: 1, beat: 1}, use: stomp_first_voice}
          - {id: stomp_09, at: {bar: 9, beat: 1}, use: stomp_second_voice}
          - {id: stomp_17, at: {bar: 17, beat: 1}, use: stomp_leave_space}
          - {id: stomp_25, at: {bar: 25, beat: 1}, use: stomp_together}
          - {id: stomp_33, at: {bar: 33, beat: 1}, use: stomp_walk_back}
render:
  sample_rate: 48000
  ogg_quality: 6
processing:
  groups:
    fiddle_l:
      chain:
        - {processor: highpass, cutoff_hz: 180}
        - {processor: lowpass, cutoff_hz: 9000}
    fiddle_r:
      chain:
        - {processor: highpass, cutoff_hz: 170}
        - {processor: lowpass, cutoff_hz: 8700}
    reeds:
      chain:
        - {processor: highpass, cutoff_hz: 155}
        - {processor: lowpass, cutoff_hz: 3750}
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 40}
        - {processor: lowpass, cutoff_hz: 5700}
    percussion:
      chain:
        - {processor: highpass, cutoff_hz: 47}
        - {processor: lowpass, cutoff_hz: 7200}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 35}
      - {processor: compressor, threshold_db: -17, ratio: 1.6, attack_ms: 24, release_ms: 115, knee_db: 5}
      - {processor: reverb, wet: 0.038, decay_seconds: 0.65}
      - {processor: limiter, target_peak_db: -1.8, drive: 0.94, normalize: true}
playback:
  layers:
    ensemble: [fiddle_l, fiddle_r, reeds, bass, percussion]
  sections:
    - {id: song, form: [first_voice, second_voice, leave_space, together, walk_back], loop: true}
