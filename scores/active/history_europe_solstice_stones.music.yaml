  - {name: descant, group: descant, program: recorder, volume: 100, pan: 64, expression: 104, instrument_backend: {kind: sfz, sfz_glob: '**/VCSL-1.2.2-RC/Aerophones/Edge-blown Aerophones/Baroque Alto Recorder - Sustain.sfz', required: true, settings: {fold_to_range: false}}}
  - {name: ocarina, group: ocarina, program: ocarina, volume: 100, pan: 64, expression: 104, instrument_backend: {kind: sfz, sfz_glob: '**/VCSL-1.2.2-RC/Aerophones/Edge-blown Aerophones/Ocarina, Typical - Sus.sfz', required: true, settings: {fold_to_range: false}}}
