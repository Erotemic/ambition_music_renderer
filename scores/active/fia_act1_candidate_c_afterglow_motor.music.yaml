schema: ambition.musicir.v1
id: fia_act1_candidate_c_afterglow_motor
title: "Fia I Candidate C — Afterglow Motor"
seed: 202608161203
notes: >-
  Act I candidate C: spacious post-rock chamber-electronic. The cue is built from
  long clean-guitar phrases, a low viola/cello horizon, and a warm analog motor
  pulse rather than a conventional rhythm section. It should feel innocent as
  openness and trust, not innocence as cuteness. There is no piano and no
  woodwind. The melody uses wide open intervals and leaves large stretches of
  air, giving later acts room to turn the same material into pressure. Its omen
  is harmonic rather than melodic or rhythmic: one late bar substitutes a quiet
  C-minor shadow under an otherwise G-major/Lydian landscape, then returns to
  daylight without comment.
