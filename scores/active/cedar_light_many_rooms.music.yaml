  metadata_markers:
  - id: doors_open
    label: I. Doors Open - huge folk ensemble with low men, high women, and exposed violin
    bar: 1
  - id: threshold_march
    label: Doorway I-II. Rope snares gather into a line while open guitar keeps ringing
    bar: 6
  - id: running_nave
    label: II. Running Nave - picked open guitar, upright bass, rope-snare line, and three-part vocal hook
    bar: 7
  - id: veil_of_bells
    label: III. Veil of Bells - triplet picking and percussion under reharmonized three-part voices
    bar: 15
  - id: procession
    label: IV. Procession - field snares, upright bass, banjo, ringing picked guitar, and three-part choir
    bar: 22
  - id: birds_in_rafters
    label: V. Birds in the Rafters - choir-free banjo, harmony-locked fingerpicking, harp, and exposed violin
    bar: 30
  - id: black_altar
    label: VI. Black Altar - dark upright bass and low male mass with a restrained three-part lament
    bar: 37
  - id: bronze_storm
    label: VII. Bronze Storm - instrumental 3+3+2 rupture with aggressive arranged drums
    bar: 44
  - id: glass_chapel
    label: VIII. Glass Chapel - exposed three-part male/female harmony around isolated strings
    bar: 52
  - id: returning_field
    label: IX. Returning Field - bright picked open guitar, upright bass, banjo, and the returning vocal hook
    bar: 58
  - id: pivot_hall
    label: Doorway IX-X. Male choir holds the floor while a high female tone opens the modulation
    bar: 65
  - id: transfiguration
    label: X. Transfiguration - the three-part vocal hook reharmonized in E major
    bar: 67
  - id: second_sun
    label: XI. Second Sun - full ensemble with picked ringing guitar and broad three-part voices
    bar: 77
  - id: last_light
    label: XII. Last Light - instruments and choir hold the final Eadd9 after the drums stop
    bar: 86
  sfizz:
    library_roots:
    - /data/audio-tools/sfz
    - /data/audio-tools
    fallback_backend: pretty-midi
