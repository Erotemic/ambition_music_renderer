schema: ambition.musicir.v1
id: cedar_light_many_rooms
title: Cedar Light - Procession of Many Rooms (Drop-D Bloom and Low Banjo Lead Rehearsal)
seed: 202608081810
notes: Linked-medley rehearsal using Glass Chapel as the guitar-articulation reference. Rhythm acoustic now uses Drop D for
  genuine D2 coverage, longer tenuto cross-picking under broad ringing strums, and stronger transient softening so the instrument
  blooms instead of clicking. The separate Shinyguitar lead voice is removed and replaced by a lower-register banjo lead using
  the same good folk.banjo library as Birds in the Rafters. The brighter Birds banjo remains independent and is raised slightly
  elsewhere so banjo becomes a recurring folk color.
