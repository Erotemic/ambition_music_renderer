    root: D3
    intervals: [0, -2, -4, -7, -5, -2, -4, 0]
    rhythm: [0.5, 0.5, 0.75, 0.75, 0.5, 0.5, 1.0, 1.5]
    velocities: [0.72, 0.74, 0.80, 0.88, 0.82, 0.76, 0.80, 0.68]
  - id: machine_decision
    root: D4
    intervals: [0, 1, 6, 5, 3, 1, 0]
    rhythm: [0.25, 0.25, 0.5, 0.5, 0.5, 0.5, 1.5]
    velocities: [0.66, 0.70, 0.78, 0.72, 0.68, 0.64, 0.58]
  - id: calibration_memory
    root: D5
    intervals: [0, 2, 4, 7]
    rhythm: [0.5, 0.5, 0.75, 2.25]
    velocities: [0.28, 0.30, 0.32, 0.20]
