    group: keys
    program: acoustic_grand_piano
    volume: 82
    pan: 48
    expression: 94
    instrument_backend: {kind: sfz, library_ref: freepats.salamander_grand, prefer: [piano, sustain], optional: true, fallback_backend: pretty-midi}
  - name: drive_cello
    group: engine
    program: cello
    volume: 92
    pan: 40
    expression: 102
    instrument_backend: {kind: sfz, library_ref: strings.celli_staccato, prefer: [cello, staccato], optional: true, fallback_backend: pretty-midi}
  - name: pressure_viola
    group: strings
    program: viola
    volume: 72
    pan: 70
    expression: 94
    instrument_backend: {kind: sfz, library_ref: strings.violas, prefer: [viola, sustain], optional: true, fallback_backend: pretty-midi}
  - name: pressure_horn
    group: brass
    program: french_horn
    volume: 68
    pan: 62
    expression: 90
    instrument_backend: {kind: sfz, library_ref: orchestra.horns_sustain, prefer: [horns, sustain], optional: true, fallback_backend: pretty-midi}
  - name: memory_clarinet
    group: memory
    program: clarinet
    volume: 56
    pan: 74
    expression: 76
    instrument_backend: {kind: sfz, library_ref: vpo.clarinet_solo_perf, prefer: [clarinet, solo, legato], optional: true, fallback_backend: pretty-midi}
  - {name: hard_square, group: machine, program: lead_square, volume: 64, pan: 78, expression: 82, modulation: 2}
  - {name: motor_bass, group: engine, program: synth_bass_2, volume: 66, pan: 58, expression: 82}
  - {name: impact_ticks, group: percussion, is_drum: true, volume: 66, pan: 62, expression: 76}
motifs:
