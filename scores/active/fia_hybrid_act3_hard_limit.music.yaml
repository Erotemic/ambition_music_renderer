    harmony:
      [Dm, Dm, Bb, Bb, Gm, Gm, C, C,
       Dm, Dm, Bb, Bb, Gm, Gm, Am, A,
       Dm, Dm, Bb, Bb, Gm, Gm, C, C,
       Dm, Dm, Bb, Bb, Gm, Gm, Am, A,
