  keys: {gain_db: -0.8, highpass_hz: 80, lowpass_hz: 9800, reverb_wet: 0.008}
  strings: {gain_db: -1.2, highpass_hz: 90, lowpass_hz: 9000, reverb_wet: 0.018}
  brass: {gain_db: -2.0, highpass_hz: 100, lowpass_hz: 8500, reverb_wet: 0.018}
  machine: {gain_db: -1.8, highpass_hz: 100, lowpass_hz: 9800, reverb_wet: 0.002}
  memory: {gain_db: -3.0, highpass_hz: 100, lowpass_hz: 10000, reverb_wet: 0.020}
  percussion: {gain_db: -5.8, highpass_hz: 50, lowpass_hz: 10000, transient_tame: 0.05, reverb_wet: 0.001}
instruments:
