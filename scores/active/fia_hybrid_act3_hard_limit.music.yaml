schema: ambition.musicir.v1
id: fia_hybrid_act3_hard_limit
title: "Fia III — Hard Limit"
seed: 202608161203
notes: >-
  Climax of the chamber-electronic Fia direction. The Act I melody is almost
  entirely gone; its rhythm and interval skeleton have become a mechanical 3/4
  drive shared by piano, cello, and restrained square-wave pulse. Acoustic
  instruments still matter, so this feels like the same person rather than a
  genre switch, but the workshop now dictates the motion instead of decorating
  it. Horn and viola add pressure without a full cinematic brass wall. There are
  no crash cymbals and percussion is deliberately subordinate. Late in the loop,
  clarinet and piano quietly remember only the first four notes of Calibration
  Light while the machine continues through them.
tempo: {bpm: 126}
meter: {beats_per_bar: 3, beat_unit: 4}
constraints: {voice_leading: minimize_motion, no_clusters: true}
render:
  sample_rate: 48000
  ogg_quality: 6
  backend: pretty-midi
  sfizz:
    library_roots: [/data/audio-tools/sfz, /data/audio-tools]
    fallback_backend: pretty-midi
postprocess:
  gain_db: -0.8
  highpass_hz: 30
  lowpass_hz: 11600
  presence_low_hz: 1400
  presence_high_hz: 3900
  presence_db: 0.08
  reverb_wet: 0.105
  reverb_decay_seconds: 1.22
  reverb_damping_hz: 4900
  stereo_width: 0.11
  compressor_threshold_db: -17.0
  compressor_ratio: 2.35
  compressor_attack_ms: 12
  compressor_release_ms: 110
  compressor_makeup_db: 0.45
  compressor_knee_db: 5
  limiter_drive: 0.90
  normalize: true
  target_peak_db: -6.2
stem_postprocess:
  highpass_hz: 28
  reverb_wet: 0.012
  reverb_decay_seconds: 0.50
  reverb_damping_hz: 5000
  stereo_width: 0.025
  normalize: false
  target_peak_db: -3.0
group_postprocess:
