    section: fia_hybrid_act3_loop
    stems: {engine: 0.88, keys: 0.66, strings: 0.58, brass: 0.42, machine: 0.62, memory: 0.18, percussion: 0.24}
  climax:
    section: fia_hybrid_act3_loop
    stems: {engine: 1.0, keys: 0.74, strings: 0.68, brass: 0.52, machine: 0.76, memory: 0.22, percussion: 0.30}
sections:
