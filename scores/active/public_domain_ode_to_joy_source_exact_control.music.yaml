schema: ambition.musicir.v1
id: public_domain_ode_to_joy_source_exact_control
title: "Public Domain Control \u2014 Ode to Joy, Source-Exact SATB Timing"
one_shot: true
seed: 2026081602
notes: Source-faithful symbolic control based on the public-domain Mutopia Ode to Joy SATB transcription (Mutopia-2009/08/05-528). Tempo, meter, pitches, onsets, and written durations of all four voices are preserved exactly from that transcription and rendered on one piano. Literal note events use gate 1.0 and zero humanization so dotted quarters, eighth notes, quarter notes, half notes, and the eighth-note pairs remain exact in beat time.
tempo:
  bpm: 100
meter:
  beats_per_bar: 4
  beat_unit: 4
render:
  sample_rate: 48000
  ogg_quality: 6
  backend: pretty-midi
  sfizz:
    library_roots:
    - /data/audio-tools/sfz
    - /data/audio-tools
    fallback_backend: pretty-midi
postprocess:
  gain_db: -2.0
  highpass_hz: 25
  lowpass_hz: 16000
  reverb_wet: 0.06
  reverb_decay_seconds: 1.0
  reverb_damping_hz: 7200
  stereo_width: 0.04
  compressor_threshold_db: -24.0
  compressor_ratio: 1.15
  compressor_attack_ms: 35
  compressor_release_ms: 220
  compressor_makeup_db: 0.0
  compressor_knee_db: 8
  limiter_drive: 0.75
  normalize: true
  target_peak_db: -4.0
stem_postprocess:
  gain_db: 0.0
  highpass_hz: 25
  lowpass_hz: 16000
  reverb_wet: 0.0
  stereo_width: 0.0
  normalize: false
instruments:
- name: autopiano
  group: piano
  program: acoustic_grand_piano
  volume: 108
  pan: 64
  expression: 112
  reverb: 6
  instrument_backend:
    kind: sfz
    library_ref: freepats.salamander_grand
    prefer:
    - salamander
    - grand
    - piano
    optional: true
    fallback_backend: pretty-midi
state_map:
  default:
    section: ode_control
    stems:
      piano: 1.0
