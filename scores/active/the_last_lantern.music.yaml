# Original composition, September 2026; revised after first production listening pass.
# Exact phrases are the musical authority. Beat positions in event lists are
# fractions of a WHOLE note, not beat counts.
#
# This revision is deliberately written *at* 96 BPM rather than treating a
# busier action arrangement as though somebody turned the tempo knob down.
# Harmonic changes last two bars, bass notes breathe for most of a bar, the
# flute is built from long exhaled tones with real rests, and koto/shamisen
# attacks are events rather than a subdivision grid. The empty space is part
# of the composition.
#
# The threshold is an exact orchestral copy of the final eight loop bars.
# Render the full timeline, then use adaptive/zone_loop/*.full.ogg for the zone.
# Sampled bass/cello are required; Japanese lead/plucks/taiko use GM programs.
schema: ambition.musicir.v3
