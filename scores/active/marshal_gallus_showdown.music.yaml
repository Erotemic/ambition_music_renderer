  - {id: before_high_noon, from: {bar: 43, beat: 1}, to: {bar: 45, beat: 1}, energy: 0.1, density: 0.0, role: 'silence: a ring and a lead-in'}
  - {id: high_noon, from: {bar: 45, beat: 1}, to: {bar: 61, beat: 1}, energy: 0.95, density: 0.85, loopable: true, role: 'enraged: F minor, the strut in the trumpets, choir, timpani'}
  - {id: before_sundown, from: {bar: 61, beat: 1}, to: {bar: 63, beat: 1}, energy: 0.1, density: 0.0, role: 'silence: a ring and a lead-in'}
