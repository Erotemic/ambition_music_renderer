parts:
  - id: piano_part
    instrument: piano
    voices:
      - id: piano_main
        clips:
          - {id: piano_lanterns_out, at: {bar: 1, beat: 1}, use: piano_lanterns_out}
          - {id: piano_first_stars, at: {bar: 9, beat: 1}, use: piano_first_stars}
          - {id: piano_lamplight, at: {bar: 17, beat: 1}, use: piano_lamplight}
          - {id: piano_orbit, at: {bar: 25, beat: 1}, use: piano_orbit}
          - {id: piano_deep_night, at: {bar: 33, beat: 1}, use: piano_deep_night}
  - id: celesta_part
    instrument: celesta
    voices:
      - id: celesta_main
        clips:
          - {id: celesta_first_stars, at: {bar: 9, beat: 1}, use: celesta_first_stars}
          - {id: celesta_orbit, at: {bar: 25, beat: 1}, use: celesta_orbit}
          - {id: celesta_deep_night, at: {bar: 33, beat: 1}, use: celesta_deep_night}
  - id: horn_part
    instrument: horn
    voices:
      - id: horn_main
        clips:
          - {id: horn_lamplight, at: {bar: 17, beat: 1}, use: horn_lamplight}
          - {id: horn_deep_night, at: {bar: 33, beat: 1}, use: horn_deep_night}
  - id: harp_part
    instrument: harp
    voices:
      - id: harp_main
        clips:
          - {id: harp_orbit, at: {bar: 25, beat: 1}, use: harp_orbit}
  - id: strings_part
    instrument: strings
    voices:
      - id: strings_main
        clips:
          - {id: strings_first_stars, at: {bar: 9, beat: 1}, use: strings_first_stars}
          - {id: strings_lamplight, at: {bar: 17, beat: 1}, use: strings_lamplight}
          - {id: strings_orbit, at: {bar: 25, beat: 1}, use: strings_orbit}
          - {id: strings_deep_night, at: {bar: 33, beat: 1}, use: strings_deep_night}
  - id: bass_part
    instrument: bass
    voices:
      - id: bass_main
        clips:
          - {id: bass_lanterns_out, at: {bar: 1, beat: 1}, use: bass_lanterns_out}
          - {id: bass_first_stars, at: {bar: 9, beat: 1}, use: bass_first_stars}
          - {id: bass_lamplight, at: {bar: 17, beat: 1}, use: bass_lamplight}
          - {id: bass_orbit, at: {bar: 25, beat: 1}, use: bass_orbit}
          - {id: bass_deep_night, at: {bar: 33, beat: 1}, use: bass_deep_night}
processing:
  groups:
    piano:
      chain:
        - {processor: highpass, cutoff_hz: 50}
        - {processor: band_gain, low_hz: 2800, high_hz: 5500, gain_db: -3.0}
        - {processor: lowpass, cutoff_hz: 6500}
        - {processor: reverb, wet: 0.3, decay_seconds: 2.4, damping_hz: 3600}
        - {processor: gain, gain_db: 14.0}
        - {processor: balance, position: -0.2}
    celesta:
      chain:
        - {processor: highpass, cutoff_hz: 300}
        - {processor: band_gain, low_hz: 2500, high_hz: 6000, gain_db: -4.0}
        - {processor: lowpass, cutoff_hz: 6000}
        - {processor: reverb, wet: 0.38, decay_seconds: 2.6, damping_hz: 3500}
        # The Sonatina celesta is quiet: its peaks were 27 dB under the piano at 0 dB.
        - {processor: gain, gain_db: 18.0}
        - {processor: balance, position: 0.45}
    horn:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: lowpass, cutoff_hz: 4000}
        - {processor: reverb, wet: 0.45, decay_seconds: 2.8, damping_hz: 3000}
        - {processor: gain, gain_db: 0.0}
        - {processor: balance, position: 0.35}
    harp:
      chain:
        - {processor: highpass, cutoff_hz: 100}
        - {processor: lowpass, cutoff_hz: 6500}
        - {processor: reverb, wet: 0.3, decay_seconds: 2.2, damping_hz: 3800}
        - {processor: gain, gain_db: 13.0}
        - {processor: balance, position: 0.3}
    strings:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: lowpass, cutoff_hz: 4500}
        - {processor: reverb, wet: 0.34, decay_seconds: 2.4, damping_hz: 3200}
        - {processor: gain, gain_db: 1.0}
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 34}
        - {processor: compressor, threshold_db: -28.0, ratio: 2.5, attack_ms: 20.0, release_ms: 200.0, makeup_db: 2.0}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 250, q: 0.8, db: 1.0}
        - {processor: lowpass, cutoff_hz: 2500}
        - {processor: reverb, wet: 0.12, decay_seconds: 1.8, damping_hz: 2500}
        - {processor: gain, gain_db: -3.0}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 28}
      - {processor: compressor, threshold_db: -22.0, ratio: 1.5, attack_ms: 30.0, release_ms: 220.0, makeup_db: 1.0, knee_db: 6.0}
      - {processor: limiter, target_peak_db: -2.0, drive: 0.9, normalize: true}
  adaptive_sections: {mode: composition_master}
