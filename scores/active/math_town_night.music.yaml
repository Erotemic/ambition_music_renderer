schema: ambition.musicir.v3
id: math_town_night
title: Countably Many Stars
description: >-
  The night music of the central town of the Math dimension: the town is asleep, the lamps and a few
  windows are lit, and there are more stars than anyone can count. D dorian, 64 BPM, sparse. A piano
  ostinato and a slow night song; a celesta adds a few stars (1, 1, 2, 3 of them); a distant horn states
  the Euclid Street motif and the piano answers with its inversion; the harp turns five notes against
  eight; at the end the horn plays the premise and the celesta the conclusion. One of four cues for the
  day and night of the town.
notes:
  - 'Jon, 2026-10-15: the central town of the Math dimension gets a day/night cycle, "so music for morning, daytime, evening, and nighttime is a good idea. Let''s build distinct new music for this." This is the night cue. It is a new composition: it does not use the motifs of standing_on_shoulders or shoulders_at_rest.'
  - 'The family motif of the four town cues (Euclid Street): scale degrees 1 5 4 3 | 2 3 5, a premise and its conclusion. Here, in D minor: D | A G F- | E F A- on the horn in bars 17-19; the piano answers with the inversion in D dorian (D | G A B- | C B G-) in bars 20-22; the horn plays the conclusion (E F A) slowly in bars 23-24; in bars 36-37 the horn plays the premise and in bar 39 the celesta plays the conclusion.'
  - 'No drums. No held note is above A5; the celesta plays a few short notes from D5 to A5, and the highest note of the piano is G5 (one beat). The B natural of D dorian is the colour of the night song.'
  - 'Orbit (bars 25-32): the harp plays a cycle of five chord notes in eighth notes, so the cycle starts on a different eighth in each bar and comes back to the bar line after five bars.'
  - 'The file loops as a whole: bar 41 is bar 1. The last bar is A7sus4 on the piano and the bass, and its notes stop before the last eighth note; bar 1 is the D minor of the ostinato.'
seed: 2026101502
timebase: {ppq: 960}
meter: 4/4
tempo: 64
key: {tonic: D, mode: dorian}
end: {bar: 41, beat: 1}
form:
  - {id: lanterns_out, label: 'Lanterns out: the piano alone, then the bass', from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, role: loop_component, loopable: true}
  - {id: first_stars, label: 'First stars: the night song on the piano, the celesta counts the stars', from: {bar: 9, beat: 1}, to: {bar: 17, beat: 1}, role: loop_component, loopable: true}
  - {id: lamplight, label: 'Lamplight: a distant horn states the Euclid Street motif, the piano answers', from: {bar: 17, beat: 1}, to: {bar: 25, beat: 1}, role: loop_component, loopable: true}
  - {id: orbit, label: 'Orbit: the harp turns five notes against eight', from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, role: loop_component, loopable: true}
  - {id: deep_night, label: 'Deep night: the song again, the motif once more, and the piano alone', from: {bar: 33, beat: 1}, to: {bar: 41, beat: 1}, role: loop_component, loopable: true}
render:
  backend: pretty-midi
  sample_rate: 48000
  ogg_quality: 7
  metadata_markers:
    - {bar: 1, id: m1, label: 'Lanterns out'}
    - {bar: 9, id: m9, label: 'First stars'}
    - {bar: 17, id: m17, label: 'Lamplight'}
    - {bar: 25, id: m25, label: 'Orbit'}
    - {bar: 33, id: m33, label: 'Deep night'}
instruments:
  - name: piano
    group: piano
    program: acoustic_grand_piano
    volume: 100
    pan: 64
    expression: 104
    instrument_backend: {kind: sfz, library_ref: freepats.salamander_grand}
  - name: celesta
    group: celesta
    program: celesta
    volume: 96
    pan: 64
    expression: 100
    instrument_backend:
      kind: sfz
      # Sonatina Celeste (not in the instrument catalog): a plain velocity
      # response. The VPO3 celesta needs CC1 dynamics and is silent at soft
      # velocities.
      sfz: "/data/audio-tools/sfz/Sonatina/SymphonicOrchestra/sso-4.0/Sonatina Symphonic Orchestra/Percussion/Celeste.sfz"
  - name: horn
    group: horn
    program: french_horn
    volume: 100
    pan: 64
    expression: 104
    instrument_backend: {kind: sfz, library_ref: orchestra.horns_sustain}
  - name: harp
    group: harp
    program: orchestral_harp
    volume: 100
    pan: 64
    expression: 104
    instrument_backend: {kind: sfz, library_ref: folk.harp}
  - name: strings
    group: strings
    program: string_ensemble_1
    volume: 84
    pan: 64
    expression: 92
    # The mod wheel (CC1) sets the level of this VPO patch.
    modulation: 48
    instrument_backend: {kind: sfz, library_ref: vpo.strings}
  - name: bass
    group: bass
    program: acoustic_bass
    volume: 110
    pan: 64
    expression: 112
    instrument_backend: {kind: sfz, library_ref: bass.meatbass_pizz, required: true, settings: {fold_to_range: false}}
