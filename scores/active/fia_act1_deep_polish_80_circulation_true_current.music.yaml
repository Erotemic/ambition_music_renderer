schema: ambition.musicir.v1
id: fia_act1_deep_polish_80_circulation_true_current
title: 'Fia Act I Deep Polish 80 — Circulation: True Current'
seed: 20260816
notes: Deep composition polish. Keep the accepted bass anchors and rolling half-beat engine, but remove accidental inner-voice
  crunch, clarify the harmonic progression, and replace the reactive lead with a stable eight-bar theme, a contrasting
  middle phrase, and a restrained return. Salamander grand remains the sole instrument.
