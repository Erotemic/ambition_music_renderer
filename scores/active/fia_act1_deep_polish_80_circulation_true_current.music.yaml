  bpm: 98
  map:
  - bar: 16
    bpm: 101
    ramp_bars: 2
  - bar: 24
    bpm: 103
    ramp_bars: 2
  - bar: 32
    bpm: 94
    ramp_bars: 4
meter:
  beats_per_bar: 4
  beat_unit: 4
constraints:
  voice_leading: minimize_motion
  no_clusters: true
render:
  sample_rate: 48000
  ogg_quality: 6
  backend: pretty-midi
postprocess:
  gain_db: -0.25
  highpass_hz: 24
  lowpass_hz: 15500
  reverb_wet: 0.065
  reverb_decay_seconds: 1.35
  reverb_damping_hz: 7000
  stereo_width: 0.05
  compressor_threshold_db: -14.5
  compressor_ratio: 1.12
  compressor_attack_ms: 38.0
  compressor_release_ms: 220.0
  compressor_makeup_db: 0.0
  limiter_drive: 0.9
  normalize: true
  target_peak_db: -3.0
instruments:
- name: fia_piano
  group: piano
  program: acoustic_grand_piano
  volume: 106
  pan: 64
  expression: 112
  reverb: 16
  instrument_backend:
    kind: sfz
    library_ref: freepats.salamander_grand
    prefer:
    - salamander
    - grand
    - piano
    - flac
    optional: true
    fallback_backend: pretty-midi
authoring:
  audition_axis: rolling harmony and melody form one phrase engine
  bass_policy: Every bar-opening bass anchor is copied exactly from polish 77; the rolling rhythm is unchanged.
  backing_revision: Upper arpeggio tones are revoiced into clear E-major-family sonorities and shortened so adjacent
    half-beat notes do not smear into each other.
  melody_revision: Eight-bar A theme, varied A2, longer B-section arcs, and a quieter A-prime return. Strong beats favor
    roots, thirds, fifths, and sevenths already established by the backing.
  special_hook: The opening B–E–G# lift answers the rising bass path; the same rhythmic cell returns with different chord-tone
    destinations.
  foreshadowing_policy: No wrong-note attack. One quiet F# extension over the returning E harmony is simply held a little
    longer than its first appearance.
  subtle_foreshadowing_color:
    bar: 24
    beat: 3.5
    pitch: F#5
    duration: 0.42
    velocity: 70
    idea: A normal ninth over E, not a foreign pitch; only its placement on the late return makes it slightly uncanny.
  instrument: freepats.salamander_grand
