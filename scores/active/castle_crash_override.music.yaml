notes:
- 'Playback: repeat ONLY adaptive/castle_loop/*.full.ogg (48 bars / 68.571 s), starting at the original piano opening.
  The initial threshold section is render-only and is intentionally not played. It duplicates the loop ending at
  MIDI-tick precision to prime sampled notes, amp/delay/reverb, and master state.'
- Original piano motif, guitar bends, all 48 musical bars, and v6 mix settings are preserved. The final 16th-note
  crash/open-hat was replaced by a drum turnaround which leaves air before the next downbeat. Do not loop the whole
  full_soundtrack_preview.ogg.
- 'v4 user direction: Salamander grand piano is the MAIN melodic voice. Guitar is deliberately foregrounded only
  during the two solo sections. Bass is a quiet root-and-fifth foundation, not a counter-melody.'
- 'Remove Secret Passage entirely: no F/C/Bb/A contrasting passage or hidden_walkway material. The castle hook repeats
  without progressive instrumentation or an unrelated melodic detour.'
- 'Guitar bends follow Carry the One MusicIR v3 technique: clip-local pitch_bend automation with a -1365 to 0 scooped
  attack, smooth 1/64 resolution, and short +/- pitchbend vibrato. The user must verify actual bends in the workstation
  render.'
- Keep two stereo guitar chug groups, Emily single-note lead with Guitarix drive, Big Rusty drumkit, atmospheric
  organ stabs, and supportive Growlybass. All content remains original, not a Nintendo melody transcription.
