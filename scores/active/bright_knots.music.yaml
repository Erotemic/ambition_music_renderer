schema: ambition.musicir.v1
id: bright_knots
title: Bright Knots
seed: 202608081804
notes: 'High-quality groove/lead revision. The opening third rise now begins only after the same recovery space that precedes the second rise, uses the same three-note internal cadence, omits the BAM, and hands directly into the paired descents. Transition and jam lead timbres are intentionally separate: the transition keeps a restrained sine-FM voice while jam sections use a warmer saw-carrier FM voice with more harmonic animation. Jam lead phrases are recomposed as sparse, shaped responses rather than continuous noodling. Mix gains are rebalanced from bundle diagnostics so melody no longer overwhelms Rhodes/saw/motion. Practical sound-design reference: Matt Tinkler, https://www.youtube.com/watch?v=hPy-4XBKGVo; cited as a practical reference for a well-established FM technique.'
