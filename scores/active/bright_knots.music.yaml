schema: ambition.musicir.v1
id: bright_knots
title: Bright Knots
seed: 202608082027
notes: >-
  Composer-first rewrite. The prior draft treated irregularity as a large set of unrelated decimal
  onsets and even let several five-bar transition layers spill into local bars 5-7. This version keeps
  the abrupt rise/BAM/staircase language but compresses it into a three-bar ensemble transition, then
  gives the jams a small number of recurring rhythmic fingerprints: a repeatable bass hook, displaced
  Rhodes punches, a short-short-long chiff answer, and drums that answer the bass instead of tracing it.
  Jam melodies are written as singable four-bar questions and varied answers, with deliberate holes,
  held notes, and one emotionally excessive leap instead of continuous lead commentary. Transition and
  jam lead timbres remain separate. The subtle low-ratio FM setup follows Matt Tinkler's practical FM
  synthesis walkthrough as a sound-design reference for an established technique; it is not presented
  as the origin of FM synthesis: https://www.youtube.com/watch?v=hPy-4XBKGVo

