end: {bar: 65, beat: 1}
form:
  - {id: ice_wind, label: 'Ice wind: wind, glasses and a far call', from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, energy: 0.3, density: 0.3, role: loop_component, loopable: true}
  - {id: crossing, label: 'Crossing: the theme into the wind', from: {bar: 9, beat: 1}, to: {bar: 17, beat: 1}, energy: 0.5, density: 0.5, role: loop_component, loopable: true}
  - {id: mammoth, label: 'Mammoth: heavy steps, a stern variant', from: {bar: 17, beat: 1}, to: {bar: 25, beat: 1}, energy: 0.65, density: 0.6, role: loop_component, loopable: true}
  - {id: thaw, label: 'Thaw: the ice melts toward A major', from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, energy: 0.45, density: 0.45, role: loop_component, loopable: true}
  - {id: first_maize, label: 'First Maize: the maize dance', from: {bar: 33, beat: 1}, to: {bar: 41, beat: 1}, energy: 0.7, density: 0.7, role: loop_component, loopable: true}
  - {id: teosinte, label: 'Teosinte: a seed grows into a phrase', from: {bar: 41, beat: 1}, to: {bar: 49, beat: 1}, energy: 0.6, density: 0.6, role: loop_component, loopable: true}
  - {id: harvest, label: 'Harvest: the crossing theme in A major', from: {bar: 49, beat: 1}, to: {bar: 57, beat: 1}, energy: 0.8, density: 0.8, role: loop_component, loopable: true}
  - {id: return, label: 'Return: the wind again, back to A minor', from: {bar: 57, beat: 1}, to: {bar: 65, beat: 1}, energy: 0.35, density: 0.35, role: loop_component, loopable: true}
