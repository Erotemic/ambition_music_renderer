  - {id: before_row, from: {bar: 25, beat: 1}, to: {bar: 26, beat: 1}, energy: 0.1, density: 0.0, role: 'silence: a ring and a lead-in'}
  - {id: row, from: {bar: 26, beat: 1}, to: {bar: 42, beat: 1}, energy: 0.25, density: 0.3, loopable: true, role: 'the Row and the railhead: guitar, the detour in minor on the harmonica, the works far off'}
