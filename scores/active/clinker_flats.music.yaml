schema: ambition.musicir.v3
id: clinker_flats
title: Clinker Flats
description: >-
  The Frontier's smelter town down the line from Halfway Siding: the yard and the works on a half-time kit with anvils on the backbeat, and the Row of shacks under them on the way to the railhead, where the town's detour turns minor on a harmonica. Generated by dev/compose_halfway_siding.py: edit that, not
  this file.
notes:
  - 'Jon, 2026-11-20: the Frontier needs more than two western tracks. Clinker Flats had borrowed a section of the town cue; this is its own.'
  - 'The clinker: A C D Eb, D C A. The Row says the detour in minor: A D E F, E D B, A.'
  - 'The game binds the sections to rooms (Ambition music_cues.ron): works (the yard, the works), row (the Row, the railhead).'
seed: 1132
timebase: {ppq: 960}
meter: 4/4
tempo: 76
key: {tonic: A, mode: minor}
end: {bar: 43, beat: 1}
