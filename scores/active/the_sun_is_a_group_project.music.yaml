schema: ambition.musicir.v1
id: the_sun_is_a_group_project
title: The Sun Is a Group Project
seed: 202608072056
notes: 'Complete rhythmic and loudness rebuild. The foreground is authored as literal note events so silence, anticipations,
  held notes, and asymmetric attack spacing are structural rather than simulated by gate lengths. The four-bar singalong
  hook uses repeated ascending cells but attacks at deliberately uneven positions. Section density grows by handoff:
  the human-like lead and cheap square synth alternate ownership of the melody instead of stacking at the climax.
  Sparse sections receive positive section mix gain and dense sections negative gain so playback level remains stable.
  The acoustic/organ/bass palette keeps the communal Edward Sharpe / Neutral Milk Hotel side while the square-wave
  handoffs and simple pop harmony retain the psychedelic MGMT influence.'
