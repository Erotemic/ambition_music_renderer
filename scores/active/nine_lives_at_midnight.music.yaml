title: Nine Lives at Midnight
seed: 2026090701
description: 'Original ninja rooftop/action theme. A repeated-note leap and falling answer anchor an explicit, hand-voiced
  score: shamisen propulsion, interlocking koto, audible electric bass, and taiko-led percussion. The broad skyline refrain
  earns its return after a half-time courtyard and a shamisen chase.'
