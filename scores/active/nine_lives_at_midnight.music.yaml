# Original composition, September 2026. Exact phrases are the musical authority.
# Beat positions in event lists are fractions of a WHOLE note, not beat counts.
# The threshold is an exact orchestral copy of the final eight loop bars.
# Render the full timeline, then use adaptive/zone_loop/*.full.ogg for the zone:
# the threshold supplies real synth/reverb pre-roll; never crop and re-render
# the loop alone. The full soundtrack preview includes the threshold once.
# Sampled bass/strings are required; missing libraries must not become a
# different instrument unnoticed. Japanese lead/plucks/taiko use GM programs
# because the checked-in SFZ catalog has no corresponding Japanese roles.
