schema: ambition.musicir.v1
id: fia_alt_act2_fault_current
title: "Fia II — Fault Current"
seed: 202608161102
notes: >-
  Darker sibling of Bench Test. The two-bar rhythmic fingerprint is preserved,
  but the major third collapses into F# minor and the hook moves from warm
  electric piano toward a drier EP/square hybrid. The same offbeat clavinet and
  pocket bass now feel compulsory rather than playful. The single wrong metal
  tooth from Act I has become a recurring three-note fault cell buried in the
  machinery. Still recognizably Fia, but the workshop has stopped feeling safe.
