schema: ambition.musicir.v1
id: fia_hybrid_act2_under_load
title: "Fia II — Under Load"
seed: 202608161202
notes: >-
  The chamber-electronic Fia theme under moral and mechanical load. The same
  3/4 trust contour remains, but its major third collapses to minor and the piano
  answer is delayed. The machine layer that was almost decorative in Calibration
  Light now becomes structurally useful: a square pulse repeats the former wrong
  calibration interval, synth bass reinforces the cello, and dry clicks settle
  into a predictable cycle. This is not villain music. It should feel like a good
  mechanic becoming too certain that the system must be forced back into tolerance.
tempo: {bpm: 100}
meter: {beats_per_bar: 3, beat_unit: 4}
constraints: {voice_leading: minimize_motion, no_clusters: true}
render:
  sample_rate: 48000
  ogg_quality: 6
  backend: pretty-midi
  sfizz:
    library_roots: [/data/audio-tools/sfz, /data/audio-tools]
    fallback_backend: pretty-midi
postprocess:
  gain_db: -0.7
  highpass_hz: 31
  lowpass_hz: 11100
  presence_low_hz: 1400
  presence_high_hz: 3600
  presence_db: -0.10
  reverb_wet: 0.115
  reverb_decay_seconds: 1.30
  reverb_damping_hz: 5000
  stereo_width: 0.10
  compressor_threshold_db: -17.5
  compressor_ratio: 2.1
  compressor_attack_ms: 17
  compressor_release_ms: 130
  compressor_makeup_db: 0.45
  compressor_knee_db: 6
  limiter_drive: 0.88
  normalize: true
  target_peak_db: -7.0
stem_postprocess:
  highpass_hz: 29
  reverb_wet: 0.016
  reverb_decay_seconds: 0.60
  reverb_damping_hz: 5200
  stereo_width: 0.03
  normalize: false
  target_peak_db: -3.0
group_postprocess:
  lead: {gain_db: 0.0, highpass_hz: 90, lowpass_hz: 10000, reverb_wet: 0.018}
  keys: {gain_db: -0.2, highpass_hz: 80, lowpass_hz: 9800, reverb_wet: 0.012}
  strings: {gain_db: -0.7, highpass_hz: 80, lowpass_hz: 8800, reverb_wet: 0.024}
  low_strings: {gain_db: -0.5, highpass_hz: 30, lowpass_hz: 7600}
  machine: {gain_db: -1.8, highpass_hz: 120, lowpass_hz: 9400, reverb_wet: 0.004}
  pulse: {gain_db: -2.2, highpass_hz: 38, lowpass_hz: 6500}
  percussion: {gain_db: -4.8, highpass_hz: 100, lowpass_hz: 10400, transient_tame: 0.035, reverb_wet: 0.001}
instruments:
  - name: dark_piano
    group: keys
    program: acoustic_grand_piano
    volume: 82
    pan: 48
    expression: 96
    instrument_backend: {kind: sfz, library_ref: freepats.salamander_grand, prefer: [piano, sustain], optional: true, fallback_backend: pretty-midi}
  - name: low_clarinet
    group: lead
    program: clarinet
    volume: 78
    pan: 70
    expression: 96
    modulation: 5
    instrument_backend: {kind: sfz, library_ref: vpo.clarinet_solo_perf, prefer: [clarinet, solo, legato], optional: true, fallback_backend: pretty-midi}
  - name: tense_viola
    group: strings
    program: viola
    volume: 68
    pan: 74
    expression: 92
    instrument_backend: {kind: sfz, library_ref: strings.violas, prefer: [viola, sustain], optional: true, fallback_backend: pretty-midi}
  - name: weighted_cello
    group: low_strings
    program: cello
    volume: 76
    pan: 40
    expression: 98
    instrument_backend: {kind: sfz, library_ref: strings.celli, prefer: [cello, sustain], optional: true, fallback_backend: pretty-midi}
  - {name: fault_square, group: machine, program: lead_square, volume: 50, pan: 80, expression: 72, modulation: 2}
  - {name: load_motor, group: pulse, program: synth_bass_2, volume: 58, pan: 58, expression: 74}
  - {name: fault_ping, group: machine, program: vibraphone, volume: 48, pan: 84, expression: 68}
  - {name: load_clicks, group: percussion, is_drum: true, volume: 62, pan: 62, expression: 74}
motifs:
  - id: trust_under_load
    root: D5
    intervals: [0, 2, 3, 7, 5, 2, 3, 0]
    rhythm: [0.5, 0.5, 0.75, 0.75, 0.5, 0.5, 1.0, 1.5]
    velocities: [0.58, 0.62, 0.68, 0.76, 0.66, 0.60, 0.64, 0.50]
  - id: reluctant_answer
    root: A4
    intervals: [0, 1, 5, 3, 1, -2]
    rhythm: [0.75, 0.25, 0.5, 0.5, 1.0, 3.0]
    velocities: [0.44, 0.48, 0.58, 0.54, 0.50, 0.40]
  - id: fault_cycle
    root: D4
    intervals: [0, 1, 6, 5]
    rhythm: [0.25, 0.25, 0.5, 2.0]
    velocities: [0.42, 0.46, 0.52, 0.28]
  - id: old_calibration
    root: D5
    intervals: [0, 2, 4]
    rhythm: [0.5, 0.5, 2.0]
    velocities: [0.28, 0.30, 0.20]
layer_templates:
  piano_pressure:
    kind: arpeggio
    instrument: dark_piano
    octave: 3
    pattern: [0, 2, 1, 3, 1, 2]
    step: 0.5
    duration_beats: 0.36
    velocity: 38
    density: 0.78
    articulation: legato
    humanize_ms: 7
    humanize_velocity_pct: 4
  cello_load:
    kind: bassline
    instrument: weighted_cello
    octave: 2
    pattern: [[0, 0.0, 1.18], [12, 1.5, 0.62], [0, 2.25, 0.48]]
    velocity: 43
    articulation: tenuto
    humanize_ms: 6
    humanize_velocity_pct: 3
  viola_pressure:
    kind: pad_chords
    instrument: tense_viola
    octave: 3
    every_bars: 1
    duration_beats: 2.78
    velocity: 30
    articulation: tenuto
    voicing: open
    humanize_ms: 8
    humanize_velocity_pct: 3
  fia_minor_voice:
    kind: motif
    instrument: low_clarinet
    motif: trust_under_load
    velocity: 57
    articulation: legato
    gate: 0.92
    humanize_ms: 5
    humanize_velocity_pct: 3
  late_piano_answer:
    kind: motif
    instrument: dark_piano
    motif: reluctant_answer
    velocity: 46
    articulation: tenuto
    gate: 0.90
    humanize_ms: 6
    humanize_velocity_pct: 3
  fault_machine:
    kind: motif
    instrument: fault_square
    motif: fault_cycle
    velocity: 38
    articulation: normal
    gate: 0.62
    humanize_ms: 1
    humanize_velocity_pct: 2
  motor_load:
    kind: bassline
    instrument: load_motor
    octave: 2
    pattern: [[0, 0.0, 0.32], [7, 1.0, 0.18], [12, 2.0, 0.26]]
    velocity: 38
    articulation: staccato
    humanize_ms: 2
    humanize_velocity_pct: 2
  click_cycle:
    kind: drums
    instrument: load_clicks
    humanize_ms: 3
    humanize_velocity_pct: 4
    events:
      - {drum: side_stick, beats: [1.0, 2.0], velocity: 30, duration_beats: 0.04}
      - {drum: claves, beats: [0.0], velocity: 24, duration_beats: 0.04, probability: 0.72}
playback:
  mode: section_stem_matrix
  loop_components: [fia_hybrid_act2_loop]
  exit_policy:
    request_outro: next_valid_exit_bar
    fade_aggressive_stems_beats: 5
    bridge_stems: [keys, strings, low_strings]
    fade_stems: [lead, machine, pulse, percussion]
state_map:
  default:
    section: fia_hybrid_act2_loop
    stems: {lead: 0.72, keys: 0.70, strings: 0.52, low_strings: 0.64, machine: 0.44, pulse: 0.40, percussion: 0.24}
  quiet:
    section: fia_hybrid_act2_loop
    stems: {lead: 0.54, keys: 0.54, strings: 0.40, low_strings: 0.50, machine: 0.30, pulse: 0.26, percussion: 0.14}
sections:
  - id: fia_hybrid_act2_loop
    kind: loop_component
    label: Fia Act II hybrid - under load
    bars: 32
    intensity: 0.67
    density: 0.61
    loopable: true
    valid_exit_local_bars: [8, 16, 24, 32]
    harmony:
      [Dm, Bbmaj7, Gm, A, Dm/F, C, Bbmaj7, A,
       Dm, Dm(maj7), Bbmaj7, Gm, Ebdim, A, Dm/A, A,
       Dm, Bbmaj7, Gm, A, Dm/F, C, Gm, A,
       Bbmaj7, Gm/D, Dm, Dm(maj7), Ebdim, A, Dm/A, Dm]
    layers:
      - piano_pressure
      - cello_load
      - viola_pressure
      - motor_load
      - click_cycle
      - {template: fia_minor_voice, starts: [[0, 0.0], [8, 0.0], [16, 0.0], [24, 0.0]]}
      - {template: late_piano_answer, starts: [[3, 0.0], [11, 0.0], [19, 0.0], [27, 0.0]]}
      - {template: fault_machine, starts: [[6, 0.0], [14, 0.0], [22, 0.0], [30, 0.0]]}
      - kind: motif
        instrument: low_clarinet
        motif: old_calibration
        velocity: 26
        articulation: legato
        gate: 0.88
        starts: [[21, 0.0]]
