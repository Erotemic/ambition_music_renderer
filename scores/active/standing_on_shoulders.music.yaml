schema: ambition.musicir.v3
id: standing_on_shoulders
title: Standing on Shoulders
seed: 2026090501
description: >-
  New MusicIR v3 rendition of the extended GNU-ton boss theme, using
  scores/experiments/standing_on_shoulders_v_census_hifi.music.yaml as the
  musical reference. Preserve its 44-bar scholar-versus-giant form, harmony,
  grounded recursive motif, brass declaration, giant tread, and final charge,
  while improving contrast, sampled rhythm-section realization, transitions,
  and composition-level mastering. The previous active v1 cue is preserved at
  scores/archive/standing_on_shoulders_v1.music.yaml, and the census-hi-fi
  experiment remains unchanged for direct A/B regeneration.

timebase: {ppq: 960}
meter: 4/4
tempo: 88
key: E minor
end: {bar: 45, beat: 1}

# Keep the historical adaptive/game section identities and 44-bar form.
form:
  - id: the_giant_approaches
    from: {bar: 1, beat: 1}
    to: {bar: 5, beat: 1}
    energy: 0.72
    density: 0.64
    notes: The giant arrives first; scholar voice withheld.
  - id: hands_of_gnu
    from: {bar: 5, beat: 1}
    to: {bar: 17, beat: 1}
    energy: 0.84
    density: 0.80
    notes: Main thesis; scholar and giant compete without maxing out the mix.
  - id: head_descends
    from: {bar: 17, beat: 1}
    to: {bar: 25, beat: 1}
    energy: 0.76
    density: 0.68
    notes: Vulnerability window; rhythm guitars fall away before rebuilding.
  - id: the_weight_of_knowledge
    from: {bar: 25, beat: 1}
    to: {bar: 37, beat: 1}
    energy: 0.94
    density: 0.92
    notes: Full confrontation, with guitar answers and stronger four-bar motion.
  - id: recursive_crescendo
    from: {bar: 37, beat: 1}
    to: {bar: 41, beat: 1}
    energy: 1.00
    density: 1.00
    notes: Compression of the recursive idea into two-bar statements.
  - id: final_footnote
    from: {bar: 41, beat: 1}
    to: {bar: 45, beat: 1}
    energy: 0.98
    density: 0.96
    notes: Fanfare, hard-stop cadence, final giant footfall.

# Historical harmony, preserved exactly so the recognizable theme still lands.
harmony:
  progression:
    [Em, Em, G, D,
     Em, G, D, Em, Em, G, Bm, Em, Em, G, Am, Em,
     Am, G, Em, Bm, C, G, D, Em,
     Em, D, G, Bm, Em, D, Am, Em, Em, G, D, Em,
     Em, Bm, G, Em,
     Em, G, D, Em]
  cycle: false

render:
  sample_rate: 48000
  ogg_quality: 6
  backend: pretty-midi

# V3 uses the canonical processing authority. Sampled instruments are selected
# by stable checked-in library_ref identities rather than workstation paths.
processing:
  groups:
    giant_guitars:
      chain:
        - {processor: highpass, cutoff_hz: 68}
        - processor: pedalboard
          wet_mix: 1.0
          effects:
            - {effect: gain, gain_db: 4.0}
            - {effect: distortion, drive_db: 10.5}
            - {effect: compressor, threshold_db: -20.0, ratio: 2.2, attack_ms: 8.0, release_ms: 95.0}
            - {effect: gain, gain_db: -4.0}
        - {processor: lowpass, cutoff_hz: 10200}
        - {processor: transient_tame, amount: 0.025, lowpass_hz: 6200}
    giant_lead:
      chain:
        - {processor: highpass, cutoff_hz: 88}
        - processor: pedalboard
          effects:
            - {effect: gain, gain_db: 3.0}
            - {effect: distortion, drive_db: 8.0}
            - {effect: compressor, threshold_db: -21.0, ratio: 2.0, attack_ms: 10.0, release_ms: 110.0}
            - {effect: gain, gain_db: -2.5}
        - {processor: lowpass, cutoff_hz: 10800}
        - {processor: reverb, wet: 0.025, decay_seconds: 0.85, damping_hz: 6200}
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 29}
        - {processor: lowpass, cutoff_hz: 5200}
        - {processor: compressor, threshold_db: -23.0, ratio: 2.4, attack_ms: 18.0, release_ms: 110.0, makeup_db: 1.0}
        - {processor: gain, gain_db: 1.2}
    drums:
      chain:
        - {processor: highpass, cutoff_hz: 29}
        - {processor: transient_tame, amount: 0.012, lowpass_hz: 7600}
        - {processor: gain, gain_db: -1.0}
    scholar:
      chain:
        - {processor: highpass, cutoff_hz: 118}
        - {processor: lowpass, cutoff_hz: 10800}
        - {processor: reverb, wet: 0.018, decay_seconds: 0.9, damping_hz: 6100}
        - {processor: gain, gain_db: 1.3}
    brass:
      chain:
        - {processor: highpass, cutoff_hz: 95}
        - {processor: lowpass, cutoff_hz: 11000}
        - {processor: reverb, wet: 0.022, decay_seconds: 1.0, damping_hz: 6200}
        - {processor: gain, gain_db: 1.0}
    strings:
      chain:
        - {processor: highpass, cutoff_hz: 72}
        - {processor: lowpass, cutoff_hz: 11200}
        - {processor: reverb, wet: 0.035, decay_seconds: 1.25, damping_hz: 5600}
        - {processor: stereo_width, amount: 0.07}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 31}
      - {processor: compressor, threshold_db: -18.5, ratio: 3.0, attack_ms: 13.0, release_ms: 105.0, makeup_db: 2.0, knee_db: 6.0}
      - {processor: reverb, wet: 0.040, decay_seconds: 1.25, damping_hz: 5400}
      - {processor: stereo_width, amount: 0.075}
      - {processor: limiter, target_peak_db: -2.0, drive: 1.02, normalize: true}
  adaptive_sections: {mode: composition_master}

instruments:
  # Scholar: preserve the recognizable organ/harpsichord identity. No stable
  # sampled refs are currently catalogued for these roles, so their GM voices
  # intentionally remain the portable realization.
  - {name: organ_scholar, group: scholar, program: drawbar_organ, volume: 88, pan: 70, expression: 98, modulation: 4, chorus: 8, reverb: 16}
  - {name: harpsichord_voice, group: scholar, program: harpsichord, volume: 70, pan: 84, expression: 88, reverb: 12}

  # Giant rhythm: two sampled single-note electric-guitar takes, then canonical
  # group processing supplies the distorted amplifier character.
  - name: giant_guitar_left
    group: giant_guitars
    program: clean_guitar
    volume: 100
    pan: 28
    expression: 108
    instrument_backend: {kind: sfz, library_ref: guitar.clean, prefer: [shinyguitar, electric_five]}
  - name: giant_guitar_right
    group: giant_guitars
    program: clean_guitar
    volume: 96
    pan: 100
    expression: 104
    instrument_backend: {kind: sfz, library_ref: guitar.clean, prefer: [shinyguitar, electric_four]}
  - name: giant_lead
    group: giant_lead
    program: clean_guitar
    volume: 91
    pan: 70
    expression: 106
    # The census-hi-fi reference used Emilyguitar's single-note program.
    # Keep the stable Emily source identity and strongly prefer its basic patch
    # over the chord/keyswitch programs for this monophonic tread voice.
    instrument_backend: {kind: sfz, library_ref: guitar.emily, prefer: [emily_basic, basic, single_note]}

  - name: giant_bass
    group: bass
    program: fingered_bass
    volume: 112
    pan: 62
    expression: 112
    instrument_backend: {kind: sfz, library_ref: bass.swag}

  - name: stomp_kit
    group: drums
    is_drum: true
    volume: 122
    pan: 64
    expression: 120
    instrument_backend: {kind: sfz, library_ref: drums.big_rusty}

  - name: horn_hits
    group: brass
    program: french_horn
    volume: 94
    pan: 62
    expression: 102
    instrument_backend: {kind: sfz, library_ref: orchestra.horns_staccato}
  - name: brass_bed
    group: brass
    program: brass_section
    volume: 82
    pan: 68
    expression: 94
    instrument_backend: {kind: sfz, library_ref: vpo.brass}

  - name: strings_academic
    group: strings
    program: string_ensemble_1
    volume: 78
    pan: 64
    expression: 88
    instrument_backend: {kind: sfz, library_ref: vpo.strings}

materials:
  # The defining recursive scholar statement. This grounded variant keeps the
  # recognizable ascent/return while avoiding the old exposed high F# sustain.
  scholar_recursive:
    kind: motif
    root: E4
    intervals: [0, 2, 3, 5, 7, 10, 12, 10, 7, 5, 3, 2, 0, -2, 3, 0]
    rhythm: [0.25, 0.25, 0.25, 0.25, 0.5, 0.5, 1.0, 0.5, 0.5, 0.25, 0.25, 0.25, 0.25, 0.5, 1.5, 2.0]
    durations: [0.25, 0.10, 0.25, 0.25, 0.5, 0.5, 1.0, 0.5, 0.5, 0.25, 0.25, 0.10, 0.25, 0.5, 0.5, 1.0]
    velocities: [0.88, 0.78, 0.82, 0.86, 0.90, 0.94, 1.00, 0.90, 0.86, 0.80, 0.78, 0.80, 0.84, 0.88, 0.90, 0.78]

  scholar_quip:
    kind: motif
    root: E5
    intervals: [0, 3, 5, 7, 5, 3, 0, 3]
    rhythm: [0.25, 0.25, 0.25, 0.5, 0.25, 0.5, 0.5, 1.5]
    velocities: [0.90, 0.80, 0.86, 0.96, 0.86, 0.80, 0.84, 0.72]

  brass_declaration:
    kind: motif
    root: E4
    intervals: [0, 0, 7, 5, 3, 0, 12, 7]
    rhythm: [0.5, 0.5, 1.0, 0.5, 0.5, 1.0, 1.0, 3.0]
    velocities: [0.90, 0.88, 1.00, 0.92, 0.86, 0.90, 1.00, 0.82]

  giant_tread:
    kind: motif
    root: B3
    intervals: [0, -2, -4, -7]
    rhythm: [1.5, 1.0, 1.0, 0.5]
    durations: [1.25, 0.4, 0.4, 0.4]
    velocities: [1.00, 0.84, 0.96, 0.80]

  final_charge:
    kind: motif
    root: E4
    intervals: [0, 3, 7, 10, 12, 15, 12, 10, 7, 5, 3, 0]
    rhythm: [0.5, 0.5, 0.5, 0.5, 1.0, 1.0, 0.5, 0.5, 0.5, 0.5, 1.0, 1.0]
    velocities: [0.86, 0.90, 0.94, 0.98, 1.00, 1.00, 0.92, 0.88, 0.86, 0.84, 0.90, 0.96]

parts:
  - id: drums_part
    instrument: stomp_kit
    voices:
      - id: kit
        clips:
          # Preserve the crash that defined the original opening, then use
          # section-boundary crashes as form punctuation rather than every bar.
          - id: section_crashes
            at: {bar: 1, beat: 1}
            events:
              - {id: opening_crash, at: {beats: 0}, dur: 1/4, pitch: {kind: drum, name: crash}, velocity: 122}
              - {id: hands_crash, at: {beats: 16}, dur: 1/4, pitch: {kind: drum, name: crash}, velocity: 112}
              - {id: head_crash, at: {beats: 64}, dur: 1/4, pitch: {kind: drum, name: crash_2}, velocity: 108}
              - {id: weight_crash, at: {beats: 96}, dur: 1/4, pitch: {kind: drum, name: crash}, velocity: 116}
              - {id: crescendo_crash, at: {beats: 144}, dur: 1/4, pitch: {kind: drum, name: china}, velocity: 116}
              - {id: final_crash, at: {beats: 160}, dur: 1/4, pitch: {kind: drum, name: crash_2}, velocity: 122}

          - id: giant_stomp_intro
            at: {bar: 1, beat: 1}
            duration: {bars: 4}
            generate:
              kind: drums.pattern
              humanize_ms: 2.5
              bar_velocity_pattern: [1.00, 0.90, 0.94, 1.02]
              fill_every_bars: 4
              fill_mode: overlay
              events:
                - {drum: kick, beats: [0, 2], velocity: 116, duration_beats: 0.14}
                - {drum: snare, beats: [1, 3], velocity: 108, duration_beats: 0.14}
                - {drum: closed_hat, beats: [0, 1, 2, 3], velocity: 58, duration_beats: 0.07}
              fill_events:
                - {drum: low_tom, beats: [3.0, 3.5], velocity: 90}

          - id: hands_stomp
            at: {bar: 5, beat: 1}
            duration: {bars: 12}
            generate:
              kind: drums.pattern
              humanize_ms: 2.4
              bar_velocity_pattern: [0.92, 0.96, 1.00, 1.04]
              fill_every_bars: 4
              fill_mode: overlay
              events:
                - {drum: kick, beats: [0, 2, 2.75], velocity: 112}
                - {drum: snare, beats: [1, 3], velocity: 112}
                - {drum: closed_hat, beats: [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5], velocity: 62}
              fill_events:
                - {drum: low_tom, beats: [3.0], velocity: 82}
                - {drum: mid_tom, beats: [3.5], velocity: 90}
                - {drum: open_hat, beats: [3.75], velocity: 80}

          - id: head_descends_stomp
            at: {bar: 17, beat: 1}
            duration: {bars: 8}
            generate:
              kind: drums.pattern
              humanize_ms: 3.0
              bar_velocity_pattern: [0.82, 0.86, 0.90, 0.96]
              fill_every_bars: 4
              fill_mode: overlay
              events:
                - {drum: kick, beats: [0, 2], velocity: 104}
                - {drum: snare, beats: [1, 3], velocity: 104}
                - {drum: closed_hat, beats: [0, 1, 2, 3], velocity: 50}
              fill_events:
                - {drum: low_tom, beats: [2.5, 3.0], velocity: 84}
                - {drum: high_tom, beats: [3.5], velocity: 94}

          - id: weight_stomp
            at: {bar: 25, beat: 1}
            duration: {bars: 12}
            generate:
              kind: drums.pattern
              humanize_ms: 2.1
              bar_velocity_pattern: [0.94, 0.98, 1.02, 1.08]
              fill_every_bars: 4
              fill_mode: overlay
              events:
                - {drum: kick, beats: [0, 0.75, 2, 2.75], velocity: 114}
                - {drum: snare, beats: [1, 3], velocity: 116}
                - {drum: closed_hat, beats: [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5], velocity: 64}
                - {drum: open_hat, beats: [1.75, 3.75], velocity: 74}
              fill_events:
                - {drum: low_tom, beats: [2.75, 3.0], velocity: 88}
                - {drum: mid_tom, beats: [3.25, 3.5], velocity: 94}
                - {drum: crash, beats: [3.75], velocity: 104}

          - id: recursive_stomp
            at: {bar: 37, beat: 1}
            duration: {bars: 4}
            generate:
              kind: drums.pattern
              humanize_ms: 1.8
              bar_velocity_pattern: [1.00, 1.04, 1.07, 1.10]
              fill_every_bars: 2
              fill_mode: overlay
              events:
                - {drum: kick, beats: [0, 0.75, 2, 2.75], velocity: 118}
                - {drum: snare, beats: [1, 3], velocity: 120}
                - {drum: closed_hat, beats: [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.75, 3, 3.25, 3.5, 3.75], velocity: 57}
              fill_events:
                - {drum: low_tom, beats: [3.0], velocity: 94}
                - {drum: mid_tom, beats: [3.25], velocity: 100}
                - {drum: high_tom, beats: [3.5], velocity: 106}
                - {drum: china, beats: [3.75], velocity: 110}

          - id: final_stomp
            at: {bar: 41, beat: 1}
            duration: {bars: 4}
            generate:
              kind: drums.pattern
              humanize_ms: 1.8
              bar_velocity_pattern: [1.04, 1.00, 1.08, 1.12]
              fill_every_bars: 2
              fill_mode: overlay
              events:
                - {drum: kick, beats: [0, 0.75, 2, 2.75], velocity: 120}
                - {drum: snare, beats: [1, 3], velocity: 120}
                - {drum: closed_hat, beats: [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5], velocity: 62}
                - {drum: open_hat, beats: [1.75, 3.75], velocity: 82}
              fill_events:
                - {drum: low_tom, beats: [2.75, 3.0], velocity: 96}
                - {drum: high_tom, beats: [3.25, 3.5], velocity: 106}
                - {drum: crash, beats: [3.75], velocity: 118}

  - id: bass_part
    instrument: giant_bass
    voices:
      - id: foundation
        clips:
          - id: giant_bass_intro
            at: {bar: 1, beat: 1}
            duration: {bars: 4}
            technique: marcato
            generate:
              kind: harmony.bass
              octave: 2
              velocity: 86
              pattern: [[0, 0.0, 0.75], [0, 1.0, 0.75], [7, 2.0, 0.75], [0, 3.0, 0.75]]
              velocity_pattern: [1.0, 0.82, 0.95, 0.82]
              bar_velocity_pattern: [1.0, 0.92, 0.96, 1.02]
              humanize_ms: 2.5
          - id: giant_bass_hands
            at: {bar: 5, beat: 1}
            duration: {bars: 12}
            technique: marcato
            generate:
              kind: harmony.bass
              octave: 2
              velocity: 88
              pattern: [[0, 0.0, 0.75], [0, 1.0, 0.75], [7, 2.0, 0.75], [0, 3.0, 0.75]]
              velocity_pattern: [1.0, 0.80, 0.96, 0.84]
              bar_velocity_pattern: [0.94, 0.98, 1.00, 1.04]
              humanize_ms: 2.2
          - id: giant_bass_head
            at: {bar: 17, beat: 1}
            duration: {bars: 8}
            technique: sustain
            generate:
              kind: harmony.bass
              octave: 2
              velocity: 82
              pattern: [[0, 0.0, 1.5], [7, 2.0, 1.25]]
              velocity_pattern: [1.0, 0.88]
              bar_velocity_pattern: [0.88, 0.92, 0.96, 1.00]
              humanize_ms: 3.0
          - id: giant_bass_weight
            at: {bar: 25, beat: 1}
            duration: {bars: 12}
            technique: marcato
            generate:
              kind: harmony.bass
              octave: 2
              velocity: 92
              pattern: [[0, 0.0, 0.75], [0, 1.0, 0.60], [7, 2.0, 0.75], [0, 3.0, 0.60]]
              velocity_pattern: [1.0, 0.80, 0.98, 0.86]
              bar_velocity_pattern: [0.96, 1.0, 1.03, 1.08]
              humanize_ms: 2.0
          - id: giant_bass_endgame
            at: {bar: 37, beat: 1}
            duration: {bars: 8}
            technique: marcato
            generate:
              kind: harmony.bass
              octave: 2
              velocity: 96
              pattern: [[0, 0.0, 0.55], [0, 0.75, 0.40], [7, 2.0, 0.55], [0, 2.75, 0.40]]
              velocity_pattern: [1.0, 0.84, 0.98, 0.86]
              bar_velocity_pattern: [1.0, 1.04, 1.06, 1.10]
              humanize_ms: 1.8

  - id: giant_rhythm_part
    instrument: giant_guitar_left
    voices:
      - id: chugs
        clips:
          - id: giant_chug_intro
            at: {bar: 1, beat: 1}
            duration: {bars: 4}
            technique: palm_mute
            generate:
              kind: guitar.chug
              instruments: [giant_guitar_left, giant_guitar_right]
              octave: 2
              shape: fifth_octave
              min_pitch: 40
              pattern: [[0, 0.0, 0.55, 1.05], [0, 1.0, 0.42, 0.82], [7, 2.0, 0.55, 1.00], [0, 3.0, 0.42, 0.84]]
              velocity: 84
              spread_ms: 7
              humanize_ms: 2.5
          - id: giant_chug_hands
            at: {bar: 5, beat: 1}
            duration: {bars: 12}
            technique: palm_mute
            generate:
              kind: guitar.chug
              instruments: [giant_guitar_left, giant_guitar_right]
              octave: 2
              shape: fifth_octave
              min_pitch: 40
              pattern: [[0, 0.0, 0.5, 1.05], [0, 0.5, 0.38, 0.80], [7, 1.5, 0.5, 0.98], [0, 2.0, 0.5, 1.00], [7, 3.0, 0.45, 0.88]]
              velocity: 86
              spread_ms: 7
              humanize_ms: 2.3
          # The first four bars of head_descends intentionally omit rhythm
          # guitar. The second half rebuilds underneath the scholar.
          - id: giant_chug_head_rebuild
            at: {bar: 21, beat: 1}
            duration: {bars: 4}
            technique: palm_mute
            velocity_scale: 0.88
            generate:
              kind: guitar.chug
              instruments: [giant_guitar_left, giant_guitar_right]
              octave: 2
              shape: fifth_octave
              min_pitch: 40
              pattern: [[0, 0.0, 0.55, 1.0], [7, 2.0, 0.55, 0.94], [0, 3.0, 0.40, 0.82]]
              velocity: 82
              spread_ms: 8
              humanize_ms: 2.8
          - id: giant_chug_weight
            at: {bar: 25, beat: 1}
            duration: {bars: 12}
            technique: palm_mute
            generate:
              kind: guitar.chug
              instruments: [giant_guitar_left, giant_guitar_right]
              octave: 2
              shape: fifth_octave
              min_pitch: 40
              pattern: [[0, 0.0, 0.48, 1.08], [0, 0.5, 0.34, 0.82], [7, 1.0, 0.48, 0.94], [0, 1.5, 0.34, 0.80], [7, 2.0, 0.48, 1.02], [0, 2.75, 0.34, 0.84], [7, 3.5, 0.30, 0.82]]
              velocity: 88
              spread_ms: 7
              humanize_ms: 2.0
          - id: giant_chug_crescendo
            at: {bar: 37, beat: 1}
            duration: {bars: 4}
            technique: palm_mute
            generate:
              kind: guitar.chug
              instruments: [giant_guitar_left, giant_guitar_right]
              octave: 2
              shape: fifth_octave
              min_pitch: 40
              pattern: [[0, 0.0, 0.38, 1.08], [0, 0.5, 0.30, 0.86], [7, 1.0, 0.38, 1.00], [0, 1.5, 0.30, 0.86], [7, 2.0, 0.38, 1.04], [0, 2.5, 0.30, 0.86], [7, 3.0, 0.38, 1.00], [0, 3.5, 0.30, 0.88]]
              velocity: 91
              spread_ms: 6
              humanize_ms: 1.8
          - id: giant_chug_final
            at: {bar: 41, beat: 1}
            duration: {bars: 4}
            technique: marcato
            generate:
              kind: guitar.chug
              instruments: [giant_guitar_left, giant_guitar_right]
              octave: 2
              shape: fifth_octave
              min_pitch: 40
              pattern: [[0, 0.0, 0.78, 1.08], [0, 1.0, 0.45, 0.88], [7, 2.0, 0.78, 1.02], [0, 3.0, 0.45, 0.92]]
              velocity: 93
              spread_ms: 8
              humanize_ms: 1.8

  - id: strings_part
    instrument: strings_academic
    voices:
      - id: bed
        clips:
          - id: strings_intro
            at: {bar: 1, beat: 1}
            duration: {bars: 4}
            technique: sustain
            velocity_scale: 0.78
            generate: {kind: harmony.pad, octave: 3, voicing: power, duration_beats: 3.7, velocity: 48}
          - id: strings_hands
            at: {bar: 5, beat: 1}
            duration: {bars: 12}
            technique: sustain
            generate: {kind: harmony.pad, octave: 3, voicing: open, duration_beats: 3.7, velocity: 46}
            automation:
