processing:
  groups:
    strings:
      chain:
        - {processor: highpass, cutoff_hz: 35}
        - {processor: reverb, wet: 0.2, decay_seconds: 2.2}
        - {processor: gain, gain_db: -3.0}
    violins:
      chain:
        - {processor: highpass, cutoff_hz: 150}
        - {processor: reverb, wet: 0.2, decay_seconds: 2.2}
        - {processor: gain, gain_db: 5.0}
        - {processor: balance, position: -0.25}
    brass:
      chain:
        - {processor: highpass, cutoff_hz: 45}
        - {processor: reverb, wet: 0.2, decay_seconds: 2.2}
        - {processor: gain, gain_db: 1.0}
        - {processor: balance, position: 0.15}
    fiddle:
      chain:
        - {processor: highpass, cutoff_hz: 180}
        - {processor: reverb, wet: 0.14, decay_seconds: 1.6}
        - {processor: gain, gain_db: 16.0}
        - {processor: balance, position: -0.1}
    band:
      chain:
        - {processor: highpass, cutoff_hz: 120}
        - {processor: reverb, wet: 0.14, decay_seconds: 1.6}
        - {processor: gain, gain_db: -3.0}
        - {processor: balance, position: 0.2}
    choir:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: reverb, wet: 0.26, decay_seconds: 2.6}
        - {processor: gain, gain_db: 0.0}
    bells:
      chain:
        - {processor: reverb, wet: 0.3, decay_seconds: 3.0}
        - {processor: gain, gain_db: 0.0}
        - {processor: balance, position: 0.3}
    drums:
      chain:
        - {processor: highpass, cutoff_hz: 35}
        - {processor: reverb, wet: 0.12, decay_seconds: 1.4}
        - {processor: gain, gain_db: -2.0}
    sea:
      chain:
        - {processor: highpass, cutoff_hz: 120}
        - {processor: lowpass, cutoff_hz: 6000}
        - {processor: gain, gain_db: 0.0}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 28}
      - {processor: compressor, threshold_db: -18.0, ratio: 2.0, attack_ms: 20.0, release_ms: 160.0, makeup_db: 1.5, knee_db: 6.0}
      - {processor: limiter, target_peak_db: -1.5, drive: 0.9, normalize: true}
  adaptive_sections:
    mode: composition_master
playback:
  layers:
    orchestra: [strings, violins, brass, choir]
    band: [band, fiddle]
    drums: [drums, bells, sea]
  sections:
    - {id: intro, form: [intro]}
    - {id: song, form: [sail, jig, sail_again, shanty, storm, home], loop: true}
