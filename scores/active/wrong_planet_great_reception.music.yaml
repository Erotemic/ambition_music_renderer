schema: ambition.musicir.v1
id: wrong_planet_great_reception
title: Wrong Planet, Great Reception
seed: 2026080623
notes: 'Indie-pop / synth-pop instrumental built like a cheerful transmission from somewhere that has never heard
  Earth pop but somehow reinvented the hook. An eight-bar bubbly gurgling intro opens into punchy electronic drums,
  springy synth bass, warm pads, clipped electric-piano chords, crystalline replies, and a high-vibrato saw lead.
  The central four-bar hook is deliberately simple enough to sing after one listen: two tiny pickups vault into
  a long high note, leave a hole, then answer downward. It returns unchanged often enough to become an earworm,
  while the accompaniment and counter-lines mutate around it. Alien FX are sparse, chord-attached punctuation rather
  than random dissonance. Mix polish keeps the arrangement intact while rebalancing percussion/bass against the
  whimsical and key layers. The sparse opening is level-raised, and a four-bar loop handoff reuses only intro bars
  4-7 so raw game playback can wrap from the file end into intro bar 0 as one continuous eight-bar cycle. Loudness-rider
  polish leaves every note and layer intact, gently compresses/attenuates the lead bus, and applies smooth section-level
  audio gain before mastering so sparse and lead-heavy passages remain within a narrow game-safe loudness window.
  A/B variant v2: preserve the proven arrangement and loudness rider, extend the final note of the opening lead
  teaser to 2.2 beats, keep the bubbly chiff/goblin texture present throughout the body, and raise the lead bus
  by only 0.6 dB. The original wrong_planet_great_reception cue remains unchanged.'
