schema: ambition.musicir.v1
id: blazingly_fast
title: Blazingly Fast
seed: 2026090101
notes: >-
  V30 is one 24-bar crooked garage-blues loop. The seam stays in the fast feel:
  six bars up, eight bars half-time, four bars of arrangement crescendo, then
  six bars up. VCSL tenor states one compact call and Emily guitar answers it.
tempo: {bpm: 180}
meter: {beats_per_bar: 4, beat_unit: 4}
constraints: {voice_leading: minimize_motion, no_clusters: true}
render:
  sample_rate: 48000
  ogg_quality: 7
  backend: pretty-midi
  strict_backends: true
  sfizz:
    library_roots: [/data/audio-tools/sfz, /data/audio-tools]
    render_timeout_s: 240
  foreground_protection:
    enabled: true
    mode: group_density
    groups: [melody, guitars]
    exclude_groups: [percussion, bass, keys]
    role_priorities: {background: 0, support: 1, lead: 2, foreground: 3}
    min_density_ratio: 0.5
    min_target_notes: 1
    duck_db_per_priority: -1.5
    max_duck_db: -4.5
    control_hop_ms: 15
    attack_ms: 15
    release_ms: 85
  adaptive_section_mastering:
    mode: global_master_slices
    notes: Master once; the authored macro-cycle owns dynamics.
  section_mix_transition_beats: 1.0
postprocess:
  gain_db: -1.0
  highpass_hz: 30
  lowpass_hz: 19000
  reverb_wet: 0.005
  reverb_decay_seconds: 0.38
  reverb_damping_hz: 9000
  stereo_width: 0.055
  compressor_threshold_db: -20.0
  compressor_ratio: 2.1
  compressor_attack_ms: 11
  compressor_release_ms: 96
  compressor_makeup_db: 0.0
  compressor_knee_db: 3.0
  limiter_drive: 1.0
  normalize: true
  target_peak_db: -3.5
stem_postprocess:
  gain_db: 0.0
  highpass_hz: 25
  lowpass_hz: 20000
  reverb_wet: 0.001
  reverb_decay_seconds: 0.2
  reverb_damping_hz: 9000
  stereo_width: 0.006
  normalize: false
  target_peak_db: -4.0
  limiter_enabled: false
group_postprocess:
  keys:
    gain_db: -2.0
    highpass_hz: 45
    lowpass_hz: 15000
    reverb_wet: 0.008
    reverb_decay_seconds: 0.42
    reverb_damping_hz: 7800
    stereo_width: 0.03
