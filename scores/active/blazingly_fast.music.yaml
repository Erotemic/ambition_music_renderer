schema: ambition.musicir.v1
id: blazingly_fast
title: Blazingly Fast
seed: 2026083111
notes: 'V29 is a compositional reset around the successful Emily / Swagbass / Big Rusty backing band. The familiar
  four-chord opening and arpeggiated lead are gone: four section-specific alto-sax melodies now move through a darker,
  chromatic E-minor garage progression with tritone roots, borrowed minor colors, and dominant turnarounds. The alto
  is now the clean Weresax dynamic microphone with restrained natural vibrato and only a diagnostics-driven notch at
  its 6.5 kHz whistle; the opening Emily chords play a syncopated root/octave hook while later sections retain the
  established guitar feel. Broad master EQ coloration is removed.'
tempo:
  bpm: 180
meter:
  beats_per_bar: 4
  beat_unit: 4
constraints:
  voice_leading: minimize_motion
  no_clusters: true
render:
  sample_rate: 48000
  ogg_quality: 7
  backend: pretty-midi
  strict_backends: true
  sfizz:
    library_roots:
    - /data/audio-tools/sfz
    - /data/audio-tools
    render_timeout_s: 240
  foreground_protection:
    enabled: true
    mode: group_density
    groups:
    - guitars
    - brass
    exclude_groups:
    - percussion
    - bass
    - keys
    - melody
    role_priorities:
      background: 0
      support: 1
      lead: 2
      foreground: 3
    min_density_ratio: 0.5
    min_target_notes: 1
    duck_db_per_priority: -1.5
    max_duck_db: -4.5
    control_hop_ms: 15
    attack_ms: 15
    release_ms: 85
  adaptive_section_mastering:
    mode: global_master_slices
    notes: Master once and slice; section changes must come from arrangement, not independent mastering.
  section_mix_transition_beats: 1.0
