playback:
  mode: section_stem_matrix
  loop_components: [main_loop]
  exit_policy: {request_outro: stop_at_next_valid_exit_bar}
  bridge_stems: [keys, melody, percussion, bass, guitars]
  fade_stems: []
state_map:
  default: {preferred_section: main_loop, stems: {keys: 1.0, melody: 1.0, percussion: 0.8, bass: 0.92, guitars: 0.66}}
  flow: {preferred_section: main_loop, stems: {keys: 1.0, melody: 1.0, percussion: 0.82, bass: 0.94, guitars: 0.7}}
  focus: {preferred_section: main_loop, stems: {keys: 0.92, melody: 1.0, percussion: 0.76, bass: 0.9, guitars: 0.62}}
  pressure: {preferred_section: main_loop, stems: {keys: 1.0, melody: 1.0, percussion: 0.86, bass: 0.98, guitars: 0.74}}
sections:
- id: main_loop
  kind: loop_component
  label: crooked garage cycle — up, down, rise, up
  bars: 24
  intensity: 0.94
  density: 0.9
  loopable: true
  valid_exit_local_bars: [24]
  harmony: [Em9, Em9, Cmaj7, Bb, Em9, B7, Em9, Em9, Gm7, Gm7, Cmaj7, Cmaj7, B7sus4, B7, Em9, F, F#7, B7, Em9, Em9, Cmaj7, Bb, F, B7]
  layers: [guitar_up, guitar_down, guitar_rise, bass_up, bass_down, bass_rise, tenor_main, tenor_bites, tenor_peak, piano_down, piano_rise, macro_drums]
