      label: guitar-pre
      report_levels: true
      effects:
      - {effect: gain, gain_db: 12.0}
      - {effect: compressor, threshold_db: -24.0, ratio: 2.4, attack_ms: 8.0, release_ms: 110.0}
    - kind: lv2proc
      label: guitarix-ts9
      plugin_uri: http://guitarix.sourceforge.net/plugins/gxts9#ts9sim
      channel_mode: dual_mono
      required: true
      wet_mix: 0.52
      report_levels: true
      params: {fslider0_: -4.0, fslider1_: 680.0, fslider2_: 0.68, BYPASS: 1.0}
      binary: lv2apply
    - kind: lv2proc
      label: guitarix-jcm800-corroded-crunch
      plugin_uri: http://guitarix.sourceforge.net/plugins/gx_jcm800pre_st#_jcm800pre_st
      required: true
      wet_mix: 0.58
      report_levels: true
      params: {P6v: 0.74, Middle: 0.68, Bass: 0.48, Treble: 0.6, WET_DRY: 60.0, GAIN: -2.0}
      binary: lv2apply
    - kind: pedalboard
      label: guitar-post
      report_levels: true
      effects: [{effect: gain, gain_db: -16.0}]
