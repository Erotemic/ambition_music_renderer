    highpass_hz: 38
    lowpass_hz: 18000
    reverb_wet: 0.0008
    reverb_decay_seconds: 0.23
    reverb_damping_hz: 8200
    stereo_width: 0.015
    transient_tame: 0.05
    transient_lowpass_hz: 16000
    high_shelf_db: 1.3
    high_shelf_hz: 6800
    compressor_threshold_db: -24.0
    compressor_ratio: 2.5
    compressor_attack_ms: 3.5
    compressor_release_ms: 68.0
    compressor_makeup_db: 0.0
    effect_chain:
    - kind: pedalboard
      label: overloaded-drum-room
      effects:
      - {effect: gain, gain_db: 8.0}
      - {effect: clipping, threshold_db: -24.0, wet_mix: 0.18}
      - {effect: compressor, threshold_db: -30.0, ratio: 3.2, attack_ms: 4.0, release_ms: 72.0, wet_mix: 0.2}
      - {effect: gain, gain_db: -8.0}
  bass:
    gain_db: 1.6
    highpass_hz: 35
    lowpass_hz: 9000
    reverb_wet: 0.001
    reverb_decay_seconds: 0.22
    reverb_damping_hz: 7000
    stereo_width: 0.004
    compressor_threshold_db: -23.0
    compressor_ratio: 2.2
    compressor_attack_ms: 8.0
    compressor_release_ms: 88.0
    compressor_makeup_db: 0.0
  guitars:
    gain_db: -1.0
    highpass_hz: 62
    lowpass_hz: 15000
    reverb_wet: 0.004
    reverb_decay_seconds: 0.3
    reverb_damping_hz: 7600
    stereo_width: 0.085
    compressor_threshold_db: -23.0
    compressor_ratio: 2.0
    compressor_attack_ms: 7.0
    compressor_release_ms: 90.0
    compressor_makeup_db: 0.0
    effect_chain:
