schema: ambition.musicir.v1
id: blazingly_fast
title: Blazingly Fast
seed: 2026090101
notes: 'V33 polishes the 112-bar garage-blues loop without changing its form: the downshifts clear around the low tenor, silent slow-section
  bars become crooked guitar answers, and a gentle guitar presence cut separates the two voices. Guitars own the first two bars; tenor enters
  on a long low E drone. The final fast Bb turns directly into the opening fast Em.'
tempo:
  bpm: 180
meter:
  beats_per_bar: 4
  beat_unit: 4
constraints:
  voice_leading: minimize_motion
  no_clusters: true
render:
  sample_rate: 48000
  ogg_quality: 7
  backend: pretty-midi
  strict_backends: true
  sfizz:
    library_roots:
    - /data/audio-tools/sfz
    - /data/audio-tools
    render_timeout_s: 240
  foreground_protection:
    enabled: true
    mode: group_density
    groups:
    - melody
    - guitars
    exclude_groups:
    - percussion
    - bass
    - keys
    role_priorities:
      background: 0
      support: 1
      lead: 2
      foreground: 3
    min_density_ratio: 0.5
    min_target_notes: 1
    duck_db_per_priority: -1.5
    max_duck_db: -4.5
    control_hop_ms: 15
    attack_ms: 15
    release_ms: 85
  adaptive_section_mastering:
    mode: global_master_slices
    notes: Master once; the authored macro-cycle owns dynamics.
  section_mix_transition_beats: 1.0
postprocess:
  gain_db: -1.0
  highpass_hz: 30
  lowpass_hz: 19000
  reverb_wet: 0.005
