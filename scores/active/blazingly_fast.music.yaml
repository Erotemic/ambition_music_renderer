schema: ambition.musicir.v1
id: blazingly_fast
title: Blazingly Fast
seed: 2026083111
notes: 'V25 preserves the measured Emily / Swagbass / Big Rusty palette and accepted melody/harmony while making
  the production physically grungy: longer, less repetitive recorded-chord anchors feed a driven JCM-style preamp and
  short amp-room tail; violin, ensemble, piano, bass, and drums share restrained rehearsal-room preamp coloration.'
tempo:
  bpm: 180
meter:
  beats_per_bar: 4
  beat_unit: 4
constraints:
  voice_leading: minimize_motion
  no_clusters: true
render:
  sample_rate: 48000
  ogg_quality: 7
  backend: pretty-midi
  strict_backends: true
  sfizz:
    library_roots:
    - /data/audio-tools/sfz
    - /data/audio-tools
    render_timeout_s: 240
  foreground_protection:
    enabled: true
    mode: group_density
    groups:
    - guitars
    - strings
    - brass
    exclude_groups:
    - percussion
    - bass
    - keys
    - melody
    role_priorities:
      background: 0
      support: 1
      lead: 2
      foreground: 3
    min_density_ratio: 0.5
    min_target_notes: 1
    duck_db_per_priority: -1.5
    max_duck_db: -4.5
    control_hop_ms: 15
    attack_ms: 15
    release_ms: 85
  adaptive_section_mastering:
    mode: global_master_slices
    notes: Master once and slice; section changes must come from arrangement, not independent mastering.
  section_mix_transition_beats: 1.0
postprocess:
  gain_db: -1.0
  highpass_hz: 30
  lowpass_hz: 19000
  reverb_wet: 0.006
  reverb_decay_seconds: 0.42
  reverb_damping_hz: 9000
  stereo_width: 0.06
  compressor_threshold_db: -20.0
  compressor_ratio: 2.25
  compressor_attack_ms: 10
  compressor_release_ms: 92
  compressor_makeup_db: 0.0
  compressor_knee_db: 3.0
  limiter_drive: 1.0
  normalize: true
  target_peak_db: -3.5
  eq_bands:
  - type: low_shelf
    hz: 95
    q: 0.8
    db: 0.15
  - type: peak
    hz: 520
    q: 0.9
    db: -0.45
  - type: peak
    hz: 2450
    q: 0.85
    db: 1.35
  - type: peak
    hz: 4300
    q: 0.9
    db: 0.85
  - type: high_shelf
    hz: 7600
    q: 0.7
    db: 1.1
