    lowpass_hz: 16000
    reverb_wet: 0.012
    reverb_decay_seconds: 0.38
    reverb_damping_hz: 7800
    stereo_width: 0.01
    compressor_threshold_db: -20.0
    compressor_ratio: 1.35
    compressor_attack_ms: 20
    compressor_release_ms: 135
    compressor_makeup_db: 0.0
