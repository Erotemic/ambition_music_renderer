schema: ambition.musicir.v1
id: fia_hybrid_act1_calibration_light
title: "Fia I — Calibration Light"
seed: 202608161201
notes: >-
  Middle-ground Fia direction: intimate chamber writing with a quiet robotic
  workshop living underneath it. Act I must stand on its own as an excellent,
  affectionate character theme. Piano and clarinet carry the human melody; viola
  and cello supply warmth without becoming cinematic string wash. A restrained
  square-wave servo pulse, a nearly subliminal synth-bass shadow, and dry tool
  clicks keep Fia unmistakably mechanical. The trust phrase is answered rather
  than self-completing. One single D#6 calibration chirp appears late over D major,
  then is never acknowledged. It is the faintest possible fault in an otherwise
  safe machine.
tempo: {bpm: 96}
meter: {beats_per_bar: 3, beat_unit: 4}
constraints: {voice_leading: minimize_motion, no_clusters: true}
render:
  sample_rate: 48000
  ogg_quality: 6
  backend: pretty-midi
  sfizz:
    library_roots: [/data/audio-tools/sfz, /data/audio-tools]
    fallback_backend: pretty-midi
postprocess:
  gain_db: -0.8
  highpass_hz: 32
  lowpass_hz: 11800
  presence_low_hz: 1500
  presence_high_hz: 3900
  presence_db: 0.10
  reverb_wet: 0.105
  reverb_decay_seconds: 1.18
  reverb_damping_hz: 5600
  stereo_width: 0.11
  compressor_threshold_db: -18.0
  compressor_ratio: 1.9
  compressor_attack_ms: 20
  compressor_release_ms: 145
  compressor_makeup_db: 0.35
  compressor_knee_db: 6
  limiter_drive: 0.86
  normalize: true
  target_peak_db: -7.5
stem_postprocess:
  highpass_hz: 30
  reverb_wet: 0.018
  reverb_decay_seconds: 0.65
  reverb_damping_hz: 5800
  stereo_width: 0.035
  normalize: false
  target_peak_db: -3.0
group_postprocess:
  lead: {gain_db: 0.2, highpass_hz: 90, lowpass_hz: 10800, reverb_wet: 0.020}
  keys: {gain_db: 0.0, highpass_hz: 80, lowpass_hz: 10500, reverb_wet: 0.015}
  strings: {gain_db: -1.0, highpass_hz: 85, lowpass_hz: 9200, reverb_wet: 0.028}
  low_strings: {gain_db: -1.2, highpass_hz: 32, lowpass_hz: 7800}
  machine: {gain_db: -3.0, highpass_hz: 130, lowpass_hz: 9800, reverb_wet: 0.006}
  pulse: {gain_db: -3.8, highpass_hz: 45, lowpass_hz: 6200}
  percussion: {gain_db: -5.2, highpass_hz: 150, lowpass_hz: 10500, transient_tame: 0.03, reverb_wet: 0.002}
instruments:
  - name: bench_piano
    group: keys
    program: acoustic_grand_piano
    volume: 86
    pan: 48
    expression: 100
    instrument_backend: {kind: sfz, library_ref: freepats.salamander_grand, prefer: [piano, sustain], optional: true, fallback_backend: pretty-midi}
  - name: fia_clarinet
    group: lead
    program: clarinet
    volume: 82
    pan: 72
    expression: 102
    modulation: 4
    instrument_backend: {kind: sfz, library_ref: vpo.clarinet_solo_perf, prefer: [clarinet, solo, legato], optional: true, fallback_backend: pretty-midi}
  - name: warm_viola
    group: strings
    program: viola
    volume: 62
    pan: 36
    expression: 86
    instrument_backend: {kind: sfz, library_ref: strings.violas, prefer: [viola, sustain], optional: true, fallback_backend: pretty-midi}
  - name: soft_cello
    group: low_strings
    program: cello
    volume: 66
    pan: 42
    expression: 90
    instrument_backend: {kind: sfz, library_ref: strings.celli, prefer: [cello, sustain], optional: true, fallback_backend: pretty-midi}
  - {name: servo_square, group: machine, program: lead_square, volume: 36, pan: 80, expression: 58, modulation: 1}
  - {name: motor_shadow, group: pulse, program: synth_bass_1, volume: 42, pan: 58, expression: 62}
  - {name: calibration_ping, group: machine, program: vibraphone, volume: 44, pan: 84, expression: 66}
  - {name: tool_clicks, group: percussion, is_drum: true, volume: 56, pan: 62, expression: 68}
motifs:
  - id: calibration_trust
    root: D5
    intervals: [0, 2, 4, 7, 5, 2, 4, 0]
    rhythm: [0.5, 0.5, 0.75, 0.75, 0.5, 0.5, 1.0, 1.5]
    velocities: [0.56, 0.60, 0.66, 0.72, 0.62, 0.56, 0.60, 0.48]
  - id: calibration_answer
    root: A4
    intervals: [0, 2, 5, 4, 2, 0]
    rhythm: [0.75, 0.25, 0.5, 0.5, 1.0, 3.0]
    velocities: [0.44, 0.48, 0.56, 0.52, 0.48, 0.38]
  - id: servo_breath
    root: A4
    intervals: [0, 7, 4]
    rhythm: [0.25, 0.25, 2.5]
    velocities: [0.30, 0.24, 0.16]
  - id: wrong_calibration
    root: D6
    intervals: [1]
    rhythm: [0.16]
    velocities: [1.0]
layer_templates:
  piano_workbench:
    kind: arpeggio
    instrument: bench_piano
    octave: 3
    pattern: [0, 2, 1, 3, 2, 1]
    step: 0.5
    duration_beats: 0.36
    velocity: 36
    density: 0.70
    articulation: legato
    humanize_ms: 10
    humanize_velocity_pct: 5
  cello_foundation:
    kind: bassline
    instrument: soft_cello
    octave: 2
    pattern: [[0, 0.0, 1.35], [12, 1.5, 1.10]]
    velocity: 36
    articulation: tenuto
    humanize_ms: 8
    humanize_velocity_pct: 4
  viola_air:
    kind: pad_chords
    instrument: warm_viola
    octave: 3
    every_bars: 1
    duration_beats: 2.76
    velocity: 27
    articulation: tenuto
    voicing: open
    humanize_ms: 13
    humanize_velocity_pct: 4
  fia_voice:
    kind: motif
    instrument: fia_clarinet
    motif: calibration_trust
    velocity: 58
    articulation: legato
    gate: 0.93
    humanize_ms: 7
    humanize_velocity_pct: 3
  piano_answer:
    kind: motif
    instrument: bench_piano
    motif: calibration_answer
    velocity: 46
    articulation: tenuto
    gate: 0.90
    humanize_ms: 8
    humanize_velocity_pct: 4
  servo_answer:
    kind: motif
    instrument: servo_square
    motif: servo_breath
    velocity: 32
    articulation: normal
    gate: 0.58
    humanize_ms: 2
    humanize_velocity_pct: 2
  motor_root:
    kind: bassline
    instrument: motor_shadow
    octave: 2
    pattern: [[0, 0.0, 0.28], [12, 2.5, 0.22]]
    velocity: 28
    articulation: staccato
    humanize_ms: 2
    humanize_velocity_pct: 2
  quiet_tools:
    kind: drums
    instrument: tool_clicks
    humanize_ms: 4
    humanize_velocity_pct: 5
    events:
      - {drum: side_stick, beats: [1.5], velocity: 24, duration_beats: 0.04, probability: 0.62}
      - {drum: claves, beats: [2.5], velocity: 20, duration_beats: 0.04, probability: 0.42}
playback:
  mode: section_stem_matrix
  loop_components: [fia_hybrid_act1_loop]
  exit_policy:
    request_outro: next_valid_exit_bar
    fade_aggressive_stems_beats: 6
    bridge_stems: [keys, strings, low_strings]
    fade_stems: [lead, machine, pulse, percussion]
state_map:
  default:
    section: fia_hybrid_act1_loop
    stems: {lead: 0.76, keys: 0.76, strings: 0.42, low_strings: 0.48, machine: 0.30, pulse: 0.20, percussion: 0.16}
  quiet:
    section: fia_hybrid_act1_loop
    stems: {lead: 0.58, keys: 0.60, strings: 0.32, low_strings: 0.38, machine: 0.15, pulse: 0.11, percussion: 0.08}
sections:
  - id: fia_hybrid_act1_loop
    kind: loop_component
    label: Fia Act I hybrid - calibration light
    bars: 32
    intensity: 0.43
    density: 0.48
    loopable: true
    valid_exit_local_bars: [8, 16, 24, 32]
    harmony:
      [Dmaj7, A/C#, Bm7, Gmaj7, D/F#, Em7, G, A,
       Dmaj7, A/C#, Bm7, Gmaj7, D/F#, Em7, G, A,
       Dmaj7, A/C#, Bm7, Gmaj7, Em7, A, Gm6/D, Dmaj7,
       Bm7, Gmaj7, D/F#, Em7, G, A, Gm6/D, Dmaj7]
    layers:
      - piano_workbench
      - cello_foundation
      - viola_air
      - motor_root
      - quiet_tools
      - {template: fia_voice, starts: [[0, 0.0], [8, 0.0], [16, 0.0], [24, 0.0]]}
      - {template: piano_answer, starts: [[2, 0.0], [10, 0.0], [18, 0.0], [26, 0.0]]}
      - {template: servo_answer, starts: [[6, 0.0], [14, 0.0], [22, 0.0]]}
      - kind: motif
        instrument: calibration_ping
        motif: wrong_calibration
        velocity: 42
        articulation: bell
        gate: 0.42
        starts: [[23, 2.62]]
