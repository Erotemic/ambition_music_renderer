parts:
  - id: piano_part
    instrument: piano
    voices:
      - id: piano_main
        clips:
          - {id: piano_dusk_bell, at: {bar: 1, beat: 1}, use: piano_dusk_bell}
          - {id: piano_homeward, at: {bar: 6, beat: 1}, use: piano_homeward}
          - {id: piano_terraces_glow, at: {bar: 14, beat: 1}, use: piano_terraces_glow}
          - {id: piano_lamps_lit, at: {bar: 27, beat: 1}, use: piano_lamps_lit}
          - {id: piano_long_shadow, at: {bar: 35, beat: 1}, use: piano_long_shadow}
          - {id: piano_closing_time, at: {bar: 48, beat: 1}, use: piano_closing_time}
  - id: cello_part
    instrument: cello
    voices:
      - id: cello_main
        clips:
          - {id: cello_homeward, at: {bar: 6, beat: 1}, use: cello_homeward}
          - {id: cello_lamps_lit, at: {bar: 27, beat: 1}, use: cello_lamps_lit}
          - {id: cello_long_shadow, at: {bar: 35, beat: 1}, use: cello_long_shadow}
          - {id: cello_closing_time, at: {bar: 48, beat: 1}, use: cello_closing_time}
  - id: clarinet_part
    instrument: clarinet
    voices:
      - id: clarinet_main
        clips:
          - {id: clarinet_terraces_glow, at: {bar: 14, beat: 1}, use: clarinet_terraces_glow}
          - {id: clarinet_lamps_lit, at: {bar: 27, beat: 1}, use: clarinet_lamps_lit}
          - {id: clarinet_long_shadow, at: {bar: 35, beat: 1}, use: clarinet_long_shadow}
  - id: guitar_part
    instrument: guitar
    voices:
      - id: guitar_main
        clips:
          - {id: guitar_dusk_bell, at: {bar: 1, beat: 1}, use: guitar_dusk_bell}
          - {id: guitar_homeward, at: {bar: 6, beat: 1}, use: guitar_homeward}
          - {id: guitar_terraces_glow, at: {bar: 14, beat: 1}, use: guitar_terraces_glow}
          - {id: guitar_lamps_lit, at: {bar: 27, beat: 1}, use: guitar_lamps_lit}
          - {id: guitar_long_shadow, at: {bar: 35, beat: 1}, use: guitar_long_shadow}
          - {id: guitar_closing_time, at: {bar: 48, beat: 1}, use: guitar_closing_time}
  - id: bass_part
    instrument: bass
    voices:
