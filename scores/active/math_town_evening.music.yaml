          - {id: bass_homeward, at: {bar: 6, beat: 1}, use: bass_homeward}
          - {id: bass_terraces_glow, at: {bar: 14, beat: 1}, use: bass_terraces_glow}
          - {id: bass_lamps_lit, at: {bar: 27, beat: 1}, use: bass_lamps_lit}
          - {id: bass_long_shadow, at: {bar: 35, beat: 1}, use: bass_long_shadow}
