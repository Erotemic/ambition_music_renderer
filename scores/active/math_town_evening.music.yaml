          - {id: strings_lamps_lit, at: {bar: 27, beat: 1}, use: strings_lamps_lit}
          - {id: strings_long_shadow, at: {bar: 35, beat: 1}, use: strings_long_shadow}
processing:
  groups:
    piano:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: band_gain, low_hz: 2800, high_hz: 5500, gain_db: -2.5}
        - {processor: lowpass, cutoff_hz: 7000}
        - {processor: reverb, wet: 0.22, decay_seconds: 1.8, damping_hz: 4000}
        - {processor: gain, gain_db: 13.0}
        - {processor: balance, position: -0.35}
    cello:
      chain:
        # The Bigcat cello is bright: with a 3.8 kHz low-pass and a 7 dB cut its 2-4 kHz
        # band was still 13 dB under the whole stem. These cuts make it 22 dB, as the clarinet.
        - {processor: highpass, cutoff_hz: 60}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 300, q: 0.8, db: 2.0}
        - {processor: high_shelf, hz: 1500, gain_db: -9.0}
        - {processor: band_gain, low_hz: 1800, high_hz: 5000, gain_db: -11.0}
        - {processor: lowpass, cutoff_hz: 3800}
        - {processor: reverb, wet: 0.22, decay_seconds: 1.8, damping_hz: 3500}
        - {processor: gain, gain_db: 14.5}
        - {processor: balance, position: -0.15}
    clarinet:
      chain:
        - {processor: highpass, cutoff_hz: 140}
        - {processor: band_gain, low_hz: 2500, high_hz: 5000, gain_db: -3.0}
        - {processor: lowpass, cutoff_hz: 6500}
        - {processor: reverb, wet: 0.22, decay_seconds: 1.8, damping_hz: 3800}
        - {processor: gain, gain_db: 5.5}
        - {processor: balance, position: 0.2}
    guitar:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: band_gain, low_hz: 3000, high_hz: 6500, gain_db: -3.0}
        - {processor: lowpass, cutoff_hz: 6000}
        - {processor: reverb, wet: 0.16, decay_seconds: 1.4, damping_hz: 4000}
        - {processor: gain, gain_db: 0.0}
        - {processor: balance, position: 0.35}
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 36}
        - {processor: compressor, threshold_db: -28.0, ratio: 2.5, attack_ms: 20.0, release_ms: 160.0, makeup_db: 2.0}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 250, q: 0.8, db: 1.5}
            - {type: peak, hz: 800, q: 0.8, db: 2.0}
        - {processor: lowpass, cutoff_hz: 3000}
        - {processor: gain, gain_db: -4.5}
    strings:
      chain:
        - {processor: highpass, cutoff_hz: 120}
        - {processor: lowpass, cutoff_hz: 5500}
        - {processor: reverb, wet: 0.3, decay_seconds: 2.0, damping_hz: 3500}
        - {processor: gain, gain_db: 1.0}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 30}
      - {processor: compressor, threshold_db: -20.0, ratio: 1.6, attack_ms: 30.0, release_ms: 180.0, makeup_db: 1.0, knee_db: 6.0}
      - {processor: limiter, target_peak_db: -3.0, drive: 0.9, normalize: true}
  adaptive_sections: {mode: composition_master}
