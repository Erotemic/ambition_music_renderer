schema: ambition.musicir.v3
id: math_town_evening
title: Golden Ratio Hour
description: >-
  The evening music of the central town of the Math dimension: the sun goes down behind the domes and
  the viaduct, the limestone turns gold, and people walk home. F major, 84 BPM. The form follows the
  Fibonacci numbers: sections of 5, 8, 13, 8, 13 and 5 bars. The cello sings the evening song over a
  bass that falls by half steps (F E Eb D Db C); the clarinet answers in D minor; at the end of the day
  the town clock plays the Euclid Street motif, and in a D-flat interlude the cello states it and the
  clarinet answers with its inversion. One of four cues for the day and night of the town.
notes:
  - 'Jon, 2026-10-15: the central town of the Math dimension gets a day/night cycle, "so music for morning, daytime, evening, and nighttime is a good idea. Let''s build distinct new music for this." This is the evening cue. It is a new composition: it does not use the motifs of standing_on_shoulders or shoulders_at_rest.'
  - 'The family motif of the four town cues (Euclid Street): scale degrees 1 5 4 3 | 2 3 5, a premise and its conclusion. Here, in F: F | C Bb A- | G A C- on the piano in bars 1-3 (the dusk bell); in D-flat on the cello in bars 35-37, answered by the clarinet with the inversion (Db | Gb Ab Bb- | C Bb Gb-) in bars 37-39; and its conclusion (G A C) on the clarinet in bar 45, where the music turns back to F.'
  - 'The evening song (bars 6-13 and 27-34) has its own rhythm: a short note that leaps up to a long note, two short notes, and a long held note in each two bars. The highest note is D-flat 5. The clarinet song of terraces_glow goes up to F5. No held note is above A5, and the highest note of the cue is F5.'
  - 'No drums. The motion is the fingerpicked guitar, which rests in bars 35-42 while the piano plays the arpeggio. The strings play only in bars 23-26 and 31-44, softly.'
  - 'The file loops as a whole: bar 53 is bar 1. The last bar is a C9sus4 on the guitar and the bass, which resolves to the F of bar 1.'
seed: 2026101501
timebase: {ppq: 960}
meter: 4/4
tempo: 84
key: F major
end: {bar: 53, beat: 1}
form:
  - {id: dusk_bell, label: 'Dusk bell: the Euclid Street motif on the piano', from: {bar: 1, beat: 1}, to: {bar: 6, beat: 1}, role: loop_component, loopable: true}
  - {id: homeward, label: 'Homeward: the evening song on the cello', from: {bar: 6, beat: 1}, to: {bar: 14, beat: 1}, role: loop_component, loopable: true}
  - {id: terraces_glow, label: 'Terraces glow: the clarinet in D minor, 5 + 8 bars', from: {bar: 14, beat: 1}, to: {bar: 27, beat: 1}, role: loop_component, loopable: true}
  - {id: lamps_lit, label: 'Lamps lit: the song on clarinet and cello in octaves', from: {bar: 27, beat: 1}, to: {bar: 35, beat: 1}, role: loop_component, loopable: true}
  - {id: long_shadow, label: 'Long shadow: D-flat major, the motif in canon', from: {bar: 35, beat: 1}, to: {bar: 48, beat: 1}, role: loop_component, loopable: true}
  - {id: closing_time, label: 'Closing time: the song comes home', from: {bar: 48, beat: 1}, to: {bar: 53, beat: 1}, role: loop_component, loopable: true}
render:
  backend: pretty-midi
  sample_rate: 48000
  ogg_quality: 7
  metadata_markers:
    - {bar: 1, id: m1, label: 'Dusk bell'}
    - {bar: 6, id: m6, label: 'Homeward'}
    - {bar: 14, id: m14, label: 'Terraces glow'}
    - {bar: 27, id: m27, label: 'Lamps lit'}
    - {bar: 35, id: m35, label: 'Long shadow'}
    - {bar: 48, id: m48, label: 'Closing time'}
