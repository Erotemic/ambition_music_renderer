schema: ambition.musicir.v3
id: carry_the_one
title: Carry the One - Overflow Boss Anthem
description: >-
  A southern rock anthem that starts as a ballad and ends with long guitar solos. It is the
  music of the Overflow boss: the melody climbs past the top while the bass goes down.
notes:
  - 'History: written 2026-10-10 as an experimental second version of dinosaur_liberators. Jon liked it and wanted the T-rex to keep its own song, so it got a name and a boss of its own.'
  - 'Key of E. Tempo 152. The intro is in half time, so the ballad and the jam share one tempo.'
  - 'The theme is one melody. The intro plays it at half speed. The choruses play it at full speed over a bass line that goes down by step: E, D sharp, D, C sharp, C, B, A, B.'
  - 'The riff is E, G, A and back. The stomp in the middle is in half time and low, with the flat fifth.'
  - 'The intro lead has a cleaner amp of its own. Then two lead guitars. lead_1 is the Emily guitar and bends with pitch bend (range 1200 cents). lead_2 is the Black guitar and uses its own vibrato (CC111, about 2 cents for each step).'
  - 'The guitars go through the Guitarix TS9 and JCM800 chain that standing_on_shoulders uses. The amp removes an instrument pan, so each guitar group is placed with a balance stage after the amp.'
  - 'Form: intro 1-8, riff 9-16, verse 17-32, chorus 33-40, stomp 41-48, solo 49-64, twin guitars 65-80, chorus 81-88, outro 89-96.'
seed: 6600
timebase: {ppq: 960}
meter: 4/4
tempo: 152
key: E major
end: {bar: 97, beat: 1}
form:
  - {id: intro, from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, energy: 0.35, density: 0.3, role: ballad statement of the theme at half speed}
  - {id: riff, from: {bar: 9, beat: 1}, to: {bar: 17, beat: 1}, energy: 0.8, density: 0.7, role: the band comes in with the riff}
  - {id: verse, from: {bar: 17, beat: 1}, to: {bar: 33, beat: 1}, energy: 0.8, density: 0.75, role: the two guitars call and answer over the riff}
  - {id: chorus_1, from: {bar: 33, beat: 1}, to: {bar: 41, beat: 1}, energy: 0.95, density: 0.9, role: the theme at full speed}
  - {id: stomp, from: {bar: 41, beat: 1}, to: {bar: 49, beat: 1}, energy: 0.75, density: 0.55, role: half-time breakdown and climb}
  - {id: solo, from: {bar: 49, beat: 1}, to: {bar: 65, beat: 1}, energy: 0.95, density: 0.9, role: each guitar takes eight bars}
  - {id: twin, from: {bar: 65, beat: 1}, to: {bar: 81, beat: 1}, energy: 0.9, density: 0.85, role: 'harmony guitars, quiet and then high'}
  - {id: chorus_2, from: {bar: 81, beat: 1}, to: {bar: 89, beat: 1}, energy: 1.0, density: 0.95, role: the theme with both guitars}
  - {id: outro, from: {bar: 89, beat: 1}, to: {bar: 97, beat: 1}, energy: 0.9, density: 0.85, role: 'the riff, one line together, the last chord'}
