processing:
  groups:
    rhythm_l:
      chain:
        - processor: pedalboard
          effects:
            - {effect: gain, gain_db: 8.0}
            - {effect: compressor, threshold_db: -23.0, ratio: 2.2, attack_ms: 8.0, release_ms: 95.0}
        - processor: lv2
          plugin_uri: http://guitarix.sourceforge.net/plugins/gxts9#ts9sim
          binary: lv2apply
          channel_mode: dual_mono
          wet_mix: 0.48
          params: {fslider0_: -5.0, fslider1_: 640.0, fslider2_: 0.62, BYPASS: 1.0}
        - processor: lv2
          plugin_uri: http://guitarix.sourceforge.net/plugins/gx_jcm800pre_st#_jcm800pre_st
          binary: lv2apply
          wet_mix: 0.52
          params: {P6v: 0.68, Middle: 0.64, Bass: 0.52, Treble: 0.58, WET_DRY: 58.0, GAIN: -3.0}
        - {processor: highpass, cutoff_hz: 75}
        - processor: parametric_eq
          bands:
