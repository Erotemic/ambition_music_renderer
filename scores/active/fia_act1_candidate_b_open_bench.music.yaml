schema: ambition.musicir.v1
id: fia_act1_candidate_b_open_bench
title: "Fia I Candidate B — Open Bench"
seed: 202608161202
notes: >-
  Act I candidate B: chamber-groove rather than chamber-orchestra. Rhodes carries
  a compact hook in a seven-bar C-Lydian cycle, with cello answering in the low
  middle register, muted hollow-body guitar giving syncopated chord punctuation,
  and finger bass plus side-stick/shaker keeping a relaxed pocket. There are no
  arpeggiated piano beds and no lyrical woodwind narrator. The robot-mechanic
  identity is just a tiny relay pulse under the groove. Foreshadowing here is
  rhythmic rather than harmonic: every relay event is metrically square except
  one late click in the final cycle, displaced by a third of a beat. It should
  feel like the machine hesitated, not like the composer announced danger.
