schema: ambition.musicir.v1
id: birds_in_the_rafters
title: Birds in the Rafters
seed: 202608082129
notes: Standalone song grown from the strongest Birds in the Rafters room of Cedar Light. Choir-free acoustic folk ensemble centered on Drop-D ringing guitar, harmony-locked cross-picking, two complementary banjo voices, upright bass, restrained folk drums, harp, sparse violin, and occasional woodwind breath. The form develops continuously inside one harmonic world rather than moving between medley rooms.
tempo:
  bpm: 90
  map:
  - bar: 21
    bpm: 94
    ramp_bars: 4
  - bar: 37
    bpm: 86
    ramp_bars: 2
  - bar: 45
    bpm: 96
    ramp_bars: 4
  - bar: 69
    bpm: 88
    ramp_bars: 3
meter:
  beats_per_bar: 4
  beat_unit: 4
render:
  sample_rate: 48000
  ogg_quality: 6
  metadata_markers:
  - id: rafters_open
    label: I. Rafters Open - twin banjos state the song
    bar: 1
  - id: first_flight
    label: II. First Flight - the full acoustic groove settles in
    bar: 5
  - id: open_eaves
    label: III. Open Eaves - denser counterpicking and bass movement
    bar: 13
  - id: wide_sky
    label: IV. Wide Sky - first broad lift
    bar: 21
  - id: dust_light
    label: V. Dust in Sunlight - suspended acoustic middle
    bar: 29
  - id: loft_instrumental
    label: VI. Loft Instrumental - banjo, harp, and violin take the foreground
    bar: 37
  - id: second_flight
    label: VII. Second Flight - main progression returns with urgency
    bar: 45
  - id: storm_of_wings
    label: VIII. Storm of Wings - full acoustic climax
    bar: 53
  - id: home_rafters
    label: IX. Home Rafters - familiar material returns warmer
    bar: 61
  - id: afterimage
    label: X. Afterimage - the room empties around the final Dadd9
    bar: 69
  sfizz:
    library_roots:
    - /data/audio-tools/sfz
    - /data/audio-tools
    fallback_backend: pretty-midi
