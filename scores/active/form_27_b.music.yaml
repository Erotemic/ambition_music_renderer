render:
  sample_rate: 48000
  ogg_quality: 6
processing:
  groups:
    piano:
      chain:
        - {processor: highpass, cutoff_hz: 95}
        - {processor: balance, position: -0.19}
    cello:
      chain:
        - {processor: highpass, cutoff_hz: 44}
        - {processor: lowpass, cutoff_hz: 5700}
    clarinet:
      chain:
        - {processor: highpass, cutoff_hz: 95}
        - {processor: balance, position: 0.21}
    stamp:
      chain:
        - {processor: lowpass, cutoff_hz: 4600}
        - {processor: gain, gain_db: -3.0}
        - {processor: balance, position: 0.28}
    thud:
      chain:
        - {processor: highpass, cutoff_hz: 42}
        - {processor: lowpass, cutoff_hz: 920}
        - {processor: gain, gain_db: -8.0}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 35}
      - {processor: compressor, threshold_db: -17.0, ratio: 1.6, attack_ms: 24.0, release_ms: 115.0, knee_db: 5.0}
      - {processor: reverb, wet: 0.028, decay_seconds: 0.62}
      - {processor: limiter, target_peak_db: -1.8, drive: 0.94, normalize: true}
playback:
  layers:
    ensemble: [piano, cello, clarinet, stamp, thud]
  sections:
    - {id: song, form: [return_to_sender, complete_form, desk_drawer, pass_it_along, back_in_the_tray], loop: true}
