title: "Mary-O: You Died"
one_shot: true
seed: 2026072504
notes: >-
  An original short death sting for Mary-O. One quick upward pickup immediately
  gives way to a strict descending tumble: down, down, down, ending in a comic
  low thud. It evokes the compact theatrical grammar of a classic platformer
  death cue without reproducing Mario's melody, harmony, or note sequence.

