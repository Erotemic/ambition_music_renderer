processing:
  groups:
    theremin:
      chain:
      - processor: highpass
        cutoff_hz: 160
      - processor: lowpass
        cutoff_hz: 5200
      - processor: pedalboard
        effects:
        - effect: delay
          delay_ms: 388
          feedback: 0.18
          mix: 0.16
      - processor: reverb
        wet: 0.3
        decay_seconds: 2.6
    brass:
      chain:
      - processor: reverb
        wet: 0.18
        decay_seconds: 1.8
      - processor: gain
        gain_db: 6.0
    organ:
      chain:
      - processor: lowpass
        cutoff_hz: 3000
      - processor: reverb
        wet: 0.32
        decay_seconds: 3.0
      - processor: gain
        gain_db: -2.0
    choir:
      chain:
      - processor: reverb
        wet: 0.3
        decay_seconds: 2.8
    strings:
      chain:
      - processor: reverb
        wet: 0.16
        decay_seconds: 1.6
    drums:
      chain:
      - processor: compressor
        threshold_db: -16.0
        ratio: 2.2
        attack_ms: 6.0
        release_ms: 120.0
      - processor: reverb
        wet: 0.14
        decay_seconds: 1.4
    timpani:
      chain:
      - processor: reverb
        wet: 0.22
        decay_seconds: 2.2
playback:
  layers:
    bed:
    - strings
    - organ
    - choir
    - low
    - timpani
    drums:
    - drums
    tune:
    - brass
    - theremin
  sections:
  - id: awaken
    form:
    - awaken
  - id: march
    form:
    - march
    loop: true
  - id: unleash
    form:
    - unleash
  - id: howl
    form:
    - howl
    loop: true
  - id: storm
    form:
    - storm
    loop: true
