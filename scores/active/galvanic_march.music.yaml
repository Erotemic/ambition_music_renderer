description: 'Wolfenstein''s boss fight. A stiff brass march in C minor for his first phase, which detunes into a howling
  theremin theme for the second: the howl is the march tune itself, slowed and glided. Enraged, both at once.'
notes:
- 'Jon, 2026-10-17 (the plan in docs/planning/game/bosses.md): his own cue, a stiff march in phase 1 that detunes into a howling
  theremin theme in phase 2, both in enrage.'
- 'The game plays the playback sections: awaken (one time), march (loop), unleash (one time, the detune), howl (loop), storm
  (loop).'
- 'The theremin is the procedural synth with glide and vibrato (README: Procedural FM instruments).'
- Written by a generator script; the score is the source.
