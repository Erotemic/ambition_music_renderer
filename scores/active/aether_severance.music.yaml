schema: ambition.musicir.v1
id: aether_severance
title: Aether Severance
seed: 2026090111
notes: V5 fullness-and-polish pass. Preserve the V4 Salamander/Emily/Big Rusty identity and improved guitar gating.
  Add a dedicated Black & Blue electric-bass foundation with varied multi-bar root/fifth performance, raise the
  previously inaudible orchestral support enough to register, and polish a small set of piano bars that were empty,
  overly repetitive, or chromatically awkward. No structural or harmonic rewrite.
tempo:
  bpm: 204
meter:
  beats_per_bar: 4
  beat_unit: 4
constraints:
  voice_leading: minimize_motion
  no_clusters: true
render:
  sample_rate: 48000
  ogg_quality: 7
  backend: pretty-midi
  strict_backends: true
  sfizz:
    library_roots:
    - /data/audio-tools/sfz
    - /data/audio-tools
    render_timeout_s: 240
  foreground_protection:
    enabled: false
  adaptive_section_mastering:
    mode: global_master_slices
    notes: Master once and slice; arrangement creates section contrast.
  section_mix_transition_beats: 0.5
postprocess:
  gain_db: -0.5
  highpass_hz: 28
  lowpass_hz: 15800
  reverb_wet: 0.015
  reverb_decay_seconds: 0.62
  reverb_damping_hz: 7000
