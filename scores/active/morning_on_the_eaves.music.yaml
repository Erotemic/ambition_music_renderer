# Original composition, September 2026.
# Companion to The Last Lantern: similarly spacious, but designed in D major
# with rising pentatonic gestures, warmer string cushions, and koto in the
# foreground. The shakuhachi is intentionally distant environmental color.
#
# Beat positions in event lists are fractions of a WHOLE note. The threshold
# is an exact orchestral copy of the final eight loop bars so the adaptive loop
# receives the same note/controller/reverb history at both boundaries.
