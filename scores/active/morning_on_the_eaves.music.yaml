title: Morning on the Eaves
seed: 2026090703
description: 'Soft major-key ninja-zone ambience: a rising D-major pentatonic koto hook, warm pizzicato double bass, broad orchestral strings, sparse shamisen glints, and a distant shakuhachi answering from beyond the courtyard.'
