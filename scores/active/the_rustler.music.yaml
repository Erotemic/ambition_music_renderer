  - {id: before_rustler, from: {bar: 33, beat: 1}, to: {bar: 35, beat: 1}, energy: 0.1, density: 0.0, role: 'silence: a ring and a lead-in'}
  - {id: rustler, from: {bar: 35, beat: 1}, to: {bar: 59, beat: 1}, energy: 0.85, density: 0.75, loopable: true, role: 'the outlaw engine: the big kit, the rustler in the trombones, timpani'}
