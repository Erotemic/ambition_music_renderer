schema: ambition.musicir.v3
id: the_rustler
title: Coq of the Walk
description: >-
  The Frontier's train robbery: the Number 9 ore freight running down the gulch with an outlaw engine at its head. A snare like wheels on rail joints, a galloping bass and a banjo, the rustler on the fiddle; at the engine the big kit, the trombones and timpani. Generated by dev/compose_halfway_siding.py: edit that, not
  this file.
notes:
  - 'Jon, 2026-11-20: a driving cue for the train stage. The references were mood only. His first review: good structure, not balanced; it must loop.'
  - 'The rustler: E G A B, D B A G E.'
  - 'The game binds the sections to rooms (Ambition music_cues.ron): boxcars (the tail, the cars), rustler (the head of the train).'
seed: 1131
timebase: {ppq: 960}
meter: 4/4
tempo: 152
