schema: ambition.musicir.v3
id: broken_transmitter
title: Broken Transmitter
description: A folk-rock transmission with a memorable guitar refrain, interrupted by a mechanical shadow and recovered
  in a quiet final verse.
notes:
- 'One lead voice: green-twang guitar. Rhodes answers at phrase endings instead of doubling the melody.'
- The bright C-sharp of the Dorian answer becomes C-natural in the haunted verse; the fault passage briefly introduces
  F-natural.
- The machine inherits the refrain rhythm. Distortion colors an authored part rather than supplying the composition.
- The four-bar collapse drops attacks progressively; the restored eight-bar verse returns the bright sixth and hands
  E minor back to the opening.
- Dedicated green/black twang patches are intentional articulation overrides of guitar.hollowbody.
