processing:
  groups:
    lead:
      chain:
      - processor: highpass
        cutoff_hz: 130
      - processor: lowpass
        cutoff_hz: 7200
      - processor: compressor
        threshold_db: -24
        ratio: 2
        attack_ms: 16
        release_ms: 110
      - processor: reverb
        wet: 0.065
        decay_seconds: 0.8
        damping_hz: 4600
      - processor: gain
        gain_db: 7
    folk:
      chain:
      - processor: highpass
        cutoff_hz: 150
      - processor: lowpass
        cutoff_hz: 8200
    keys:
      chain:
      - processor: highpass
        cutoff_hz: 200
      - processor: lowpass
        cutoff_hz: 6500
    bass:
      chain:
      - processor: highpass
        cutoff_hz: 35
      - processor: lowpass
        cutoff_hz: 3500
    machine:
      chain:
      - processor: highpass
        cutoff_hz: 105
      - processor: pedalboard
        effects:
        - effect: gain
          gain_db: 18
        - effect: distortion
          drive_db: 12
        - effect: gain
          gain_db: -15
      - processor: lowpass
        cutoff_hz: 4700
    drums:
      chain:
      - processor: highpass
        cutoff_hz: 40
      - processor: lowpass
        cutoff_hz: 11000
  master:
    chain:
    - processor: highpass
      cutoff_hz: 30
    - processor: compressor
      threshold_db: -18
      ratio: 1.5
      attack_ms: 24
      release_ms: 140
    - processor: reverb
      wet: 0.055
      decay_seconds: 0.85
      damping_hz: 4700
    - processor: limiter
      target_peak_db: -1.5
      normalize: true
      drive: 1.0
  adaptive_sections:
    mode: composition_master
