processing:
  groups:
    keys:
      chain:
        - {processor: highpass, cutoff_hz: 100}
        - {processor: reverb, wet: 0.2, decay_seconds: 1.8}
        - {processor: gain, gain_db: -1.0}
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 35}
        - {processor: gain, gain_db: 1.0}
    flute:
      chain:
        - {processor: highpass, cutoff_hz: 200}
        - {processor: reverb, wet: 0.28, decay_seconds: 2.4}
        - {processor: gain, gain_db: 6.0}
    drums:
      chain:
        - {processor: highpass, cutoff_hz: 30}
        - {processor: reverb, wet: 0.08, decay_seconds: 0.9}
        - {processor: gain, gain_db: 1.0}
    perc:
      chain:
        - {processor: highpass, cutoff_hz: 200}
        - {processor: reverb, wet: 0.3, decay_seconds: 2.6}
        - {processor: gain, gain_db: 18.0}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 30}
      - {processor: lowpass, cutoff_hz: 7000}
      - {processor: compressor, threshold_db: -18.0, ratio: 2.5, attack_ms: 12.0, release_ms: 140.0, makeup_db: 1.5, knee_db: 6.0}
      - {processor: stereo_width, amount: 0.15}
      - {processor: limiter, target_peak_db: -1.5, drive: 0.9, normalize: true}
  adaptive_sections:
    mode: composition_master
playback:
  layers:
    bed: [keys, bass, drums, perc]
    tune: [flute]
  sections:
    - {id: song, form: [intro, draw, flute, torch, outro], loop: true}
