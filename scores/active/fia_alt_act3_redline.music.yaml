schema: ambition.musicir.v1
id: fia_alt_act3_redline
title: "Fia III — Redline"
seed: 202608161103
notes: >-
  Climax of the electro-workshop Fia direction. The original Bench Test melody
  is intentionally absent from almost the entire loop. What survives is its
  syncopated attack pattern and interval machinery, compressed into a two-beat
  redline cell shared by bass, clavinet, and square/saw fragments. The mix is
  intentionally small and controlled: one bass engine, one rhythmic key layer,
  one lead lane, one restrained metallic bed, and a drum kit kept several dB
  below the melodic engine so percussion cannot dominate. At bar 28, a quiet
  electric piano plays only the first five notes of the Act I hook in A major.
  It happens once, without a cadence, and the redline machine continues through it.
