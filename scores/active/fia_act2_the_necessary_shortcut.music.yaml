schema: ambition.musicir.v1
id: fia_act2_the_necessary_shortcut
title: "Fia II — The Necessary Shortcut"
seed: 2026081602
notes: >-
  Act II Fia theme. It is recognizably Benchlight seen under colder light: the
  same two-bar contour and pulse remain, but the major third collapses to minor,
  the answering voice arrives later and less freely, and accompaniment that once
  felt like patient repair now behaves like a mechanism pushing the phrase to a
  predetermined conclusion. D minor is repeatedly stained by the major seventh
  and diminished passing harmony. The emotional target is not villain music;
  it is intimacy becoming pressure, confidence becoming certainty, and moral
  urgency beginning to treat consent and ambiguity as obstacles.
