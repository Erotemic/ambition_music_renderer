authoring:
  authoring_description:  The composition uses a new repeated-D rage cell, hard silence,
    antiphonal handoffs, hocketed string motors, 3+3+2 accent skeletons, a false victory, and a final tempo escalation to
    express anger as musical argument rather than generic scale.
  gameplay_description: Standalone orchestral anger cue; also suitable for satirical bureaucracy, legal machinery, or manic
    institutional escalation.
  fallback_dialogue:
  - The composer is dead. The paperwork is thriving.
  - Renewed. Again.
  - Appeal denied. Term extended.
  suggested_barks:
  - Ninety-five more years!
  - Stamp it again!
  - Renew it again!
  form: 4-bar cease-and-desist attack + 4-bar exposed fine print + 8-bar renewal engine + 8-bar protest + 8-bar chase +
    4-bar false victory + 4-bar appeal denied + 8-bar accelerating renewed-again coda
  preserved_core: All 483 events of the original 32-bar piano composition are preserved exactly at bars 5-36 (zero-based
    bars 4-35).
  influence_boundary: Uses broad kinetic orchestral-dance devices only; no copied melody or distinctive phrase from Sabre
    Dance.
