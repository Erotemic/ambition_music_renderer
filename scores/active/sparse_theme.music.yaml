schema: ambition.musicir.v3
id: sparse_theme
title: Sparse Theme
description: >-
  Mary-O worlds 2-1 and 2-3, the desert. Support Theme is her play on a ground theme and
  Embedded Theme is her play on an underground theme; this is her second ground theme, for
  sand and sun. A short tune that starts with two knocks, in the rhythm of the drums, on a
  scale with a wide step in it, and a bright second part.
notes:
  - 'Jon, 2026-10-12: "Let us start building world 2-1, 2-2, 2-3 and 2-4. I also want an additional surface biome and theme song." The biome is a desert. This is its level music; it loops.'
  - 'Jon rated Support Theme 6.5: as a parody it "falls short" because it "is not iconic". The aim here is a hook: a tune of eight bars that a player can hum after one loop. The loop has that tune three times, and one time in the bass.'
  - 'What it keeps from the idea of a ground theme: a bright tune with a bounce, a square wave has the tune, a second square wave is a third below it, and a second part gives a contrast. The notes, the rhythm and the form are its own.'
  - 'The scale is D, E flat, F sharp, G, A, B flat, C: a major chord on D with a half step above it. The step from E flat to F sharp is the colour of the desert. The key signature is that of G minor, and the music does not go home to G.'
  - 'The rhythm is the maqsum of a hand drum, on a drum kit: low, high, rest, high, low, rest, high, rest. The kick has the low strokes and the snare has the high strokes. The tune starts each phrase in that rhythm: two knocks, a rest, then up to A.'
  - 'The tune: D D, F sharp, A, G, F sharp; a turn on E flat, down to D. Again, with a question at the end. Then three bars that go down, G minor, F, E flat, and home to D.'
  - 'The second part is in B flat major with long notes, a backbeat and a ride cymbal. Its second phrase comes home with the same three notes as the tune: F sharp, E flat, D.'
  - 'In the last part the bass has the tune for four bars, and the lead rests. Then the full band has the end of the tune, and a fill goes to the start.'
  - 'No lead note is above A5: Jon hears high lead lines as piercing. No short figure goes down in a silence and no chip arpeggio goes up: in level music these read as game events (a death, a pickup).'
  - 'Instruments that Jon approved in other cues: the Growlybass Jazz Bass and the Naked Drums kit of Embedded Theme, with its square wave lead and quiet organ; the Shinyguitar archtop through a small clean amp, which he picked from a reel for Dinosaur Liberators. The guitar has short chords on the high strokes of the drum rhythm.'
  - 'Bar 2 of the tune has E flat for a beat and a half and then D, where the tune comes home. The harmony block has one chord for each bar, thus the arrangement audit reports that D as a note outside the chord. It is not.'
  - 'The file loops as a whole: bar 43 is bar 1. The last bar has no cymbal, and no note is longer than its bar.'
