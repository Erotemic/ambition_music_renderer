processing:
  groups:
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 34}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 220, q: 1.0, db: -1.5}
            - {type: peak, hz: 900, q: 0.9, db: 2.5}
            - {type: peak, hz: 2400, q: 1.0, db: 3.0}
        - {processor: compressor, threshold_db: -26.0, ratio: 4.0, attack_ms: 12.0, release_ms: 140.0, makeup_db: 5.0}
        - {processor: gain, gain_db: -1.0}
    bass_hi:
      chain:
        - {processor: highpass, cutoff_hz: 40}
        - {processor: lowpass, cutoff_hz: 2200}
        - {processor: compressor, threshold_db: -26.0, ratio: 4.0, attack_ms: 12.0, release_ms: 140.0, makeup_db: 5.0}
        - {processor: gain, gain_db: 1.5}
    lead:
      chain:
        - {processor: highpass, cutoff_hz: 250}
        - {processor: lowpass, cutoff_hz: 4800}
        - processor: pedalboard
          effects:
            - {effect: chorus, rate_hz: 0.9, depth: 0.18, mix: 0.25}
            - {effect: delay, delay_ms: 221, feedback: 0.25, mix: 0.12}
        - {processor: gain, gain_db: -8.0}
    lead_2:
      chain:
        - {processor: highpass, cutoff_hz: 250}
        - {processor: lowpass, cutoff_hz: 4200}
        - processor: pedalboard
          effects:
            - {effect: chorus, rate_hz: 0.7, depth: 0.18, mix: 0.25}
        - {processor: gain, gain_db: -11.0}
    guitar:
      chain:
        - processor: lv2
          plugin_uri: http://guitarix.sourceforge.net/plugins/gx_redeye#chump
          binary: lv2apply
          channel_mode: dual_mono
          params: {Gain: 0.38, Tone: 0.62, Volume: 0.5}
        - {processor: highpass, cutoff_hz: 110}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 2800, q: 1.0, db: 3.0}
        - {processor: lowpass, cutoff_hz: 6000}
        - {processor: lowpass, cutoff_hz: 6000}
        - {processor: compressor, threshold_db: -22.0, ratio: 2.2, attack_ms: 15.0, release_ms: 120.0, makeup_db: 2.0}
        - {processor: reverb, wet: 0.16, decay_seconds: 1.2}
        - {processor: gain, gain_db: -14.0}
        - {processor: balance, position: -0.45}
    organ:
      chain:
        - {processor: highpass, cutoff_hz: 200}
        - {processor: lowpass, cutoff_hz: 4200}
        - processor: pedalboard
          effects:
            - {effect: chorus, rate_hz: 5.5, depth: 0.12, mix: 0.3}
        - {processor: gain, gain_db: -4.0}
    hats:
      chain:
        - {processor: highpass, cutoff_hz: 400}
        - {processor: gain, gain_db: 15.0}
    drums:
      chain:
        - {processor: highpass, cutoff_hz: 36}
        - {processor: compressor, threshold_db: -20.0, ratio: 3.0, attack_ms: 18.0, release_ms: 110.0, makeup_db: 2.0}
        - {processor: gain, gain_db: 3.0}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 30}
      - {processor: compressor, threshold_db: -16.0, ratio: 2.2, attack_ms: 16.0, release_ms: 120.0, makeup_db: 1.5, knee_db: 6.0}
      - {processor: reverb, wet: 0.09, decay_seconds: 1.4}
      - {processor: limiter, target_peak_db: -2.0, drive: 0.92, normalize: true}
