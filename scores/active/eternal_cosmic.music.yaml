motifs:
  - id: harp_bloom
    root: E5
    intervals: [0, 4, 7, 11, 12]
    rhythm: [0.25, 0.25, 0.25, 0.25, 1.0]
    velocities: [0.56, 0.62, 0.70, 0.78, 0.88]

layer_templates:
  string_bed:
    kind: pad_chords
    instruments: [cosmic_violas]
    octave: 4
    every_bars: 1
    duration_beats: 3.7
    velocity: 44
    articulation: tenuto
    voicing: shell
    constraints:
      max_notes: 3
    humanize_ms: 3
    humanize_velocity_pct: 2

  piano_push:
    # Chords on the two off beats of each half bar: the push of a dance band.
    kind: arpeggio
    instrument: cosmic_grand
    octave: 4
    pattern: [0, 2, 1, 2, 0, 2, 1, 3]
    step: 0.5
    duration_beats: 0.42
    velocity: 60
    density: 1.0
    articulation: staccato
    voicing: open
    humanize_ms: 1
    humanize_velocity_pct: 2

  celesta_stars:
    kind: arpeggio
    instrument: cosmic_celesta
    octave: 6
    pattern: [2, 0, 1, 2, 3, 2, 1, 0]
    step: 0.5
    duration_beats: 0.40
    velocity: 44
    density: 1.0
    articulation: bell
    voicing: open
    humanize_ms: 1
    humanize_velocity_pct: 3

  disco_bass:
    kind: bassline
    instrument: cosmic_bass
    octave: 2
    pattern:
      - [0, 0.0, 0.42]
      - [12, 0.5, 0.36]
      - [0, 1.0, 0.42]
      - [12, 1.5, 0.36]
      - [0, 2.0, 0.42]
      - [12, 2.5, 0.36]
      - [7, 3.0, 0.42]
      - [12, 3.5, 0.36]
    velocity: 80
    articulation: staccato
    humanize_ms: 1
    humanize_velocity_pct: 2

  harp_blooms:
    kind: motif
    instrument: cosmic_harp
    motif: harp_bloom
    root: E5
    velocity: 56
    articulation: pluck
    gate: 0.80
    starts: [[3, 2.0], [7, 2.0], [11, 2.0], [15, 2.0], [19, 2.0], [23, 2.0], [25, 2.0], [27, 2.0], [29, 2.0], [31, 2.0], [33, 2.0], [35, 2.0], [37, 2.0], [39, 2.0]]
    repeats: 1
    humanize_ms: 1
    humanize_velocity_pct: 2

  dance_drums:
    kind: drums
    instrument: cosmic_kit
    humanize_ms: 1
    humanize_velocity_pct: 2
    events:
      - {drum: kick, beats: [0.0, 1.0, 2.0, 3.0], velocity: 86}
      - {drum: snare, beats: [1.0, 3.0], velocity: 70}
      - {drum: closed_hat, beats: [0.0, 0.25, 1.0, 1.25, 2.0, 2.25, 3.0, 3.25], velocity: 34}
      - {drum: open_hat, beats: [0.5, 1.5, 2.5, 3.5], velocity: 46}

playback:
  mode: section_stem_matrix
  intro: awakening
  loop_components: [anthem]
  exit_policy:
    request_outro: stop_at_next_valid_exit_bar
    bridge_stems: [lead, piano, bass, drums]
    fade_stems: [strings, choir, brass, sparkle, percussion]

state_map:
  starting: {section: awakening}
  default:
    preferred_section: anthem
    stems: {lead: 1.0, strings: 0.60, choir: 0.70, brass: 0.66, piano: 0.72, bass: 0.88, sparkle: 0.62, percussion: 0.80, drums: 0.90}

