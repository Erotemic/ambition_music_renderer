schema: ambition.musicir.v1
id: eternal_cosmic
title: Eternal Cosmic
seed: 2026101101
notes: >-
  The theme of Eternal Cosmic Mary-O, her ultimate form. An intro of two bars
  is as long as her transformation (3.4 s at 140 BPM): a harp goes up, the
  timpani roll, the horns call, and the choir and a cymbal arrive on the
  second bar. The loop is an anthem of sixteen bars in E major: violins have
  the tune over a disco bass in octaves, a kick on each beat and open hats
  between them, with a celesta over it. In the second eight bars the tune is
  in longer notes and a choir and horns hold the chords. It is not the theme
  of the quasar: that one is a sprint at 208 BPM with a piano in sixteenths.
  The loop is forty bars: the anthem, eight bars where the horns have a
  tune of their own and the violins rest, and the anthem again with the
  choir all through it. The tune stays at or under A5. Melody, harmony and
  rhythm are original.

tempo:
  bpm: 140
meter:
  beats_per_bar: 4
  beat_unit: 4

constraints:
  voice_leading: minimize_motion
  no_clusters: true

render:
  sample_rate: 48000
  ogg_quality: 6
  backend: pretty-midi
  soundfont: /usr/share/sounds/sf2/TimGM6mb.sf2
  sfizz:
    library_roots:
      - /data/audio-tools/sfz
      - /data/audio-tools
    fallback_backend: pretty-midi
  runtime_stems:
    target_peak_db: -9.0
    max_gain_db: 14.0

postprocess:
  gain_db: -0.8
  highpass_hz: 30
  lowpass_hz: 12800
  presence_low_hz: 1700
  presence_high_hz: 5200
  presence_db: 0.6
  transient_tame: 0.03
  transient_lowpass_hz: 10500
  reverb_wet: 0.035
  reverb_decay_seconds: 0.68
  reverb_damping_hz: 7600
  stereo_width: 0.16
  compressor_threshold_db: -17.0
  compressor_ratio: 2.8
  compressor_attack_ms: 7.0
  compressor_release_ms: 78.0
  compressor_makeup_db: 1.0
  compressor_knee_db: 5.0
  limiter_drive: 0.94
  normalize: true
  target_peak_db: -3.0
  eq_bands:
    - {type: low_shelf, hz: 85, q: 0.75, db: 1.0}
    - {type: peak, hz: 320, q: 0.90, db: -1.3}
    - {type: peak, hz: 2800, q: 1.00, db: -0.7}
    - {type: high_shelf, hz: 8200, q: 0.70, db: 0.5}

stem_postprocess:
  gain_db: 0.0
  highpass_hz: 30
  reverb_wet: 0.006
  reverb_decay_seconds: 0.32
  reverb_damping_hz: 7200
  stereo_width: 0.04
  limiter_drive: 0.86
  normalize: false
  target_peak_db: -4.0

