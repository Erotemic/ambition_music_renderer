schema: ambition.musicir.v3
id: shoulders_at_rest
title: Shoulders at Rest
description: >-
  The town music of the Math dimension: limestone and whitewash terraces on a clear morning. It is the
  peaceful relative of Standing on Shoulders, the GNU-ton boss music. The tune is the recursive run of
  the scholar (E F# G A B D E, and back down to E) at half speed, in G major, the relative major of the
  E minor of the boss music. The bridge has the chord loop of the boss bridge (Am G Em Bm C G D Em), and
  its brass call is a song on the clarinet. In the middle of the loop the run plays at its own speed on
  the piano, on top of the same run at half speed on a low clarinet and the falling tread of the giant
  (B A G E) on the bass: a small voice that stands on the shoulders of a big one. At the end of the
  loop the run comes home to G, the base case. The game plays it in two states on one loop: the
  terraces (piano, clarinet, harp, electric piano, strings, double bass) and the gate square (the same,
  with a soft swung drum groove and an acoustic guitar).
notes:
  - 'Jon, 2026-10-14: "Standing on shoulders is boss music. But it would be nice if you could compose something similar to it - musically related - that better serves as peaceful town music." Then: "Or maybe hustle&bustle music to relax and or study to, not sure." Then: "Or maybe there are different similar themes for the gate room and the upper town?" This cue is the two: one loop, two states. The calm state is a subset of the busy state, so a change of room changes only the gains of two layers.'
  - 'What it keeps from standing_on_shoulders (scores/active/standing_on_shoulders.music.yaml): the tempo (88 BPM); the motif scholar_recursive, with its notes, and in the shoulders section with its rhythm too; the motif scholar_quip (E G A B A G E G), as answers of the piano and as a sequence that climbs; the motif brass_declaration (E E B A G E E B), as the first bar of the bridge song; the giant tread (B A G E), as the bass line of bars 5 to 8 of the tune and as the walk of the bass in the shoulders section; the bridge chords Am G Em Bm C G D Em; and the turns Em D Em and Em G of its main sections.'
  - 'What it changes: the key centre moves from E minor to its relative major G (the same notes, so the motif has its own notes). The run of sixteenths becomes eighths with a light swing. Distortion guitars, brass, stomp drums, crash cymbals and the organ and harpsichord are not used. The highest held note is G5; the only A5 is a short note of the quip.'
  - 'The tune is eight bars. Bars 1 to 4 are the run at half speed (E F# G A B, D E, D B, A G F# E, F# G, E). Bars 5 to 8 are the same run, one third higher in the scale, so it ends on G, over the chord of E minor.'
  - 'Form, 48 bars, about 2:11: morning (the tune on the piano), terraces (the tune on the clarinet, answers on the piano), lecture (the bridge), shoulders (the run on top of the run), market (the tune on the clarinet and the piano together), base_case (the run comes home to G). The file loops as a whole: bar 49 is bar 1. The last bar is quiet from its third beat, and no note goes across the end of a section.'
  - 'Playback layers: bed (double bass, electric piano, strings), tune (piano, clarinet), harp, groove (drums and hi-hat), comp (acoustic guitar). The terraces state is bed + tune + harp. The gate square state is all five.'
  - 'Swing: each off-beat eighth is at 7/12 of the beat. Sixteenths move in proportion.'
seed: 2026101401
timebase: {ppq: 960}
meter: 4/4
tempo: 88
key: G major
end: {bar: 49, beat: 1}
form:
  - {id: morning, label: 'Morning: the tune on the piano', from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, role: loop_component, loopable: true}
  - {id: terraces, label: 'Terraces: the tune on the clarinet, the piano answers', from: {bar: 9, beat: 1}, to: {bar: 17, beat: 1}, role: loop_component, loopable: true}
  - {id: lecture, label: 'Lecture: the bridge chords of the boss music', from: {bar: 17, beat: 1}, to: {bar: 25, beat: 1}, role: loop_component, loopable: true}
  - {id: shoulders, label: 'Shoulders: the run on top of the run', from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, role: loop_component, loopable: true}
  - {id: market, label: 'Market: the tune, full', from: {bar: 33, beat: 1}, to: {bar: 41, beat: 1}, role: loop_component, loopable: true}
  - {id: base_case, label: 'Base case: the run comes home to G', from: {bar: 41, beat: 1}, to: {bar: 49, beat: 1}, role: loop_component, loopable: true}
render:
  backend: pretty-midi
  sample_rate: 48000
  ogg_quality: 7
  metadata_markers:
    - {bar: 1, id: m1, label: Morning}
    - {bar: 9, id: m9, label: Terraces}
    - {bar: 17, id: m17, label: Lecture}
    - {bar: 25, id: m25, label: Shoulders}
    - {bar: 33, id: m33, label: Market}
    - {bar: 41, id: m41, label: Base case}
playback:
  # The game plays these files: one for each layer. A layer is the sum of its groups
  # before the master chain. The terraces state is bed + tune + harp; the gate square
  # state adds groove and comp.
  layers:
    bed: [bass, rhodes, strings]
    tune: [piano, clarinet]
    harp: [harp]
    groove: [drums, hats]
    comp: [guitar]
  sections:
    - {id: town, form: [morning, terraces, lecture, shoulders, market, base_case], loop: true}
instruments:
  - name: piano
    group: piano
    program: acoustic_grand_piano
    volume: 100
    pan: 64
    expression: 108
    instrument_backend: {kind: sfz, library_ref: freepats.salamander_grand}
  - name: clarinet
    group: clarinet
    program: clarinet
    volume: 104
    pan: 64
    expression: 108
    # The mod wheel (CC1) sets the level of this VPO patch: up to 29 dB.
    modulation: 100
    instrument_backend: {kind: sfz, library_ref: vpo.clarinet_solo_perf}
  - name: rhodes
    group: rhodes
    program: electric_piano_1
    volume: 100
    pan: 64
    expression: 104
    instrument_backend: {kind: sfz, library_ref: epiano.rhodes}
  - name: strings
    group: strings
    program: string_ensemble_1
    volume: 84
    pan: 64
    expression: 92
    # The mod wheel (CC1) sets the level of this VPO patch.
    modulation: 56
    instrument_backend: {kind: sfz, library_ref: vpo.strings}
  - name: harp
    group: harp
    program: orchestral_harp
    volume: 100
    pan: 64
    expression: 104
    instrument_backend: {kind: sfz, library_ref: folk.harp}
  - name: bass
    group: bass
    program: acoustic_bass
    volume: 112
    pan: 64
    expression: 114
    instrument_backend: {kind: sfz, library_ref: bass.meatbass_pizz, required: true, settings: {fold_to_range: false}}
  - name: guitar
    group: guitar
    program: steel_guitar
    volume: 104
    pan: 64
    expression: 108
    controls: {100: 126, 107: 127}
    instrument_backend: {kind: sfz, library_ref: guitar.acoustic, settings: {fold_to_range: false}}
  - name: kit
    group: drums
    is_drum: true
    volume: 104
    pan: 64
    expression: 110
    instrument_backend: {kind: sfz, library_ref: drums.naked, settings: {render_timeout_s: 900}}
  - name: hats
    group: hats
    is_drum: true
    volume: 104
    pan: 64
    expression: 110
    instrument_backend: {kind: sfz, library_ref: drums.naked, settings: {render_timeout_s: 900}}
