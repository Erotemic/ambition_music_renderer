  groups:
    piano:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: band_gain, low_hz: 2800, high_hz: 5500, gain_db: -2.0}
        - {processor: lowpass, cutoff_hz: 7500}
        - {processor: reverb, wet: 0.18, decay_seconds: 1.5, damping_hz: 4200}
        - {processor: gain, gain_db: 14.0}
        - {processor: balance, position: -0.6}
    clarinet:
      chain:
        - {processor: highpass, cutoff_hz: 140}
        - {processor: band_gain, low_hz: 2500, high_hz: 5000, gain_db: -2.5}
        - {processor: lowpass, cutoff_hz: 7000}
        - {processor: reverb, wet: 0.2, decay_seconds: 1.6, damping_hz: 4000}
        - {processor: gain, gain_db: 3.0}
        - {processor: balance, position: 0.15}
    rhodes:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: lowpass, cutoff_hz: 5500}
        - processor: pedalboard
          effects:
            - {effect: chorus, rate_hz: 0.6, depth: 0.15, mix: 0.25}
        - {processor: reverb, wet: 0.16, decay_seconds: 1.4, damping_hz: 3800}
        - {processor: gain, gain_db: 2.0}
        - {processor: balance, position: -0.3}
    strings:
      chain:
        - {processor: highpass, cutoff_hz: 120}
        - {processor: lowpass, cutoff_hz: 6000}
        - {processor: reverb, wet: 0.28, decay_seconds: 1.8, damping_hz: 3600}
        - {processor: gain, gain_db: -1.0}
    harp:
      chain:
        - {processor: highpass, cutoff_hz: 100}
        - {processor: lowpass, cutoff_hz: 7000}
        - {processor: reverb, wet: 0.22, decay_seconds: 1.6, damping_hz: 4000}
        - {processor: gain, gain_db: 10.0}
        - {processor: balance, position: 0.35}
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 38}
        - {processor: compressor, threshold_db: -28.0, ratio: 2.5, attack_ms: 20.0, release_ms: 160.0, makeup_db: 2.0}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 250, q: 0.8, db: 1.5}
            - {type: peak, hz: 800, q: 0.8, db: 3.0}
        - {processor: lowpass, cutoff_hz: 3200}
        - {processor: gain, gain_db: 0.0}
