schema: ambition.musicir.v1
id: cedar_light_guitar_study
title: Cedar Light - Angelic Full Ensemble
seed: 202608072047
notes: 'Large-ensemble revision of Cedar Light. The long-ringing open-position acoustic rhythm guitar remains the spine, but
  the song now opens at full scale: audible fingerpicked acoustic, electric bass, active folk kit, orchestral bass drum/snare/cymbal
  and timpani, Sonatina strings and brass, Etherealwinds harp, flute color, and a two-register choir. The roughly 3:45 form
  develops continuously by changing voicings, countermelodies, choir register, drum weight, and orchestral density rather
  than by withholding the ensemble at the beginning.'
tempo:
  bpm: 94
meter:
  beats_per_bar: 4
  beat_unit: 4
