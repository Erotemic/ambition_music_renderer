schema: ambition.musicir.v3
id: nine_to_five_birth_to_death
title: Nine-to-Five, Birth-to-Death
description: >-
  Fast Capital exploration music driven by Salamander Grand, electric bass, and a syncopated drum kit.
  A Surge XT pluck picks up the end of the piano phrase and hands it a five-note reply.
  After a brief piano-led intro, the beat carries through a descending verse and an E-flat lift.
seed: 905
timebase: {ppq: 960}
meter: 4/4
tempo: 168
key: {tonic: C, mode: minor}
end: {bar: 61, beat: 1}
form:
  - {id: arrival, from: {bar: 1, beat: 1}, to: {bar: 5, beat: 1}, role: 'The piano starts the shift and the band locks in'}
  - {id: clock_in, from: {bar: 5, beat: 1}, to: {bar: 13, beat: 1}, role: 'The piano states the nine-sixteenth phrase and synth answers in five'}
  - {id: commute, from: {bar: 13, beat: 1}, to: {bar: 21, beat: 1}, role: 'The bass keeps moving as the harmony opens into E-flat'}
  - {id: pressure, from: {bar: 21, beat: 1}, to: {bar: 29, beat: 1}, role: 'The piano moves down and the bass line descends'}
  - {id: release, from: {bar: 29, beat: 1}, to: {bar: 37, beat: 1}, role: 'The synth takes the higher line over offbeat piano chords'}
  - {id: second_shift, from: {bar: 37, beat: 1}, to: {bar: 45, beat: 1}, role: 'The piano theme comes back with the full groove'}
  - {id: switch_places, from: {bar: 45, beat: 1}, to: {bar: 53, beat: 1}, role: 'The synth takes nine and the piano takes five'}
  - {id: clock_out, from: {bar: 53, beat: 1}, to: {bar: 61, beat: 1}, role: 'The bass turns the dominant back into the opening'}
