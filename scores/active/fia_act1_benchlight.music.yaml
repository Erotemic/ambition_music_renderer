schema: ambition.musicir.v1
id: fia_act1_benchlight
title: "Fia I — Benchlight"
seed: 2026081601
notes: >-
  Act I Fia theme. Warm, intimate workshop chamber music for the period where
  repair, trust, teasing familiarity, and shared danger are still the dominant
  truth of the relationship. The two-bar Fia motif rises openly through D major
  and deliberately needs a second voice to complete its cadence: friendship is
  represented as an answered phrase rather than a self-contained declaration.
  Foreshadowing stays almost subliminal: two brief borrowed-minor shadows and a
  low semitone/tritone figure appear while the main melody rests, then the cue
  behaves as though nothing happened. This should feel safe on first hearing
  and only sound ominous in retrospect after Acts II and III.
