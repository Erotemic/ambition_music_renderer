schema: ambition.musicir.v1
id: fia_act1_deep_polish_82_new_room_glass_stair
title: 'Fia Act I Deep Polish 82 — New Room: Glass Stair'
seed: 20260816
notes: Deep composition polish. Preserve the accepted chromatic bass descent/ascent exactly, but replace the clustered
  upper sonorities with open seventh-chord shells and write the lead as a contrary-motion guide-tone line. The resulting
  harmony is stranger because of the bass path, not because neighboring notes grind against each other.
