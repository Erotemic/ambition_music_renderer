authoring:
  audition_axis: chromatic bass plus open seventh-chord planing is the identity
  bass_policy: Every bar-long bass note is copied exactly from polish 79, including the reverse ascent in the middle.
  backing_revision: Close D/E, E/F, and D/Eb clusters are replaced with open seventh-chord shells. Chord attacks retain
    .68 and 1.82 timing.
  harmonic_grammar: Dmaj7 → C#m7 → Cmaj7 → Bm7 → Bbmaj7 → A major → Abmaj7 → Gmaj7; middle section traverses the chain
    in reverse.
  melody_revision: Alternating one-note and two-note bars create a repeated upward answer against the descending bass,
    then invert the relationship in the middle section.
  special_hook: Bass falls chromatically while the upper voice repeatedly climbs within each chord; the middle eight
    bars reverse that geometry.
  foreshadowing_policy: A single E5 ninth over the late Dmaj7 return is a normal extension, voiced softly and resolved
    into the chord.
  subtle_foreshadowing_color:
    bar: 24
    beat: 0.68
    pitch: E5
    duration: 0.82
    velocity: 68
    idea: A ninth above D, soft enough to feel like air in the voicing rather than a wrong note.
  instrument: freepats.salamander_grand
