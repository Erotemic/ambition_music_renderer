schema: ambition.musicir.v1
id: fia_alt_act1_bench_test
title: "Fia I — Bench Test"
seed: 202608161101
notes: >-
  Alternate Fia trilogy direction: game-forward electro-workshop music instead of
  chamber-orchestral storytelling. Act I must work as a genuinely excellent,
  repeatable character cue before the later arc exists. A two-bar A-major hook is
  played primarily by warm electric piano and answered/doubled sparingly by a
  soft square lead. Clavinet offbeats, pocket synth bass, dry rim/hat percussion,
  and tiny vibraphone tool-pings make the bench feel inhabited without turning the
  track into literal foley. One single D# metal ping appears late in the loop over
  a D-major harmony: the one wrong gear tooth, intentionally unexplained and never
  repeated. On first hearing it should just feel intriguingly odd.
tempo:
