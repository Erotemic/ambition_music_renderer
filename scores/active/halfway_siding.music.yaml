schema: ambition.musicir.v3
id: halfway_siding
title: Halfway Siding
description: >-
  The Frontier's first slice: Halfway Siding, the auxiliary gate town on the gulch rim, its station and street, its recovery inn, its trestle and Sprocket Row, on one motif, the detour. Generated by dev/compose_halfway_siding.py: edit that, not
  this file.
notes:
  - 'Jon, 2026-11-20: a cue for the gate town and the inn. The references were mood only. His first review: it opened on silence and was too schmaltzy; it must loop.'
  - 'The detour: A D E F#, E D B, A. The trestle turns it minor.'
  - 'The game binds the sections to rooms (Ambition music_cues.ron): platform (the station, the street), lie_down (the inn), trestle (the trestle), sprocket (Sprocket Row).'
