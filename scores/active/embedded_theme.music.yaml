schema: ambition.musicir.v3
id: embedded_theme
title: Embedded Theme
description: >-
  Mary-O world 1-2, the level below the ground. Support Theme is her play on a ground
  theme; this is her play on an underground theme: a bass that has the tune, silence
  after each phrase, and a quiet, quick hi-hat.
notes:
  - 'Third version, from the ground up. Jon on the first: too close to the model, and the percussion (bongos, woodblocks, timbales) was not good. On the second: the brushes were bad; he wanted something subtle with a faster beat, "ch chch ch chch", and less dissonance.'
  - 'The beat is straight sixteenth notes at 132 BPM. The hi-hat plays one eighth note and two sixteenth notes in each beat. A soft kick and a side stick come in later. There is no other percussion.'
  - 'Each note is in E natural minor: the tune is a minor pentatonic scale, and the way out goes down the scale. The first two versions had chromatic runs, whole-tone stairs and a stop on the tritone.'
  - 'What is kept from the idea of an underground theme: the bass has the tune, the notes are short, and each phrase leaves silence. The notes, the rhythm and the form are not those of the model.'
  - 'The bridge is the motto of Support Theme (her level theme) in E minor, with its own rhythm: the levels of one world share one tune.'
  - 'Embedded: a square-wave buzzer answers in the first section, and a square wave doubles the bass in the last.'
seed: 20261011
timebase: {ppq: 960}
meter: 4/4
tempo: 132
key: E minor
end: {bar: 37, beat: 1}
form:
  - {id: tune_a, from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, energy: 1.0, density: 1.0, role: 'the bass has the tune; a quiet hi-hat; the buzzer answers'}
  - {id: tune_b, from: {bar: 9, beat: 1}, to: {bar: 17, beat: 1}, energy: 1.0, density: 1.0, role: 'the tune again; a marimba answers; a soft kick'}
  - {id: bridge, from: {bar: 17, beat: 1}, to: {bar: 25, beat: 1}, energy: 1.0, density: 1.0, role: 'the Support Theme motto in the minor'}
  - {id: tune_c, from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, energy: 1.0, density: 1.0, role: 'the tune with all the band'}
  - {id: way_out, from: {bar: 33, beat: 1}, to: {bar: 37, beat: 1}, energy: 1.0, density: 1.0, role: 'down the scale and a stop on the fifth; the hi-hat goes back to the start'}
