schema: ambition.musicir.v3
id: embedded_theme
title: Embedded Theme
description: >-
  Mary-O world 1-2, the level below the ground. Support Theme is her play on a ground
  theme; this is her play on an underground theme. A bass in octave pairs with silence
  after it, a chromatic tail that slows down and stops on a note that does not resolve,
  and drums with a swing.
notes:
  - 'A parody by shape, not by notes. The model has octave pairs that go down a minor third and up a semitone, then the same a fifth lower, then semitone pairs that go down around a circle of fourths. Each interval here is the mirror: up a minor third and down a semitone, then a fifth higher, then semitone pairs that go up around a circle of fifths. No phrase of the model is here.'
  - 'The grid is a triplet swing: 12 parts in a bar. The model is straight.'
  - 'The bridge is the motto of Support Theme (her level theme) in E minor: the levels of one world share one tune.'
  - 'Embedded: a square-wave buzzer answers in the silence, a square wave doubles the bass, and woodblocks tick like a clock. The echo is the cave.'
  - 'The last tail has no drum fill, so the loop goes back to the quiet first hook.'
seed: 20261010
timebase: {ppq: 960}
meter: 4/4
tempo: 108
key: E dorian
end: {bar: 45, beat: 1}
form:
  - {id: hook_a, from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, energy: 1.0, density: 1.0, role: 'the hook alone: bass, a clock of woodblocks, and the buzzer in the silence'}
  - {id: tail_a, from: {bar: 9, beat: 1}, to: {bar: 13, beat: 1}, energy: 1.0, density: 1.0, role: 'the tail, and one bar of silence'}
  - {id: hook_b, from: {bar: 13, beat: 1}, to: {bar: 21, beat: 1}, energy: 1.0, density: 1.0, role: 'the hook with the drums; a steel drum answers'}
  - {id: tail_b, from: {bar: 21, beat: 1}, to: {bar: 25, beat: 1}, energy: 1.0, density: 1.0, role: 'the tail with a marimba two octaves above'}
  - {id: bridge, from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, energy: 1.0, density: 1.0, role: 'the Support Theme motto in the minor over a bass that does not stop'}
  - {id: hook_c, from: {bar: 33, beat: 1}, to: {bar: 41, beat: 1}, energy: 1.0, density: 1.0, role: 'the hook with all the band'}
  - {id: tail_c, from: {bar: 41, beat: 1}, to: {bar: 45, beat: 1}, energy: 1.0, density: 1.0, role: 'the tail; the silence goes back to the first hook'}
