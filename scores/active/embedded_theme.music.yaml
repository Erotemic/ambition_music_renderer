processing:
  groups:
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 32}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 900, q: 1.0, db: 2.0}
        - {processor: compressor, threshold_db: -24.0, ratio: 3.0, attack_ms: 12.0, release_ms: 110.0, makeup_db: 2.5}
        - {processor: gain, gain_db: 5.0}
    chip:
      chain:
        - {processor: highpass, cutoff_hz: 120}
        - {processor: lowpass, cutoff_hz: 5200}
        - {processor: gain, gain_db: -5.0}
    beep:
      chain:
        - {processor: highpass, cutoff_hz: 700}
        - {processor: lowpass, cutoff_hz: 7000}
        - processor: pedalboard
          effects:
            - {effect: delay, delay_ms: 227, feedback: 0.25, mix: 0.3}
        - {processor: gain, gain_db: -6.0}
    lead:
      chain:
        - {processor: highpass, cutoff_hz: 200}
        - {processor: lowpass, cutoff_hz: 6500}
        - processor: pedalboard
          effects:
            - {effect: delay, delay_ms: 227, feedback: 0.25, mix: 0.14}
        - {processor: gain, gain_db: -2.0}
    steel:
      chain:
        - {processor: highpass, cutoff_hz: 180}
        - processor: pedalboard
          effects:
            - {effect: delay, delay_ms: 227, feedback: 0.25, mix: 0.2}
    marimba:
      chain:
        - {processor: highpass, cutoff_hz: 140}
        - processor: pedalboard
          effects:
            - {effect: delay, delay_ms: 227, feedback: 0.25, mix: 0.18}
    drums:
      chain:
        - {processor: highpass, cutoff_hz: 40}
        - {processor: lowpass, cutoff_hz: 11000}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 30}
      - {processor: compressor, threshold_db: -17.0, ratio: 2.4, attack_ms: 14.0, release_ms: 110.0, makeup_db: 1.5, knee_db: 6.0}
      - {processor: reverb, wet: 0.07, decay_seconds: 1.2}
      - {processor: limiter, target_peak_db: -2.0, drive: 0.92, normalize: true}
