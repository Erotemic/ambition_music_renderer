schema: ambition.musicir.v3
id: embedded_theme
title: Embedded Theme
description: >-
  Mary-O world 1-2, the level below the ground. Support Theme is her play on a ground
  theme; this is her play on an underground theme: a bass that has the tune, silence
  after each phrase, and a tail that stops on a note that does not resolve. The band is
  a small jazz group with brushes.
notes:
  - 'Jon, 2026-10-11, on the first draft: too close to the model, and he did not like the percussion; he wanted jazz brush drums. That draft had octave pairs in the rhythm of the model, a chromatic run, bongos, woodblocks and timbales. None of them is here.'
  - 'What is kept from the idea of an underground theme: the bass has the tune, each phrase stops and leaves silence, and the tail does not resolve. The notes, the rhythm and the form are new: two knocks and a fall of three quick notes, on a blues of 12 bars, with stairs of whole tones for a tail.'
  - 'The grid is a triplet swing: 12 parts in a bar.'
  - 'The bridge is the motto of Support Theme (her level theme) in E minor: the levels of one world share one tune.'
  - 'Embedded: a square-wave buzzer answers in the silence, and a square wave doubles the bass. The echo is the cave.'
  - 'Drums: Big Rusty Drums with brushes (controllers 25 to 28 select the brush samples). Each piece of the kit is its own small program, so each has its own level: the stirs are 20 dB below the kick in the samples.'
  - 'The last tail has no drum fill, so the loop goes back to the quiet first hook.'
seed: 20261010
timebase: {ppq: 960}
meter: 4/4
tempo: 108
key: E dorian
end: {bar: 45, beat: 1}
form:
  - {id: hook_a, from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, energy: 1.0, density: 1.0, role: 'the hook alone: bass, brush stirs, and the buzzer in the silence'}
  - {id: tail_a, from: {bar: 9, beat: 1}, to: {bar: 13, beat: 1}, energy: 1.0, density: 1.0, role: 'the tail, and one bar of silence'}
  - {id: hook_b, from: {bar: 13, beat: 1}, to: {bar: 21, beat: 1}, energy: 1.0, density: 1.0, role: 'the hook with the brushes in full swing; a steel drum answers'}
  - {id: tail_b, from: {bar: 21, beat: 1}, to: {bar: 25, beat: 1}, energy: 1.0, density: 1.0, role: 'the tail with a marimba two octaves above'}
  - {id: bridge, from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, energy: 1.0, density: 1.0, role: 'the Support Theme motto in the minor over a walking bass and a brushed ride'}
  - {id: hook_c, from: {bar: 33, beat: 1}, to: {bar: 41, beat: 1}, energy: 1.0, density: 1.0, role: 'the hook with all the band'}
  - {id: tail_c, from: {bar: 41, beat: 1}, to: {bar: 45, beat: 1}, energy: 1.0, density: 1.0, role: 'the tail; the silence goes back to the first hook'}
