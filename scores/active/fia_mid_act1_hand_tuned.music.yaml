schema: ambition.musicir.v1
id: fia_mid_act1_hand_tuned
title: "Fia I — Hand-Tuned"
seed: 202608161401
notes: >-
  Fourth Fia Act I direction, designed specifically to preserve the intimacy of
  the original chamber version without any woodwind/storybook lead. The theme
  belongs to Fia's hands and workbench: a mid-register grand piano states the
  trust phrase, while a clean guitar answers only at phrase ends rather than
  narrating continuously. Viola and cello remain warm but restrained. A quiet
  square servo, low synth motor, and sparse dry tool ticks put a robot-mechanic
  pulse under the acoustic writing without turning the cue into synth-pop.
  The harmony stays mostly safe D major. One short D# calibration chirp occurs
  exactly once over D major late in the loop and is never acknowledged.
tempo: {bpm: 98}
meter: {beats_per_bar: 3, beat_unit: 4}
constraints: {voice_leading: minimize_motion, no_clusters: true}
render:
  sample_rate: 48000
  ogg_quality: 6
  backend: pretty-midi
  sfizz:
    library_roots: [/data/audio-tools/sfz, /data/audio-tools]
    fallback_backend: pretty-midi
postprocess:
  gain_db: -0.8
  highpass_hz: 31
  lowpass_hz: 12000
  presence_low_hz: 1450
  presence_high_hz: 3900
  presence_db: 0.05
  reverb_wet: 0.092
  reverb_decay_seconds: 1.08
  reverb_damping_hz: 5850
  stereo_width: 0.10
  compressor_threshold_db: -18.2
  compressor_ratio: 1.85
  compressor_attack_ms: 22
  compressor_release_ms: 150
  compressor_makeup_db: 0.3
  compressor_knee_db: 6
  limiter_drive: 0.85
  normalize: true
  target_peak_db: -7.5
stem_postprocess:
  highpass_hz: 30
  reverb_wet: 0.015
  reverb_decay_seconds: 0.58
  reverb_damping_hz: 6000
  stereo_width: 0.03
  normalize: false
  target_peak_db: -3.0
group_postprocess:
  melody: {gain_db: 0.4, highpass_hz: 65, lowpass_hz: 11200, reverb_wet: 0.012}
  answer: {gain_db: -1.0, highpass_hz: 90, lowpass_hz: 9800, reverb_wet: 0.018}
  harmony: {gain_db: -0.8, highpass_hz: 80, lowpass_hz: 10100, reverb_wet: 0.018}
  strings: {gain_db: -1.8, highpass_hz: 90, lowpass_hz: 8800, reverb_wet: 0.024}
  low_strings: {gain_db: -1.7, highpass_hz: 34, lowpass_hz: 7300}
  machine: {gain_db: -4.2, highpass_hz: 110, lowpass_hz: 7600, reverb_wet: 0.002}
  pulse: {gain_db: -4.4, highpass_hz: 42, lowpass_hz: 5200}
  percussion: {gain_db: -6.2, highpass_hz: 180, lowpass_hz: 9600, transient_tame: 0.035, reverb_wet: 0.001}
instruments:
  - name: fia_piano
    group: melody
    program: acoustic_grand_piano
    volume: 92
    pan: 55
    expression: 106
    instrument_backend:
      kind: sfz
      library_ref: freepats.salamander_grand
      prefer: [piano, sustain]
      optional: true
      fallback_backend: pretty-midi
  - name: bench_piano
    group: harmony
    program: acoustic_grand_piano
    volume: 74
    pan: 43
    expression: 90
    instrument_backend:
      kind: sfz
      library_ref: freepats.salamander_grand
      prefer: [piano, sustain]
      optional: true
      fallback_backend: pretty-midi
  - name: bench_guitar
    group: answer
    program: clean_guitar
    volume: 68
    pan: 78
    expression: 84
    controls: {100: 64}
    instrument_backend:
      kind: sfz
      library_ref: guitar.hollowbody
      prefer: [03 combo keyswitch, combo keyswitch, blackandgreenguitars]
      optional: true
      fallback_backend: pretty-midi
  - name: warm_viola
    group: strings
    program: viola
    volume: 56
    pan: 35
    expression: 80
    instrument_backend:
      kind: sfz
      library_ref: strings.violas
      prefer: [viola, sustain]
      optional: true
      fallback_backend: pretty-midi
  - name: soft_cello
    group: low_strings
    program: cello
    volume: 62
    pan: 42
    expression: 86
    instrument_backend:
      kind: sfz
      library_ref: strings.celli
      prefer: [cello, sustain]
      optional: true
      fallback_backend: pretty-midi
  - {name: servo_square, group: machine, program: lead_square, volume: 30, pan: 81, expression: 50, modulation: 1}
  - {name: motor_shadow, group: pulse, program: synth_bass_1, volume: 36, pan: 59, expression: 54}
  - {name: tool_clicks, group: percussion, is_drum: true, volume: 50, pan: 62, expression: 60}
motifs:
  - id: hand_tuned_trust
    root: D4
    intervals: [0, 4, 7, 9, 7, 5, 2, 4, 0]
    rhythm: [0.5, 0.5, 0.75, 0.25, 0.75, 0.5, 0.5, 0.75, 1.5]
    velocities: [0.58, 0.62, 0.70, 0.66, 0.74, 0.62, 0.56, 0.62, 0.48]
  - id: hand_tuned_answer
    root: A3
    intervals: [0, 5, 4, 2, 0]
    rhythm: [0.75, 0.75, 0.5, 1.0, 3.0]
    velocities: [0.40, 0.48, 0.44, 0.40, 0.32]
  - id: servo_breath
    root: A3
    intervals: [0, 7, 4]
    rhythm: [0.20, 0.20, 2.60]
    velocities: [0.24, 0.20, 0.12]
  - id: wrong_calibration
    root: D6
    intervals: [1]
    rhythm: [0.14]
    velocities: [1.0]
layer_templates:
  piano_workbench:
    kind: arpeggio
    instrument: bench_piano
    octave: 3
    pattern: [0, 2, 1, 3, 1, 2]
    step: 0.5
    duration_beats: 0.34
    velocity: 31
    density: 0.62
    articulation: legato
    humanize_ms: 11
    humanize_velocity_pct: 5
  cello_foundation:
    kind: bassline
    instrument: soft_cello
    octave: 2
    pattern: [[0, 0.0, 1.25], [12, 1.5, 0.90]]
    velocity: 33
    articulation: tenuto
    humanize_ms: 9
    humanize_velocity_pct: 4
  viola_warmth:
    kind: pad_chords
    instrument: warm_viola
    octave: 3
    every_bars: 1
    duration_beats: 2.74
    velocity: 23
    articulation: tenuto
    voicing: open
    humanize_ms: 14
    humanize_velocity_pct: 4
  fia_theme:
    kind: motif
    instrument: fia_piano
    motif: hand_tuned_trust
    velocity: 58
    articulation: tenuto
    gate: 0.89
    humanize_ms: 7
    humanize_velocity_pct: 4
  guitar_answer:
    kind: motif
    instrument: bench_guitar
    motif: hand_tuned_answer
    velocity: 44
    articulation: tenuto
    gate: 0.84
    humanize_ms: 9
    humanize_velocity_pct: 5
  servo_answer:
    kind: motif
    instrument: servo_square
    motif: servo_breath
    velocity: 26
    articulation: normal
    gate: 0.48
    humanize_ms: 2
    humanize_velocity_pct: 2
  motor_root:
    kind: bassline
    instrument: motor_shadow
    octave: 2
    pattern: [[0, 0.0, 0.20], [12, 2.5, 0.18]]
    velocity: 24
    articulation: staccato
    humanize_ms: 2
    humanize_velocity_pct: 2
  quiet_tools:
    kind: drums
    instrument: tool_clicks
    humanize_ms: 5
    humanize_velocity_pct: 5
    events:
      - {drum: side_stick, beats: [1.5], velocity: 19, duration_beats: 0.035, probability: 0.48}
      - {drum: claves, beats: [2.5], velocity: 16, duration_beats: 0.035, probability: 0.30}
playback:
  mode: section_stem_matrix
  loop_components: [fia_mid_act1_loop]
  exit_policy:
    request_outro: next_valid_exit_bar
    fade_aggressive_stems_beats: 6
    bridge_stems: [melody, harmony, strings, low_strings]
    fade_stems: [answer, machine, pulse, percussion]
state_map:
  default:
    section: fia_mid_act1_loop
    stems: {melody: 0.86, answer: 0.40, harmony: 0.68, strings: 0.34, low_strings: 0.42, machine: 0.18, pulse: 0.12, percussion: 0.08}
  quiet:
    section: fia_mid_act1_loop
    stems: {melody: 0.68, answer: 0.24, harmony: 0.52, strings: 0.26, low_strings: 0.32, machine: 0.09, pulse: 0.07, percussion: 0.04}
sections:
  - id: fia_mid_act1_loop
    kind: loop_component
    label: Fia Act I - hand tuned
    bars: 32
    intensity: 0.40
    density: 0.43
    loopable: true
    valid_exit_local_bars: [8, 16, 24, 32]
    harmony:
      [Dmaj7, A/C#, Bm7, Gmaj7, D/F#, Em7, G6, A,
       Dmaj7, A/C#, Bm7, Gmaj7, D/F#, Em7, G6, A,
       Dmaj7, A/C#, Bm7, Gmaj7, Em7, A, Gm6/D, Dmaj7,
       Bm7, Gmaj7, D/F#, Em7, G6, A, Gm6/D, Dmaj7]
    layers:
      - piano_workbench
      - cello_foundation
      - viola_warmth
      - motor_root
      - quiet_tools
      - {template: fia_theme, starts: [[0, 0.0], [8, 0.0], [16, 0.0], [24, 0.0]]}
      - {template: guitar_answer, starts: [[2, 0.0], [10, 0.0], [18, 0.0], [26, 0.0]]}
      - {template: servo_answer, starts: [[6, 0.0], [14, 0.0], [22, 0.0]]}
      - kind: motif
        instrument: servo_square
        motif: wrong_calibration
        velocity: 34
        articulation: staccato
        gate: 0.28
        starts: [[23, 2.62]]
