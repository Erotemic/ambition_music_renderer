processing:
  groups:
    piano:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: band_gain, low_hz: 2800, high_hz: 5500, gain_db: -2.5}
        - {processor: lowpass, cutoff_hz: 7500}
        - {processor: reverb, wet: 0.16, decay_seconds: 1.4, damping_hz: 4200}
        - {processor: gain, gain_db: 15.0}
        - {processor: balance, position: -0.67}
    rhodes:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: lowpass, cutoff_hz: 5500}
        - processor: pedalboard
          effects:
            - {effect: chorus, rate_hz: 0.6, depth: 0.15, mix: 0.25}
        - {processor: reverb, wet: 0.14, decay_seconds: 1.3, damping_hz: 3800}
        - {processor: gain, gain_db: 2.0}
        - {processor: balance, position: -0.35}
    marimba:
      chain:
        - {processor: highpass, cutoff_hz: 150}
        - {processor: band_gain, low_hz: 2500, high_hz: 6000, gain_db: -3.0}
        - {processor: lowpass, cutoff_hz: 7000}
        - {processor: reverb, wet: 0.16, decay_seconds: 1.2, damping_hz: 4000}
        - {processor: gain, gain_db: 17.0}
        - {processor: balance, position: 0.62}
    pizz:
      chain:
        - {processor: highpass, cutoff_hz: 200}
        - {processor: band_gain, low_hz: 2500, high_hz: 6000, gain_db: -3.0}
        - {processor: lowpass, cutoff_hz: 7000}
        - {processor: reverb, wet: 0.2, decay_seconds: 1.3, damping_hz: 4000}
        - {processor: gain, gain_db: 4.0}
        - {processor: balance, position: -0.69}
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 38}
        - {processor: compressor, threshold_db: -28.0, ratio: 2.5, attack_ms: 20.0, release_ms: 160.0, makeup_db: 2.0}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 250, q: 0.8, db: 1.5}
            - {type: peak, hz: 800, q: 0.8, db: 2.0}
        - {processor: lowpass, cutoff_hz: 3000}
        - {processor: gain, gain_db: -3.0}
    drums:
      chain:
        - {processor: highpass, cutoff_hz: 38}
        - {processor: lowpass, cutoff_hz: 6500}
        - {processor: compressor, threshold_db: -22.0, ratio: 2.5, attack_ms: 15.0, release_ms: 120.0, makeup_db: 1.5}
        - {processor: reverb, wet: 0.08, decay_seconds: 0.9, damping_hz: 3500}
        - {processor: gain, gain_db: 8.0}
    shaker:
      chain:
        - {processor: highpass, cutoff_hz: 500}
        - {processor: lowpass, cutoff_hz: 5000}
        - {processor: reverb, wet: 0.1, decay_seconds: 0.8, damping_hz: 3500}
        - {processor: gain, gain_db: 20.0}
        - {processor: balance, position: 0.25}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 30}
      - {processor: compressor, threshold_db: -24.0, ratio: 2.0, attack_ms: 10.0, release_ms: 150.0, makeup_db: 1.0, knee_db: 6.0}
      - {processor: limiter, target_peak_db: -2.0, drive: 0.9, normalize: true}
  adaptive_sections: {mode: composition_master}
