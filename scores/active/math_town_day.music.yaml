schema: ambition.musicir.v3
id: math_town_day
title: Euclid Street
description: >-
  The daytime music of the central town of the Math dimension: the busy hub, mathematicians and
  travellers on the terraces and under the viaduct. A steady gentle groove in A major at 104 BPM with a
  light swing: Rhodes chords, a pizzicato double bass, a marimba ostinato, a soft kick and side stick
  with a shaker, a piano tune, and pizzicato violins that answer the marimba. Music to relax or study to.
  It is one of the four day-cycle cues of the town (morning, day, evening, night). The four share the
  Euclid Street motif: scale degrees 1 5 4 3 | 2 3 5, a premise and its conclusion.
notes:
  - 'Jon, 2026-10-15: the central town gets a day/night cycle, "so music for morning, daytime, evening, and nighttime is a good idea. Let''s build distinct new music for this." This is the daytime cue: "hustle & bustle", music to relax or study to. It is a new composition and does not use the motifs of standing_on_shoulders or shoulders_at_rest.'
  - 'The Euclid Street motif in A: A E D C# | B C# E. Rhythm: a quarter pickup, then quarter quarter half | quarter quarter half. It opens the piano tune (euclid_street, colonnade, rush_hour, closing_argument; in closing_argument in thirds). The marimba answers the tune with the conclusion (B C# E). In the seminar the piano plays it inverted (D G A B | C# B G, over G and A7, a turn to D major). In the recess the marimba plays the premise and the pizzicato violins the conclusion, apart.'
  - 'Form, 64 bars, about 2:28: opening_hours (Rhodes, bass, marimba, shaker; the kit from bar 5), euclid_street (the tune on the piano), market (the marimba calls, the pizzicato violins answer), colonnade (the tune, with a new second half), seminar (the bridge: the motif inverted, held chords, kick and side stick only), rush_hour (the tune, the marimba one octave below it, a walking bass), recess (no kit: the motif in pieces), closing_argument (the motif in thirds and a short tag). The file loops as a whole: bar 65 is bar 1.'
  - 'Drums: a soft kick and a side stick (Naked Drums) and a swung shaker; no hi-hat, no snare, no cymbals. The brief asked for brushes; the brush kit here (Big Rusty) is the one Jon did not like on embedded_theme (2026-10-11), so this cue uses a side stick and a shaker.'
  - 'Register: the highest held piano note is F#5; the only A5 is one short pizzicato note.'
  - 'This score is written by a generator script (exact events, swing 0.58, humanized timing and velocity, seed 2026101502); it is not kept in this repository. Edit the events here directly.'
seed: 2026101502
timebase: {ppq: 960}
meter: 4/4
tempo: 104
key: A major
end: {bar: 65, beat: 1}
form:
  - {id: opening_hours, label: 'Opening hours: the groove', from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, role: loop_component, loopable: true}
  - {id: euclid_street, label: 'Euclid Street: the tune', from: {bar: 9, beat: 1}, to: {bar: 17, beat: 1}, role: loop_component, loopable: true}
  - {id: market, label: 'Market: marimba calls, pizzicato answers', from: {bar: 17, beat: 1}, to: {bar: 25, beat: 1}, role: loop_component, loopable: true}
  - {id: colonnade, label: 'Colonnade: the tune with a new end', from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, role: loop_component, loopable: true}
  - {id: seminar, label: 'Seminar: the motif inverted', from: {bar: 33, beat: 1}, to: {bar: 41, beat: 1}, role: loop_component, loopable: true}
  - {id: rush_hour, label: 'Rush hour: the tune, full', from: {bar: 41, beat: 1}, to: {bar: 49, beat: 1}, role: loop_component, loopable: true}
  - {id: recess, label: 'Recess: the motif in pieces', from: {bar: 49, beat: 1}, to: {bar: 57, beat: 1}, role: loop_component, loopable: true}
  - {id: closing_argument, label: 'Closing argument: the motif in thirds', from: {bar: 57, beat: 1}, to: {bar: 65, beat: 1}, role: loop_component, loopable: true}
render:
  backend: pretty-midi
  sample_rate: 48000
  ogg_quality: 7
  metadata_markers:
    - {bar: 1, id: m1, label: Opening hours}
    - {bar: 9, id: m9, label: Euclid Street}
    - {bar: 17, id: m17, label: Market}
    - {bar: 25, id: m25, label: Colonnade}
    - {bar: 33, id: m33, label: Seminar}
    - {bar: 41, id: m41, label: Rush hour}
    - {bar: 49, id: m49, label: Recess}
    - {bar: 57, id: m57, label: Closing argument}
instruments:
  - name: piano
    group: piano
    program: acoustic_grand_piano
    volume: 100
    pan: 64
    expression: 108
    instrument_backend: {kind: sfz, library_ref: freepats.salamander_grand}
  - name: rhodes
    group: rhodes
    program: electric_piano_1
    volume: 100
    pan: 64
    expression: 104
    instrument_backend: {kind: sfz, library_ref: epiano.rhodes}
  - name: marimba
    group: marimba
    program: marimba
    volume: 100
    pan: 64
    expression: 104
    # Not in the instrument catalog: the VSCO 2 CE marimba.
    instrument_backend: {kind: sfz, sfz_glob: '**/VSCO-2-CE-SFZ/Marimba.sfz', settings: {fold_to_range: false}}
  - name: pizz
    group: pizz
    program: pizzicato_strings
    volume: 100
    pan: 64
    expression: 104
    # Not in the instrument catalog: the VPO first violins, pizzicato.
    instrument_backend: {kind: sfz, sfz_glob: '**/Virtual-Playing-Orchestra3/Strings/1st-violin-SEC-pizzicato.sfz', settings: {fold_to_range: false}}
  - name: bass
    group: bass
    program: acoustic_bass
    volume: 112
    pan: 64
    expression: 114
    instrument_backend: {kind: sfz, library_ref: bass.meatbass_pizz, required: true, settings: {fold_to_range: false}}
  - name: kit
    group: drums
    is_drum: true
    volume: 104
    pan: 64
    expression: 110
    instrument_backend: {kind: sfz, library_ref: drums.naked, settings: {render_timeout_s: 900}}
  - name: shaker
    group: shaker
    program: woodblock
    volume: 100
    pan: 64
    expression: 100
    # Not in the instrument catalog: the VCSL small shaker (keys 66 and 67 are the low fast shakes).
    instrument_backend: {kind: sfz, sfz_glob: '**/VCSL-1.2.2-RC/Idiophones/Struck Idiophones/Shaker, Small.sfz', settings: {fold_to_range: false}}
