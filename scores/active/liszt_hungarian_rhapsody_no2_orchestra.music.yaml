schema: ambition.musicir.v2
id: liszt_hungarian_rhapsody_no2_orchestra
title: Liszt — Hungarian Rhapsody No. 2, S.244/2 — full orchestra
notes: Self-contained orchestral realization using the exact embedded piano performance clock and source dynamics as expressive
  input. Sustained orchestral voices use pedal-informed phrase gates baked into their note durations; pedal-held gaps are
  bridged to the next orchestral attack even when source material is transposed or reassigned between parts. Staccato and
  percussion retain their written attacks/releases. Sparse structural attacks retain selected same-harmony family doublings
  so role reduction does not create abrupt texture cliffs. The texture is reduced into bass, harmony, melody, and structural-color
  roles instead of making every piano note equally prominent.
provenance:
  composer: Franz Liszt
  work: Hungarian Rhapsody No. 2, S.244/2
  composition_status: public domain
  orchestration_reference: historical Liszt/Doppler orchestral arrangement, S.359/4
  render_dependency: self-contained MusicIR only
  performance_source: Bernd Krueger MIDI performance transcription
  performance_source_host: Wikimedia Commons / piano-midi.de
  performance_source_license: CC BY-SA 3.0 DE
  timing_policy: exact embedded source tempo with pedal-informed phrase sustain baked into normal orchestral note gates; pedal-held
    gaps bridge to the next orchestral attack even across transposition/role reassignment, while piano CC64 itself is not
    emitted for bowed/wind instruments
  dynamic_policy: source note-on velocities preserve phrase-level and note-level dynamic contrast; orchestral families apply
    role-specific offsets without flattening the source curve
  source_note_count: 6765
  source_tempo_events: 2847
