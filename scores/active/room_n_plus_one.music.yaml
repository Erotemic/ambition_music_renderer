schema: ambition.musicir.v1
id: room_n_plus_one
title: Room N+1
seed: 202608160937
notes: 'Dedicated Hilbert''s Hotel lobby theme: an elegant, faintly impossible chamber waltz led by the reception-desk
  piano. The desk is the identity of the room; bass, harp, corridor strings, and service bell remain restrained supporting
  architecture. Instead of a rotating parade of guest soloists, one warm clarinet now makes a brief two-note room-call
  once per 12-bar circuit. Those four calls move G -> A -> B -> C, quietly suggesting n -> n+1 without interrupting the
  lobby pulse. The result is intentionally simpler and more architectural: an orderly hotel that can keep making room
  forever, not a chamber showcase. Sampled SFZ instruments are preferred where installed; every retained role keeps a
  portable General MIDI fallback.'
