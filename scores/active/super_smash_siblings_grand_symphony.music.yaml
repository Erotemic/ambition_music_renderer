schema: ambition.musicir.v1
id: super_smash_siblings_grand_symphony
title: The Distance Starts Losing - Grand Symphony
seed: 2026080605
notes: 'A through-composed symphonic power piece for Super Smash Siblings about competence arriving in real time. It begins already in motion and stays exhilarated: a compact leap-and-fall cell keeps reappearing with altered placement, wider intervals, compressed timing, and increasingly fluent orchestration. Harmonic motion deliberately uses modal color, dominant pedals, chromatic upward sequences, and sharp extensions instead of a conventional minor-to-major victory turn. The last twenty bars reveal a much larger orchestral ceiling without a quiet pre-climax valley. Full Sonatina/VCSL orchestra plus sampled harp, with General MIDI fallbacks.'
