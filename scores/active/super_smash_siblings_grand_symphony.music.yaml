schema: ambition.musicir.v1
id: super_smash_siblings_grand_symphony
title: The Distance Starts Losing - Grand Symphony
seed: 2026080607
notes: 'Major melodic and orchestration rewrite. The piece stays continuously energized, but the lead writing now
  breathes: long held tones, rests, pickups, and singable D-minor/Dorian phrases sit over a disciplined rhythmic
  engine. Fast notes are primarily accompaniment and are reserved for the late orchestral surge rather than used
  as constant melodic flourish. The single listener-approved Em horn blast near 0:18.95 is preserved as a standalone
  gear-change landmark. Experimental harmony is otherwise rare, with the Eb-over-D ceiling break near 1:30 retained
  as the other exceptional color.'
