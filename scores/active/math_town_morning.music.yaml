schema: ambition.musicir.v3
id: math_town_morning
title: Axioms at Dawn
description: >-
  The morning music of the central town of the Math dimension: the sun comes up over the limestone
  terraces, the domes and the viaduct, and the town wakes. Fingerpicked acoustic guitar and harp in
  D major at 92 BPM, a clarinet and a flute for the tune, a few celesta notes, a pizzicato double bass,
  a soft string pad from the second half, and a very quiet shaker in the two brightest sections. It is
  one of the four day-cycle cues of the town (morning, day, evening, night). The four share the Euclid
  Street motif: scale degrees 1 5 4 3 | 2 3 5, a premise and its conclusion.
notes:
  - 'Jon, 2026-10-15: the central town gets a day/night cycle, "so music for morning, daytime, evening, and nighttime is a good idea. Let''s build distinct new music for this." This is the morning cue. It is a new composition and does not use the motifs of standing_on_shoulders or shoulders_at_rest.'
  - 'The Euclid Street motif in D: D A G F# | E F# A. Rhythm: a quarter pickup, then quarter quarter half | quarter quarter half. Axiom (bar 8 beat 4): the clarinet states it low, over D and Gmaj9. Proof: the clarinet states it in B minor (B F# E D | C# D F#) and in E minor (E B A G | F# G B), the flute answers between. Corollary: the flute states it one octave up, the clarinet a tenth and a sixth below. Qed: the clarinet states it low one last time and the flute echoes the conclusion (E F# A).'
  - 'Form, 56 bars, about 2:26: first_light (guitar alone, then harp and bass), axiom (the motif and the tune on the clarinet), lemma (the flute answers; held guide tones on the clarinet; the string pad comes in), proof (the motif in B minor and E minor; the harp plays the eighths and the guitar plays quarters), corollary (the tune one octave up on the flute; the shaker comes in), sunrise (a new song on the clarinet over G; the flute joins a third above), qed (the motif one last time; the texture thins to guitar and harp for the loop). The file loops as a whole: bar 57 is bar 1.'
  - 'Register: the highest held lead note is A5 (twice, flute, as a half note). The celesta plays ten short notes in all. No drums, no hi-hat.'
  - 'This score is written by a generator script (exact events, humanized timing and velocity, seed 2026101501); it is not kept in this repository. Edit the events here directly.'
