form:
  - {id: first_light, label: 'First light: guitar alone, then harp', from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, role: loop_component, loopable: true}
  - {id: axiom, label: 'Axiom: the motif and the tune on the clarinet', from: {bar: 9, beat: 1}, to: {bar: 17, beat: 1}, role: loop_component, loopable: true}
  - {id: lemma, label: 'Lemma: the flute answers', from: {bar: 17, beat: 1}, to: {bar: 25, beat: 1}, role: loop_component, loopable: true}
  - {id: proof, label: 'Proof: the motif in B minor and E minor', from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, role: loop_component, loopable: true}
  - {id: corollary, label: 'Corollary: the tune one octave up on the flute', from: {bar: 33, beat: 1}, to: {bar: 41, beat: 1}, role: loop_component, loopable: true}
  - {id: sunrise, label: 'Sunrise: a new song over G', from: {bar: 41, beat: 1}, to: {bar: 49, beat: 1}, role: loop_component, loopable: true}
  - {id: qed, label: 'Qed: the motif one last time', from: {bar: 49, beat: 1}, to: {bar: 57, beat: 1}, role: loop_component, loopable: true}
