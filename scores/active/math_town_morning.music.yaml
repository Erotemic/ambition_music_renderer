processing:
  groups:
    flute:
      chain:
        - {processor: highpass, cutoff_hz: 200}
        - {processor: band_gain, low_hz: 2500, high_hz: 5500, gain_db: -3.0}
        - {processor: lowpass, cutoff_hz: 6500}
        - {processor: reverb, wet: 0.22, decay_seconds: 1.7, damping_hz: 4000}
        - {processor: gain, gain_db: 7.0}
        - {processor: balance, position: 0.2}
    clarinet:
      chain:
        - {processor: highpass, cutoff_hz: 130}
        - {processor: band_gain, low_hz: 2500, high_hz: 5000, gain_db: -2.5}
        - {processor: lowpass, cutoff_hz: 7000}
        - {processor: reverb, wet: 0.2, decay_seconds: 1.6, damping_hz: 4000}
        - {processor: gain, gain_db: 3.0}
        - {processor: balance, position: -0.15}
    guitar:
      chain:
        - {processor: highpass, cutoff_hz: 100}
        - {processor: band_gain, low_hz: 3000, high_hz: 6500, gain_db: -4.0}
        - {processor: lowpass, cutoff_hz: 4800}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 5300, q: 4.0, db: -8.0}
            - {type: peak, hz: 6150, q: 4.0, db: -12.0}
            - {type: peak, hz: 6950, q: 4.0, db: -10.0}
        - {processor: reverb, wet: 0.16, decay_seconds: 1.3, damping_hz: 4200}
        - {processor: gain, gain_db: 0.0}
        - {processor: balance, position: -0.6}
    harp:
      chain:
        - {processor: highpass, cutoff_hz: 90}
        - {processor: lowpass, cutoff_hz: 7000}
        - {processor: reverb, wet: 0.24, decay_seconds: 1.8, damping_hz: 4000}
        - {processor: gain, gain_db: 14.0}
        - {processor: balance, position: 0.55}
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 38}
        - {processor: compressor, threshold_db: -28.0, ratio: 2.5, attack_ms: 20.0, release_ms: 160.0, makeup_db: 2.0}
        - {processor: lowpass, cutoff_hz: 2500}
        - {processor: gain, gain_db: -2.0}
    strings:
      chain:
        - {processor: highpass, cutoff_hz: 140}
        - {processor: lowpass, cutoff_hz: 5500}
        - {processor: reverb, wet: 0.3, decay_seconds: 2.0, damping_hz: 3500}
        - {processor: gain, gain_db: -3.0}
    celesta:
      chain:
        - {processor: highpass, cutoff_hz: 300}
        - {processor: band_gain, low_hz: 2500, high_hz: 6000, gain_db: -4.0}
        - {processor: lowpass, cutoff_hz: 6000}
        - {processor: reverb, wet: 0.3, decay_seconds: 2.0, damping_hz: 3800}
        - {processor: gain, gain_db: 5.0}
        - {processor: balance, position: 0.3}
    shaker:
      chain:
        - {processor: highpass, cutoff_hz: 500}
        - {processor: lowpass, cutoff_hz: 5000}
        - {processor: reverb, wet: 0.12, decay_seconds: 0.8, damping_hz: 3500}
        - {processor: gain, gain_db: 16.0}
        - {processor: balance, position: 0.3}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 30}
      - {processor: compressor, threshold_db: -18.0, ratio: 1.6, attack_ms: 30.0, release_ms: 160.0, makeup_db: 1.0, knee_db: 6.0}
      - {processor: limiter, target_peak_db: -2.0, drive: 0.9, normalize: true}
  adaptive_sections: {mode: composition_master}
