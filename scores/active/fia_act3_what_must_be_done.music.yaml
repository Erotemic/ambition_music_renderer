schema: ambition.musicir.v1
id: fia_act3_what_must_be_done
title: "Fia III \u2014 What Must Be Done"
seed: 2026081603
notes: 'Act III Fia climax. This is not a loud remix of Benchlight. The old trust melody has been metabolized into
  a driving inverted interval skeleton: the rhythm and contour ancestry remain, but the tune is mostly gone. Low
  strings and brass turn the relationship''s once-gentle call-and-answer into a machine of necessity, while percussion
  makes every cadence feel like a decision that cannot be recalled. Only once, late in the loop, a celesta and solo
  violin whisper the first three notes of the Act I major phrase. The orchestra does not stop for the memory. The
  emotional target is tragic climax rather than cartoon villainy: Fia still believes the urgency is real, which
  is precisely why the accumulated intimacy has become dangerous.'
