schema: ambition.musicir.v1
id: fia_act1_candidate_a_grease_pencil
title: "Fia I Candidate A — Grease Pencil"
seed: 202608161201
notes: >-
  Act I candidate A: clean-electric-guitar chamber math-rock. This deliberately
  abandons the piano/woodwind storybook vocabulary and the synth-pop vocabulary
  at the same time. Fia's identity is a bright, hand-played electric-guitar hook
  in 5/4: alert, competent, a little asymmetrical, and fun to live with for a
  long gameplay loop. A quiet cello cushion keeps some of the intimacy of the
  first trilogy while pizz-style bass, side-stick percussion, and a tiny square
  servo pulse locate the cue at a mechanic's bench. Foreshadowing is not a
  borrowed-minor chord: once, late in the loop, the servo echoes the guitar's E
  as F natural, like a calibration return that is one semitone wrong. Nothing
  reacts to it and it never repeats.
tempo: {bpm: 112}
meter: {beats_per_bar: 5, beat_unit: 4}
constraints: {voice_leading: minimize_motion, no_clusters: true}
render:
  sample_rate: 48000
  ogg_quality: 6
  backend: pretty-midi
  sfizz:
    library_roots: [/data/audio-tools/sfz, /data/audio-tools]
    fallback_backend: pretty-midi
postprocess:
  gain_db: -0.9
  highpass_hz: 31
  lowpass_hz: 13200
  reverb_wet: 0.07
  reverb_decay_seconds: 1.05
  reverb_damping_hz: 6200
  stereo_width: 0.13
  compressor_threshold_db: -18
  compressor_ratio: 2.1
  compressor_attack_ms: 14
  compressor_release_ms: 105
  limiter_drive: 0.90
  normalize: true
  target_peak_db: -3.4
stem_postprocess:
  highpass_hz: 29
  reverb_wet: 0.008
  reverb_decay_seconds: 0.42
  stereo_width: 0.03
  normalize: false
  target_peak_db: -4.0
group_postprocess:
  lead: {gain_db: 0.4, highpass_hz: 95, lowpass_hz: 12500, reverb_wet: 0.035}
  answer: {gain_db: -1.0, highpass_hz: 110, lowpass_hz: 11500, reverb_wet: 0.045}
  bass: {gain_db: -1.2, highpass_hz: 32, lowpass_hz: 5200}
  chamber: {gain_db: -2.0, highpass_hz: 80, lowpass_hz: 9200, reverb_wet: 0.07}
  machine: {gain_db: -3.2, highpass_hz: 180, lowpass_hz: 9400}
  percussion: {gain_db: -3.6, highpass_hz: 38, lowpass_hz: 12000, transient_tame: 0.03}
instruments:
  - name: grease_guitar
    group: lead
    program: clean_guitar
    volume: 96
    pan: 55
    expression: 108
    instrument_backend:
      kind: sfz
      library_ref: green twang
      prefer: [green, twang]
      optional: true
      fallback_backend: pretty-midi
  - name: answer_guitar
    group: answer
    program: steel_guitar
    volume: 68
    pan: 78
    expression: 88
    instrument_backend:
      kind: sfz
      library_ref: guitar.hollowbody
      prefer: [03 combo keyswitch, combo keyswitch, blackandgreenguitars]
      optional: true
      fallback_backend: pretty-midi
  - name: bench_bass
    group: bass
    program: acoustic_bass
    volume: 82
    pan: 60
    expression: 92
    instrument_backend:
      kind: sfz
      library_ref: bass.meatbass_pizz
      prefer: [pizz, bass]
      optional: true
      fallback_backend: pretty-midi
  - name: low_cello
    group: chamber
    program: cello
    volume: 54
    pan: 38
    expression: 74
    instrument_backend:
      kind: sfz
      library_ref: strings.celli
      prefer: [cello, sustain]
      optional: true
      fallback_backend: pretty-midi
  - {name: servo_square, group: machine, program: lead_square, volume: 31, pan: 82, expression: 50, modulation: 1}
  - {name: kit, group: percussion, is_drum: true, volume: 72, pan: 64, expression: 82}
motifs:
  - id: grease_hook
    root: E4
    intervals: [0, 7, 4, 9, 7, 4, 2, 11, 7, 4]
    rhythm: [0.5, 0.5, 0.75, 0.75, 1.0, 0.5, 0.5, 1.5, 1.0, 3.0]
    velocities: [0.78, 0.66, 0.82, 0.72, 0.88, 0.66, 0.62, 0.84, 0.70, 0.76]
  - id: grease_reply
    root: B3
    intervals: [0, 5, 7, 12, 10, 7, 5, 2]
    rhythm: [1.0, 0.5, 0.5, 1.5, 0.5, 1.0, 2.0, 3.0]
    velocities: [0.42, 0.48, 0.52, 0.64, 0.52, 0.48, 0.44, 0.34]
  - id: bad_return
    root: E5
    intervals: [1]
    rhythm: [0.18]
    velocities: [1.0]
layer_templates:
  lead_hook:
    kind: motif
    instrument: grease_guitar
    motif: grease_hook
    velocity: 74
    articulation: normal
    gate: 0.82
    humanize_ms: 7
    humanize_velocity_pct: 6
  reply_hook:
    kind: motif
    instrument: answer_guitar
    motif: grease_reply
    velocity: 48
    articulation: tenuto
    gate: 0.80
    humanize_ms: 9
    humanize_velocity_pct: 7
  bass_walk:
    kind: bassline
    instrument: bench_bass
    octave: 2
    velocity: 58
    articulation: staccato
    humanize_ms: 7
    humanize_velocity_pct: 7
    pattern:
      - [0, 0.0, 0.42]
      - [7, 1.25, 0.24]
      - [12, 2.5, 0.38]
      - [7, 3.5, 0.22]
      - [7, 4.25, 0.34]
  cello_air:
    kind: pad_chords
    instrument: low_cello
    octave: 3
    every_bars: 2
    duration_beats: 9.2
    velocity: 23
    articulation: tenuto
    voicing: open
    humanize_ms: 16
    humanize_velocity_pct: 4
  servo_meter:
    kind: ostinato
    instrument: servo_square
    octave: 4
    intervals: [0, 7, 12, 7]
    rhythm: [0.5, 0.5, 1.0, 3.0]
    velocity: 25
    articulation: staccato
    humanize_ms: 2
    humanize_velocity_pct: 2
  dry_bench_kit:
    kind: drums
    instrument: kit
    humanize_ms: 5
    humanize_velocity_pct: 7
    events:
      - {drum: kick, beats: [0.0, 3.0], velocity: 48, duration_beats: 0.06}
      - {drum: side_stick, beats: [2.0], velocity: 38, duration_beats: 0.04}
      - {drum: closed_hat, beats: [1.0, 4.0], velocity: 20, duration_beats: 0.03}
playback:
  mode: section_stem_matrix
  loop_components: [fia_candidate_a_loop]
  exit_policy:
    request_outro: next_valid_exit_bar
    fade_aggressive_stems_beats: 5
    bridge_stems: [bass, chamber, machine]
    fade_stems: [lead, answer, percussion]
state_map:
  default:
    section: fia_candidate_a_loop
    stems: {lead: 0.92, answer: 0.58, bass: 0.66, chamber: 0.42, machine: 0.24, percussion: 0.46}
sections:
  - id: fia_candidate_a_loop
    kind: loop_component
    label: Fia Act I candidate A - clean guitar in five
    bars: 24
    intensity: 0.50
    density: 0.52
    loopable: true
    valid_exit_local_bars: [4, 8, 12, 16, 20, 24]
    harmony:
      [Emaj7, Emaj7, Aadd9, Aadd9,
       C#m7, C#m7, Bsus4, Bsus4,
       Emaj7, Emaj7, Aadd9, Aadd9,
       C#m7, C#m7, Bsus4, Bsus4,
       Emaj7, Emaj7, Aadd9, Aadd9,
       C#m7, C#m7, Emaj7, Emaj7]
    layers:
      - bass_walk
      - cello_air
      - servo_meter
      - dry_bench_kit
      - {template: lead_hook, starts: [[0, 0.0], [4, 0.0], [8, 0.0], [12, 0.0], [16, 0.0], [20, 0.0]]}
      - {template: reply_hook, starts: [[2, 0.0], [6, 0.0], [10, 0.0], [14, 0.0], [18, 0.0], [22, 0.0]]}
      - kind: motif
        instrument: servo_square
        motif: bad_return
        root: E5
        velocity: 38
        articulation: staccato
        gate: 0.35
        starts: [[18, 4.42]]
