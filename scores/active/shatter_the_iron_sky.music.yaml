  sections:
  - id: combat
    form:
    - iron_gate
    - shattered_orders
    - war_machine
    - counterattack
    - the_false_triumph
    - breaking_the_columns
    - no_throne
    - iron_sky_falls
    loop: true
notes:
- 'Iron Heel revision: preserve the 168 BPM / 64-bar combat loop and sampled guitar, choir and bass inventory.'
- E5 root-fifth-octave downstrokes and palm-muted 16th E pedal are the anchor; F5 b2 and Bb5 b5 are power-chord-level shifts, not
  random sour solo notes.
- Non-Locrian B-natural power chords are intentional metal tonic anchors; B7(b9) turnaround intentionally introduces D-sharp.
- Every pitch bend from FSBS lead clips is removed. Replaced with explicit-register guitar phrases and articulated solo runs.
- Tight doubled guitar attacks (~3.4 ms offset), bass root accents and kick chugs sync; half-time bars keep room for VPO choir.
- Pre-roll repeats the final eight bars exactly, including the note events; strict ticks/960 compiler validation required.
