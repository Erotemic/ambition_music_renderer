schema: ambition.musicir.v3
id: shatter_the_iron_sky
title: Shatter the Iron Sky
description: 'Steel Oath: a riff-first, tightly articulated 168 BPM E-minor metal battle theme. Its serrated chromatic
  E-pedal riff gives way to a forward gallop, an ominous choral response, a half-time ritual, a developed virtuosic
  electric-guitar solo, and a reprise with harmonized guitar lines. F and Bb are rare threats; D# colors the B-major
  dominant. Eight-bar preroll is exactly the concluding eight bars.'
seed: 17001987
timebase:
  ppq: 960
meter: 4/4
tempo: 168
key: E minor
end:
  bar: 73
  beat: 1
form:
- id: preroll
  from:
    bar: 1
    beat: 1
  to:
    bar: 9
    beat: 1
  energy: 0.95
  density: 0.86
  role: Exact ending reprise as synth FX preroll; resolves at the E downbeat after the seam.
- id: iron_gate
  from:
    bar: 9
    beat: 1
  to:
    bar: 17
    beat: 1
  energy: 0.94
  density: 0.76
  role: Opening anvil riff, fully guitar-driven, before introducing the melodic threat in bars five to eight.
- id: shattered_orders
  from:
    bar: 17
    beat: 1
  to:
    bar: 25
    beat: 1
  energy: 0.92
  density: 0.74
  role: Fast galloping second riff, with a descending lead phrase and a chromatic turnaround.
- id: war_machine
  from:
    bar: 25
    beat: 1
  to:
    bar: 33
    beat: 1
  energy: 0.97
  density: 0.85
  role: 'Cathedral chorus: choral answers, powerful sustained chords and a restrained guitar statement.'
- id: counterattack
  from:
    bar: 33
    beat: 1
  to:
    bar: 41
    beat: 1
  energy: 1.0
  density: 0.94
  role: Tight thrash riff with short lead acceleration and an aggressive snare backbeat.
- id: the_false_triumph
  from:
    bar: 41
    beat: 1
  to:
    bar: 49
    beat: 1
  energy: 0.78
  density: 0.51
  role: 'Half-time ritual: ominous open spaces, lower strings, choir, and long guitar bends.'
- id: breaking_the_columns
  from:
    bar: 49
    beat: 1
  to:
    bar: 57
    beat: 1
  energy: 1.0
  density: 0.94
  role: Eight-bar developed virtuosic guitar solo, harmonics, E harmonic-minor arpeggios, and double kick.
- id: no_throne
  from:
    bar: 57
    beat: 1
  to:
    bar: 65
    beat: 1
  energy: 0.98
  density: 0.82
  role: Main riff and theme return, raised register with a harmonized counter-guitar.
- id: iron_sky_falls
  from:
    bar: 65
    beat: 1
  to:
    bar: 73
    beat: 1
  energy: 1.0
  density: 0.89
  role: Final acceleration into an unresolved B7(b9) dominant, leading into the E opening.
