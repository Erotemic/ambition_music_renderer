notes:
- 'Evil Leitmotif / Trio revision (October 18, 2026): a recurrent E4-F4-E4 / B4-G4 chromatic signature, brief dissonances
  resolved onto stable chord tones.'
- At full-preview 0:02-0:03, replaced the old B4-to-F5 tritone leap into the F5 riff with a connected lower F4 
  statement; the closing 8 bars are exactly the preroll.
- Reintroduced Black And Green Guitar as a synced supportive harmony voice with controlled mid-forward JCM800 sound (not
  an independent alternating solo).
- Growlybass Dirty now joins principal guitar attacks as a midrange third voice, with +3.4 dB gain; the original Black 
  And Blue foundation gets +0.7 dB.
- 'Main FreePats Distorted #1 soloist is lowered 0.7 dB for trio headroom; VPO choirs, rhythm guitars, drums and orchestral
  parts retain every authored event.'
- Ritual long bends and the central technical guitar solo retain their original lead writing; no new samples or 
  asset-install rules required.
