# Shatter the Iron Sky. 64 playable E Locrian bars at 168 BPM, plus 8 render-only primer bars.
# For rendering, the normal Ambition workstation provides the stable SFZ refs
# under /data/audio-tools, and the LV2 Guitarix amps used in other active cues.
# Playback combat = bars 9-72. Bars 1-8 mirror bars 65-72 to prime FX history.
# All six layers are active in the compositional full mix. Removing a playback
# layer is a game intensity choice; never a different harmony/timeline.
# Scale: E F G A Bb C D. The E-F semitone and E-Bb tritone are the main motifs.
# Two guitars intentionally do not play ordinary E/B power chords (B is outside
# E Locrian). Playback stems carry pre-master gains; the full mix is mastered.
