      - processor: compressor
        threshold_db: -21.0
        ratio: 2.1
        attack_ms: 8.0
        release_ms: 90.0
      - processor: balance
        position: 0.8
    lead_guitar:
      # FreePats FSBS #1 is ALREADY distorted/amped in the source recordings.
      # Audition its own tone without cascading another TS9/JCM800 preamp.
      # The second lead remains Black And Green with its prior high-gain chain.
      chain:
      - {processor: highpass, cutoff_hz: 80}
      - processor: parametric_eq
        bands:
        - {type: peak, hz: 275, q: 0.8, db: -1.4}
        - {type: peak, hz: 830, q: 0.9, db: 1.8}
        - {type: peak, hz: 1850, q: 1.0, db: 1.4}
        - {type: peak, hz: 5200, q: 1.3, db: -1.6}
      - {processor: lowpass, cutoff_hz: 9000}
      - {processor: compressor, threshold_db: -22.0, ratio: 2.0, attack_ms: 16.0, release_ms: 135.0, makeup_db: 1.8}
      - processor: pedalboard
        effects:
        - {effect: delay, delay_ms: 300, feedback: 0.14, mix: 0.075}
      - {processor: balance, position: -0.2}
      - {processor: gain, gain_db: 0.5}
    growly_counterbass:
      chain:
      # Melody bass occupies E2-F4 rather than the sub-bass octave of the
      # Black And Blue rhythmic bass. Keep the lows out of the master bus.
      - {processor: highpass, cutoff_hz: 84}
      - processor: parametric_eq
        bands:
        - {type: peak, hz: 180, q: 0.85, db: -2.0}
        - {type: peak, hz: 460, q: 0.90, db: 1.2}
        - {type: peak, hz: 1050, q: 0.80, db: 2.2}
        - {type: peak, hz: 2650, q: 1.0, db: -1.0}
      # Mild controlled dirt: Growlybass recordings are direct bass samples,
      # already different from the fully distorted FreePats electric guitar.
      - processor: pedalboard
        effects:
        - {effect: distortion, drive_db: 3.7, wet_mix: 0.30}
      - {processor: compressor, threshold_db: -24.0, ratio: 2.6, attack_ms: 13.0, release_ms: 112.0, makeup_db: 1.8}
