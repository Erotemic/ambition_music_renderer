playback:
  layers:
    bed:
    - rhythm_left
    - rhythm_right
    - bass
    - kit_core
    hook:
    - lead_guitar
    percussion:
    - kit_ornaments
    - celli
    war_machine:
    - trombones
    - timpani
    dread:
    - choir_male
    - choir_female
    - cyborg
    counterpoint:
    - counter_guitar
    - viola_lead
  sections:
  - id: combat
    form:
    - iron_gate
    - shattered_orders
    - war_machine
    - counterattack
    - the_false_triumph
    - breaking_the_columns
    - no_throne
    - iron_sky_falls
    loop: true
notes:
- 'Steel Oath, October 18, 2026: rebuilt heavy-metal arrangement from the audio bundle rather than continuously patching
  the melodic-duel versions.'
- 168 BPM. Original four-note threat signature E-G-F#-E (with a B descent), answered by a chromatic F-E figure. Occasional
  Bb and D# color the dominant rather than destabilizing every bar.
- 'Rhythm guitars and bass/drums carry the song without additional layers: anvil, gallop, cathedral, thrash, doom,
  solo bed, harmonized reprise and coda.'
- Extended lead-guitar solo is in breaking_the_columns, with diatonic runs, E harmonic-minor arpeggios, long bends
  and contrasted sustained notes; no violin versus guitar duel.
- Emilyguitar has a 12-semitone pitch-bend range; large deliberate MIDI pitch-bend values (roughly 1000-1600 raw units)
  produce audible multi-semitone wails with continuous vibrato on long solo notes.
- The choir is reserved for cathedral, ritual, reprise and coda, with chord-aligned low and high lines. Viola remains
  a sparse lower spectral shadow.
- Keep loop/preroll complete note/controller identity for the final 8-bar phrase. Render with all layers for audition;
  in game bed is the band alone.
