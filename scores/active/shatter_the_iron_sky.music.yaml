# Shatter the Iron Sky - doom-wail lead revision.
# 64-bar E minor battle metal; Locrian b2 and b5 interruptions.
# Emilyguitar single-note lead, controlled bends, long sustain, two shred solos.
# Male/female choir, underlying riffs, and intensity-layer membership unchanged.
# Render-only bars 1-8 exactly mirror final combat bars 65-72.
schema: ambition.musicir.v3
id: shatter_the_iron_sky
title: Shatter the Iron Sky (Iron Cathedral)
description: Doom-rooted E minor battle metal with F-natural and B-flat threat motifs, substantial electric rhythm
  guitars, low blues-influenced wailing Emilyguitar lead, and virtuoso runs erupting between held bends. Sustained
  ritual choirs remain central. Six individually mixable intensity layers over the complete 64-bar combat loop.
