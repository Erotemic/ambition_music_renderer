id: shatter_the_iron_sky
title: Shatter the Iron Sky (E Minor Recomposition)
description: Guitar-driven E-minor heavy-metal battle loop. Strong E5 power-chord foundation, syncopated twin electric-guitar
  rhythm, kick/snare groove, and restrained F-natural/B-flat Locrian danger figure leading back to B/E. Eight-bar render-only
  preroll duplicates the last eight playable bars.
