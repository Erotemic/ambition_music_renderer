notes:
- 'Melodic reset: none of the former guitar, viola, or counter-guitar note events or pitch bends is reused.
  The main theme is now E-D-G-F#-E, with a second phrase B-A-G-E. The b2 (F) and tritone (Bb) are harmonic
  threats on their supporting power chords.'
- The guitar states a coherent eight-bar sentence and returns to it with variations. The choir owns the spacious
  cathedral section. The ritual has almost no subdivision; the two assaults reserve sixteenths for two climactic
  passages. The ending approaches the opening via D# to E.
- The viola is a sparse lower-register counterweight, not a distorted soloist. The counter guitar delivers
  brief, infrequent answers. Performance and synthesis should be judged after a workstation render.
- The staccato cello now plays short chord-root accents aligned with the riff instead of an independently shifting
  low ostinato that introduced unintended F/E clashes.
- The original choir entrances and durations are intact, but its pitch lines have been reharmonized to avoid
  sustained F5/E and Bb3/E clashes on recurring Em bars.
