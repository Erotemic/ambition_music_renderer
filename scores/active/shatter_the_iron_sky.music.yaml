# Shatter the Iron Sky - Iron Cathedral.
# E minor metal: F-natural b2 and B-flat b5 threat gestures.
# Single-voice Black And Green twang leads over staccato Black And Green rhythms.
# Male/female choir remains the dramatic foil to the lead.
# Bars 1-8 repeat bars 65-72 for render-only preroll.
schema: ambition.musicir.v3
id: shatter_the_iron_sky
title: Shatter the Iron Sky (Iron Cathedral)
description: Industrial heavy-metal combat piece with twin staccato rhythm guitars, a focused picked guitar lead,
  low-E pedal riffs, F-natural and B-flat threat figures, and an unresolved B7(b9) turnaround. Male/female choir drones
  remain central to the ritual and war-machine phrases, with call-and-response lead rests. Full arrangement separates
  into six independently subtractive combat layers.
