# Shatter the Iron Sky - E-minor metal recomposition.
# E natural minor is the harmonic center: E F# G A B C D.
# Brief E-F-Bb-B tension gestures borrow the b2 and b5 from E Locrian.
# Guitar bed = two sampled electric Shinyguitars, Black And Blue bass, Big Rusty Drums.
# 64 playable bars (9-72), eight copied preroll bars (1-8) for FX continuity.
# Six independent intensity layers; full arrangement is the composition authority.
