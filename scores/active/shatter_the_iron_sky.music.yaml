        binary: lv2apply
        channel_mode: dual_mono
        wet_mix: 0.87
        params: {fslider0_: -4.0, fslider1_: 690.0, fslider2_: 0.76, BYPASS: 0.0}
      - processor: lv2
        plugin_uri: http://guitarix.sourceforge.net/plugins/gx_jcm800pre_st#_jcm800pre_st
        binary: lv2apply
        wet_mix: 0.90
        params: {P6v: 0.80, Middle: 0.73, Bass: 0.57, Treble: 0.60, WET_DRY: 90.0, GAIN: -2.0}
      - processor: pedalboard
        effects:
        - {effect: distortion, drive_db: 5.5, wet_mix: 0.55}
      - {processor: highpass, cutoff_hz: 91}
      - processor: parametric_eq
        bands:
        - {type: peak, hz: 320, q: 0.85, db: 0.7}
        - {type: peak, hz: 820, q: 0.85, db: 2.2}
