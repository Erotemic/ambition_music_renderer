notes:
- 'Twin guitar lead, October 18, 2026: recompose melody against the exact 72-bar chord map. No out-of-chord long solo
  notes except intentional B7(b9) approach tones.'
- Lead 1 (Emilyguitar) states a reusable three-tone threat motif. Lead 2 (Black And Green keyswitch) answers on alternating
  phrases and harmonizes hand-picked chord tones in the reprise/solo.
- 'Move counter_guitar to the hook playback layer with lead_guitar: both guitar soloists must be present in the same
  game intensity state.'
- Rhythm guitars, bass, drums, choir and orchestral pitches are preserved; only small lead-space EQ changes on rhythm
  guitars.
- Darker tonality comes from chord-specific melody, delayed resolutions and short F/Bb/B7(b9) tension—not sustained F
  against E-minor pads.
- The opening four bars are rhythm-only; the coda resolves B7 into the first combat E downbeat. Preroll is a deep copy
  of the last eight bars, including lead pitch bends.
