schema: ambition.musicir.v3
id: shatter_the_iron_sky
title: Shatter the Iron Sky
description: A 104-bar (2:28.571 at 168 BPM) cinematic evil thrash-metal combat loop with lower-register FSBS melodic
  hook and elevated eight-bar shred solo. Dedicated 8-bar intro and outro can be spliced at the loop downbeat. E/F/B-flat
  power chords, double-kick, Growlybass, dark choir.
seed: 17001987
timebase:
  ppq: 960
meter: 4/4
tempo: 168
key: E minor
end:
  bar: 121
  beat: 1
form:
- id: intro
  from:
    bar: 1
    beat: 1
  to:
    bar: 9
    beat: 1
  energy: 0.34
  density: 0.32
  role: 'One-shot dark herald: distant choir and E-pedal emerge, then precisely match the combat turnaround.'
  stem_mix_db:
    trombones: 1.0
    timpani: 0.0
- id: iron_gate
  from:
    bar: 9
    beat: 1
  to:
    bar: 17
    beat: 1
  energy: 0.94
  density: 0.76
  role: Evil enters with its anvil riff; the chromatic E-F-E guitar signature arrives after two bars.
  stem_mix_db:
    counter_guitar: 1.0
- id: shattered_orders
  from:
    bar: 17
    beat: 1
  to:
    bar: 25
    beat: 1
  energy: 0.92
  density: 0.74
  role: The dictator's signature becomes a galloping metal march, harmonized in two guitars over driving bass.
  stem_mix_db:
    counter_guitar: 3.0
- id: war_machine
  from:
    bar: 25
    beat: 1
  to:
    bar: 33
    beat: 1
  energy: 0.97
  density: 0.85
  role: 'Imperious cathedral proclamation: sustained threats, synchronized guitar harmonies, and the VPO choir.'
  stem_mix_db:
    trombones: 5.6
    timpani: 4.2
    counter_guitar: 1.6
- id: black_iron_procession
  from:
    bar: 33
    beat: 1
  to:
    bar: 41
    beat: 1
  energy: 0.9
  density: 0.78
  role: 'New low-register villain procession: staccato power-chord decrees, chug answers, and spaced choir strikes.'
  stem_mix_db:
    trombones: 5.0
    timpani: 3.8
    counter_guitar: 3.0
- id: counterattack
  from:
    bar: 41
    beat: 1
  to:
    bar: 49
    beat: 1
  energy: 1.0
  density: 0.94
  role: The emblem turns into fast, oppressive thrash rhythms with tight triple-voice accents.
  stem_mix_db:
    trombones: 5.5
    timpani: 4.2
    counter_guitar: 3.2
- id: serpent_circuit
  from:
    bar: 49
    beat: 1
  to:
    bar: 57
    beat: 1
  energy: 1.0
  density: 0.96
  role: New tense sixteenth-note E/F/B-flat labyrinth; syncopated stops give double-kick and low hook room.
  stem_mix_db:
    counter_guitar: 2.5
- id: the_false_triumph
  from:
    bar: 57
    beat: 1
  to:
    bar: 65
    beat: 1
  energy: 0.78
  density: 0.51
  role: 'Not false triumph: evil sits enthroned in half-time, choir and wailing guitar almost motionless.'
  stem_mix_db:
    timpani: 3.0
    counter_guitar: 0.7
- id: cathedral_of_ash
  from:
    bar: 65
    beat: 1
  to:
    bar: 73
    beat: 1
  energy: 0.85
  density: 0.58
  role: 'New half-time black mass: giant E/B-flat power chords, sustained choir, then marching acceleration.'
  stem_mix_db:
    trombones: 5.2
    timpani: 4.2
    counter_guitar: 0.7
- id: breaking_the_columns
  from:
    bar: 73
    beat: 1
  to:
    bar: 81
    beat: 1
  energy: 1.0
  density: 0.94
  role: Evil exults in a controlled shred solo; twin guitar doubles only accents while upper bass locks the harmony.
  stem_mix_db:
    trombones: 5.6
    timpani: 4.2
    counter_guitar: 0.8
    lead_guitar: 0.8
- id: iron_crown_ascent
  from:
    bar: 81
    beat: 1
  to:
    bar: 89
    beat: 1
  energy: 0.93
  density: 0.82
  role: 'New post-shred lower-octave answer: the ruler speaks again over locked bass, double-kick and galloping
    guitar.'
  stem_mix_db:
    counter_guitar: 2.5
- id: no_throne
  from:
    bar: 89
    beat: 1
  to:
    bar: 97
    beat: 1
  energy: 0.98
  density: 0.82
  role: 'Full proclamation: the E-F-E motif returns above the relentless riff, bigger than before.'
  stem_mix_db:
    trombones: 5.4
    timpani: 4.2
    counter_guitar: 3.3
- id: final_decree
  from:
    bar: 97
    beat: 1
  to:
    bar: 105
    beat: 1
  energy: 0.99
  density: 0.94
  role: 'New final escalation: chromatic Locrian power chords, the five-note evil hook, and choir-brass punctuation.'
  stem_mix_db:
    trombones: 5.6
    timpani: 4.2
    counter_guitar: 3.3
- id: iron_sky_falls
  from:
    bar: 105
    beat: 1
  to:
    bar: 113
    beat: 1
  energy: 1.0
  density: 0.89
  role: Loop turnaround on B7(b9), resolving to the E power-chord downbeat of iron_gate.
  stem_mix_db:
    trombones: 5.6
    timpani: 4.2
    counter_guitar: 2.2
- id: outro
  from:
    bar: 113
    beat: 1
  to:
    bar: 121
    beat: 1
  energy: 0.75
  density: 0.6
  role: 'One-shot exit from the loop end: E/F/B-flat recall, huge E5 stop and resonant decay.'
  stem_mix_db:
    trombones: 4.5
    timpani: 3.3
    counter_guitar: 1.0
