schema: ambition.musicir.v3
id: shatter_the_iron_sky
title: Shatter the Iron Sky (Ashen Viola Duel)
description: E-minor metal combat theme with a centered, singing guitar lead and a lower, distorted solo viola responding
  in longer phrases. The final B7 turnaround resolves into E before the riff restarts. Choir and rhythm section remain
  the foundation.
seed: 17001987
timebase:
  ppq: 960
meter: 4/4
tempo: 156
key: E minor
end:
  bar: 73
  beat: 1
form:
