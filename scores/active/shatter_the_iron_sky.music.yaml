# Shatter the Iron Sky - Iron Verdict arrangement.
# Revised riff, differentiated rhythm guitars, bass, kick and low orchestral notes,
# lead phrases and controlled bend curves. Sampled instrument patches remain.
# Choir male/female and all six layer memberships are unchanged.
# Eight-bar render-only preroll copies the final combat eight bars exactly.
