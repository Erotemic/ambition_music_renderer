    bar: 9
    beat: 1
  to:
    bar: 17
    beat: 1
  energy: 0.94
  density: 0.76
  role: 'Verdict riff: E pedal, split guitar accents and F/Bb threat replies; guitar/fiddle antiphony and selective climactic
    overlap'
- id: shattered_orders
  from:
    bar: 17
    beat: 1
  to:
    bar: 25
    beat: 1
  energy: 0.92
  density: 0.74
  role: 'Pursuit: displaced syncopation, riff/bass responses and gaps for lead; guitar/fiddle antiphony and selective
    climactic overlap'
