    bar: 25
    beat: 1
  to:
    bar: 33
    beat: 1
  energy: 0.97
  density: 0.85
  role: 'Cathedral: spacious hammer hits between male/female choir pillars; guitar/fiddle antiphony and selective climactic
    overlap'
- id: counterattack
