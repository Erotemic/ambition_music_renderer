- 'Level playback: intro (8 bars, one shot) -> combat (104 bars, loop) -> outro (8 bars, one shot). At 168 BPM combat
  is 148.571 seconds; intro/outro are 11.429 seconds each.'
- Original eight combat sections and low-melody/high-shred register are unchanged, except for absolute locations.
  New five eight-bar variations supply rhythmic, choral and hook development; no additional sample libraries.
- The final two bars of intro are exactly the final two bars of combat, across every instrument. B7(b9) turns into
  the E minor opening on the loop downbeat for both intro->combat and combat->combat transitions.
- Outro is a real separate coda entered only at combat bar 104. The final E5 chord is allowed to ring while drums
  and lead stop; do not loop the outro.
- Playback exports mixable bed/hook/war_machine/dread layers; game should crossfade at bar-quantized boundaries.
  Composition-wide mastering is retained to prevent section normalization jumps.
- No programmed pitch bends or off-grid fractional event timestamps. All sample ranges preserved; FSBS lead stays
  low except the same original 8-bar shred solo.
- 'Polish 2026-10-19: the intro is a staged sparse-to-full arrival; selective auxiliary gains and low-choir revoicing
  are authored in this source score. Existing 104-bar fight and high-octave solo remain intact. Use --runtime-stem-gain-mode=shared
  for headroom.'
