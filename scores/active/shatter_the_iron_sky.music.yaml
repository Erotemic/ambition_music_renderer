schema: ambition.musicir.v3
id: shatter_the_iron_sky
title: Shatter the Iron Sky
description: '168 BPM E-minor villain leitmotif: the music IS the evil presence, not a battle against it. A short E-F-E chromatic
  decree, answered by B/G, recurs through an anvil-heavy thrash score. FSBS Distorted #1 leads; a synchronized Black And Green
  guitar reinforces it in chord-aware harmony, and a separate mid-register Growlybass Dirty line forms the third voice. Black
  And Blue, Shinyguitar, and VPO choir supply the crushing rhythmic/choral foundation; C-natural over B7(b9) gives the loop
  its unresolved threat.'
seed: 17001987
timebase:
  ppq: 960
meter: 4/4
tempo: 168
key: E minor
end:
  bar: 73
  beat: 1
form:
- id: preroll
  from:
    bar: 1
    beat: 1
  to:
    bar: 9
    beat: 1
  energy: 0.95
  density: 0.86
  role: Exact final eight bars used for DSP warmup; evil hook returns without a bad B-to-F leap.
- id: iron_gate
  from:
    bar: 9
    beat: 1
  to:
    bar: 17
    beat: 1
  energy: 0.94
  density: 0.76
  role: Evil enters with its anvil riff; the chromatic E-F-E guitar signature arrives after two bars.
- id: shattered_orders
  from:
    bar: 17
    beat: 1
  to:
    bar: 25
    beat: 1
  energy: 0.92
  density: 0.74
  role: The dictator's signature becomes a galloping metal march, harmonized in two guitars over driving bass.
- id: war_machine
  from:
    bar: 25
    beat: 1
  to:
    bar: 33
    beat: 1
  energy: 0.97
  density: 0.85
  role: 'Imperious cathedral proclamation: sustained threats, synchronized guitar harmonies, and the VPO choir.'
- id: counterattack
  from:
    bar: 33
    beat: 1
  to:
    bar: 41
    beat: 1
  energy: 1.0
  density: 0.94
  role: The emblem turns into fast, oppressive thrash rhythms with tight triple-voice accents.
- id: the_false_triumph
  from:
    bar: 41
    beat: 1
  to:
    bar: 49
    beat: 1
  energy: 0.78
  density: 0.51
  role: 'Not false triumph: evil sits enthroned in half-time, choir and wailing guitar almost motionless.'
- id: breaking_the_columns
  from:
    bar: 49
    beat: 1
  to:
    bar: 57
    beat: 1
  energy: 1.0
  density: 0.94
  role: Evil exults in a controlled shred solo; twin guitar doubles only accents while upper bass locks the harmony.
- id: no_throne
  from:
    bar: 57
    beat: 1
  to:
    bar: 65
    beat: 1
  energy: 0.98
  density: 0.82
  role: 'Full proclamation: the E-F-E motif returns above the relentless riff, bigger than before.'
- id: iron_sky_falls
  from:
    bar: 65
    beat: 1
  to:
    bar: 73
    beat: 1
  energy: 1.0
  density: 0.89
  role: The evil decree closes on an unresolved dominant and repeats into itself; no heroic cadence.
