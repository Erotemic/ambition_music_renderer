schema: ambition.musicir.v3
id: shatter_the_iron_sky
title: Shatter the Iron Sky
description: 'A grim, guitar-led E-minor combat theme: one descending judgment motif, its broadened choral
  statement, and two controlled escalation passages. F and B-flat are brief threats, not a permanent competing
  melody. The viola forms a low spectral shadow rather than a second soloist. The closing eight bars turn from
  B7-flat-nine into the opening E, and are mirrored exactly into the audio preroll.'
seed: 17001987
timebase:
  ppq: 960
meter: 4/4
tempo: 156
key: E minor
end:
  bar: 73
  beat: 1
form:
- id: preroll
  from:
    bar: 1
    beat: 1
  to:
    bar: 9
    beat: 1
  energy: 0.95
  density: 0.86
  role: 'Last eight bars repeated exactly as FX warmup: sparse fall into the dominant, then an E-minor downbeat'
- id: iron_gate
  from:
    bar: 9
    beat: 1
  to:
    bar: 17
    beat: 1
  energy: 0.94
  density: 0.76
  role: 'The black-omen theme: downward judgment shape, one decisive apex and an E-minor resolution'
- id: shattered_orders
  from:
    bar: 17
    beat: 1
  to:
    bar: 25
    beat: 1
  energy: 0.92
  density: 0.74
  role: 'Pursuit: syncopated variations and rising questions, not a second theme'
- id: war_machine
  from:
    bar: 25
    beat: 1
  to:
    bar: 33
    beat: 1
  energy: 0.97
  density: 0.85
  role: 'The cathedral: choir leads, guitar states the threat only in the gaps'
- id: counterattack
  from:
    bar: 33
    beat: 1
  to:
    bar: 41
    beat: 1
  energy: 1.0
  density: 0.94
  role: 'First eruption: the threat motif accelerates into one compressed rising run'
- id: the_false_triumph
  from:
    bar: 41
    beat: 1
  to:
    bar: 49
    beat: 1
  energy: 0.78
  density: 0.51
  role: 'Ritual: slow sustained notes, devastating space, and an unresolved dominant'
- id: breaking_the_columns
  from:
    bar: 49
    beat: 1
  to:
    bar: 57
    beat: 1
  energy: 1.0
  density: 0.94
  role: 'Breakthrough: one ascending melodic development and a single peak-speed descent'
- id: no_throne
  from:
    bar: 57
    beat: 1
  to:
    bar: 65
    beat: 1
  energy: 0.98
  density: 0.82
  role: Return of the opening theme in a higher, harder register, then a dark cadence
- id: iron_sky_falls
  from:
    bar: 65
    beat: 1
  to:
    bar: 73
    beat: 1
  energy: 1.0
  density: 0.89
  role: Austere coda dissolves into a sustained B7, leading straight back to the opening E
