    bar: 33
    beat: 1
  to:
    bar: 41
    beat: 1
  energy: 1.0
  density: 0.94
  role: 'Hunt: interlocking kick and chug assault under the first fast solo; guitar/fiddle antiphony and selective climactic
    overlap'
- id: the_false_triumph
  from:
    bar: 41
    beat: 1
  to:
    bar: 49
    beat: 1
  energy: 0.78
  density: 0.51
  role: 'Ritual: halftime drums, long minor-second tension and wailing guitar; guitar/fiddle antiphony and selective
    climactic overlap'
- id: breaking_the_columns
  from:
    bar: 49
    beat: 1
  to:
    bar: 57
    beat: 1
  energy: 1.0
  density: 0.94
  role: 'Collapse: urgent gallops and a rising second guitar solo; guitar/fiddle antiphony and selective climactic overlap'
- id: no_throne
  from:
    bar: 57
    beat: 1
  to:
    bar: 65
    beat: 1
  energy: 0.98
  density: 0.82
  role: 'Return: verdict riff answered by the now-established choir; guitar/fiddle antiphony and selective climactic
    overlap'
- id: iron_sky_falls
  from:
    bar: 65
    beat: 1
  to:
    bar: 73
    beat: 1
  energy: 1.0
  density: 0.89
  role: Return the duel theme, close on E minor, then turn cleanly back to the riff
