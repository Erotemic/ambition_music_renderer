schema: ambition.musicir.v3
id: history_crescent_between_the_rivers
title: Between the Rivers
description: >-
  The History dimension's floor of the Mediterranean and the Fertile Crescent
  (the Levant, the Fertile Crescent, Uruk, the Classical Shore). D Dorian at
  84 BPM. A plucked lyre (the Lyre of Ur) opens alone over a drone; an oboe in
  the aulos role sings the field song; the lyre counts grain on the Hijaz
  tetrachord of A while a psaltery writes the count down; the city hymn stands
  square over strings and procession drums, and a male choir sings it once;
  the shore takes the field song up a fourth into G Dorian with tambourine and
  a sea wash, then walks back to A for bar 1. The whole cue loops. Generated by
  dev/compose_history_crescent_between_the_rivers.py: edit that, not this file.
notes:
  - 'Form: levant 1-8, fields 9-24, counting 25-32, uruk 33-48, shore 49-64, return 65-72; bar 72 is the drone alone and hands to the lone lyre at bar 1.'
  - 'Layered for a room: bed (lyre, strings, shimmer), drums (hand drums, sea), tune (oboe, psaltery), power (choir).'
seed: 3200
timebase: {ppq: 960}
meter: 4/4
tempo:
  bpm: 84
key: D dorian
end: {bar: 73, beat: 1}
form:
  - {id: levant, from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, energy: 0.25, density: 0.25, loopable: true, role: 'the lyre call alone over a D drone'}
  - {id: fields, from: {bar: 9, beat: 1}, to: {bar: 25, beat: 1}, energy: 0.5, density: 0.5, loopable: true, role: 'the field song: oboe, then lyre up an octave; frame drum, darbuka'}
  - {id: counting, from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, energy: 0.55, density: 0.5, loopable: true, role: 'the count on A Hijaz; the darbuka answers, then the oboe sings a Hijaz phrase'}
  - {id: uruk, from: {bar: 33, beat: 1}, to: {bar: 49, beat: 1}, energy: 0.7, density: 0.7, loopable: true, role: 'the city hymn: strings, procession drums; the choir sings it at bar 41'}
  - {id: shore, from: {bar: 49, beat: 1}, to: {bar: 65, beat: 1}, energy: 0.8, density: 0.8, loopable: true, role: 'the field song in G Dorian, then the shore tune back to A'}
  - {id: return, from: {bar: 65, beat: 1}, to: {bar: 73, beat: 1}, energy: 0.3, density: 0.3, loopable: true, role: 'lyre and drone again, thinning to bar 1'}
