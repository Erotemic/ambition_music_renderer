# Standing on Shoulders - Extended Boss Battle: four-guitar ensemble.
# Separate reimagining; does not replace the original boss score or solo tab.
# Original song's key: E minor, original concert pitch, 88 BPM, full 79 bars.
# No solo-guitar register cap: the royal/scholar themes retain their *original*
# melodic octave, with a coordinated guitar-octave lift for the giant's low
# lines so the two leads do not collide with the power chords and low-six.
# Guitar I: 6-string electric lead in E standard; original source motifs.
# Guitar II: 6-string clean electric in E standard; real source counterlines,
#            harmonized scholar answers, and independent rhythmic responses.
# Guitar III: 6-string electric rhythm in DROP C (C2 G2 C3 F3 A3 D4);
#             uses the original guitar riff and exact power-chord hits.
# Guitar IV: low 6-string Bass VI in DROP C ONE OCTAVE BELOW guitar III
#            (C1 G1 C2 F2 A2 D3); plays the original giant bass pitches.
# Guitar IV is a six-string electric guitar variant, not an orchestral bass.
# All pitches specify SOUNDING (concert) pitch in MusicIR; no transposition
# occurs at synthesis. The score uses one original-key instrument per part.
# This score is not claimed to be playable by four ordinary standard guitars.

