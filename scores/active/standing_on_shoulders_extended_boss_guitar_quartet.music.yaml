# Standing on Shoulders - Extended Boss Battle, acoustic guitar quartet.
# Independent alternative to standing_on_shoulders_extended_boss.music.yaml.
# Four regular six-string guitars, standard E-A-D-G-B-E tuning, no capo.
# The full 79-bar form is retained at 88 BPM in E minor.
# Guitar I: main source themes, revoiced near A/D/G strings, mostly frets 7-10.
# Guitar II: off-beat scholar/giant answers and diatonic countermelody.
# Guitar III: playable open/compact power chords and occasional arpeggios.
# Guitar IV: original song's bass drive, octave-displaced onto standard guitar.
# Intended as an ensemble reimagining; it is not the original orchestration
# or a duplicate of the four original guitar tracks.
# No part requires notes above the twelfth fret; all pitches are written for
# sounding pitch (guitars notated as concert pitch in MusicIR).

