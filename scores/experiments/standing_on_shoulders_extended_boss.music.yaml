authoring:
  instrument_candidates:
    harpsichord_voice:
      primary: sonatina_full
      candidates:
      - id: sonatina_full
        label: Sonatina Harpsichord Full
        family: keys
        summary: Baseline. Full registration with the broadest body for the proclamation.
        program: harpsichord
        instrument_backend:
          kind: sfz
          sfz_glob: '**/Sonatina Symphonic Orchestra/Harpsichord/Harpsichord Full.sfz'
      - id: sonatina_8ft
        label: Sonatina Harpsichord 8 ft
        family: keys
        summary: More focused fundamental registration; a cleaner alternative to the full patch.
        program: harpsichord
        instrument_backend:
          kind: sfz
          sfz_glob: "**/Sonatina Symphonic Orchestra/Harpsichord/Harpsichord 8'.sfz"
      - id: sonatina_4ft
        label: Sonatina Harpsichord 4 ft
        family: keys
        summary: Brighter upper registration for testing whether the proclamation needs more cut.
        program: harpsichord
        instrument_backend:
          kind: sfz
          sfz_glob: "**/Sonatina Symphonic Orchestra/Harpsichord/Harpsichord 4'.sfz"
    giant_lead_emily:
      primary: emily_basic
      candidates:
      - id: emily_basic
        label: Emily Basic
        family: guitar
        summary: Baseline giant lead; broad single-note range and the established later-solo voice.
        program: clean_guitar
        instrument_backend:
          kind: sfz
          sfz_glob: '**/Emilyguitar/Emilyguitar/emily_basic.sfz'
      - id: emily_clean
        label: Emily Clean
        family: guitar
        summary: Cleaner Emily source for testing a less saturated giant entrance under the same lead chain.
        program: clean_guitar
        instrument_backend:
          kind: sfz
          sfz_glob: '**/Emilyguitar/Emilyguitar/emily_clean.sfz'
      - id: shiny_five
        label: Shiny Electric Five
        family: guitar
        summary: Sustained electric alternative with a different attack and body from Emily.
        program: clean_guitar
        instrument_backend:
          kind: sfz
          sfz_glob: '**/Shinyguitar/Shinyguitar/Programs/electric_five.sfz'
    giant_bass:
      primary: swagbass
      candidates:
      - id: swagbass
        label: Swagbass Clean
        family: bass
        summary: Baseline bass voice.
        program: fingered_bass
        instrument_backend:
          kind: sfz
          sfz_glob: '**/Swagbass/Swagbass/swagbass_clean.sfz'
      - id: original_gm_picked
        label: Original GM Picked Bass
        family: bass
        summary: Original Standing on Shoulders picked_bass timbre, kept under the current v3 mix levels for a clean timbre A/B.
        program: picked_bass
      - id: growlybass
        label: Growlybass Clean
        family: bass
        summary: Neutral clean finger-bass alternative.
        program: fingered_bass
        instrument_backend:
          kind: sfz
          library_ref: bass.growly
      - id: black_and_blue
        label: Black & Blue Bass
        family: bass
        summary: Broader sampled electric-bass character for testing denser passages.
        program: fingered_bass
        instrument_backend:
          kind: sfz
          library_ref: bass.black_and_blue
      - id: fashionbass
        label: Fashionbass Clean
        family: bass
        summary: Clean electric-bass alternative with a distinct midrange character.
        program: fingered_bass
        instrument_backend:
          kind: sfz
          library_ref: bass.fashion
      - id: pastabass
        label: Pastabass
        family: bass
        summary: Finger-bass family alternative for passages where Swagbass feels too similar to the guitars.
        program: fingered_bass
        instrument_backend:
          kind: sfz
          library_ref: bass.pastabass
