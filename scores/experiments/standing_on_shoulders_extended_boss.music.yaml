schema: ambition.musicir.v1
id: standing_on_shoulders_extended_boss
title: Standing on Shoulders - Extended Boss Battle
seed: 2026090506
notes: 'Recovered from the pre-v3 AB extended-boss lineage as a separate alternative to the canonical short cue. The battle
  arrangement keeps the opening cymbal crash and continuous bass/drum groove. The royal horn call now yields to a two-bar
  harpsichord proclamation before the giant enters. The former says-yes/takes-stage split is combined into one restrained
  three-bar reveal: the giant mirrors the scholar''s two-bar royal proclamation an octave lower, then adds a compact guitar
  variation in the third bar that descends through E minor and resolves to tonic before the Hands of GNU downbeat.
  The recursive crescendo reserves crash cymbals for structural punctuation instead of striking them every bar/beat. Recursive
  Duel Giant II resolves its B-minor-to-E-minor boundary onto E instead of sustaining F-sharp into the E-minor riff.'
tempo:
  bpm: 88
meter:
  beats_per_bar: 4
  beat_unit: 4
constraints:
  voice_leading: minimize_motion
  no_clusters: true
render:
