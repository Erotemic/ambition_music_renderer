schema: ambition.musicir.v3
id: salt_steel_and_starlight_v3_bellows_polish
title: Salt, Steel, and Starlight — Bellows Crew Shanty (v3 polish)
description: 'Polish pass on the bellows rewrite: reduce exposed B7 tritone stacking, tighten accidental-feeling melodic holes,
  bring crew responses forward, prevent guitar chord smear across bar lines, and add group-specific corrective EQ.'
notes:
- Experimental replacement candidate; earlier G and v3 crew-shanty checkpoints remain unchanged.
- No trusted sampled accordion exists in the checked-in instrument census, so both bellows directions use the same GM accordion
  timbre with authored CC11 pressure curves.
- 'The ensemble is intentionally small: lead fiddle, crew fiddle, bellows accordion, acoustic guitar, upright bass, and deck
  kit.'
- VPO performance fiddles are driven with phrase-level CC1 curves; low static CC1 was a concrete cause of the previous inaudible
  lead.
- Bellows push/pull pressure curves and one-instrument direction model are preserved from the accepted-improvement rewrite.
- 'B7 accompaniment is deliberately thinned: acoustic guitar uses a root/fifth/quality shell while accordion stays triadic,
  avoiding duplicated dominant-seventh tritones.'
- 'Corrective EQ targets measured rendered resonances: acoustic guitar near 6.1-6.3 kHz, lead near 6.5 kHz, crew fiddle/accordion
  near 4.2-4.6 kHz.'
