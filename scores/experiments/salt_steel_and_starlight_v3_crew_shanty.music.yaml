schema: ambition.musicir.v3
id: salt_steel_and_starlight_v3_crew_shanty
title: Salt, Steel, and Starlight — Crew Shanty (v3)
description: 'Fresh v3 rewrite of the pirate cue: a stomp-and-sing crew shanty built around authored call/response phrases,
  physical two-way accordion motion, root/fifth acoustic bass, and sparse folk/orchestral punctuation.'
notes:
- Experimental replacement candidate; the v1 G checkpoint remains unchanged.
- The high plucked backing is an acoustic-guitar patch used as a mandolin-like chop, not a mandolin sample.
- Accordion low-register gain staging intentionally preserves the compensation measured in the G checkpoint until a v3 bundle
  supports retuning it.
