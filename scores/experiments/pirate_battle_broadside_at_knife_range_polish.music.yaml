schema: ambition.musicir.v3
id: pirate_battle_broadside_at_knife_range_polish
title: Broadside at Knife Range - Combat Polish
description: Polished pirate combat cue with controlled fiddle/guitar upper-mid resonances, a stronger powder-smoke
  handoff, and an explicitly seam-safe sixteen-bar sustaining combat loop.
notes:
- Distinct combat cue; it does not reuse the Salt, Steel, and Starlight shanty melody.
- Pirate identity comes from fiddle, bellows/accordion color, acoustic attack, upright bass, and deck percussion
  rather than shanty call-response.
- The accordion uses root/fifth voicings during the dominant bars so the lead can carry C-sharp/G dominant color
  without repeatedly stacking the A7 tritone.
- The final 16 bars are authored as the sustaining combat loop; bar 80 ends on A7 so returning to bar 65 D minor
  resolves naturally.
- Lead and shadow fiddle use the VPO performance patch with high CC1/modulation values based on prior rendered balance
  findings.
- 'Polish pass is based on rendered bundle 1161c92c2413952d: lead resonances clustered near 4.3-4.4 kHz and 6.3
  kHz, with a smaller 6.3 kHz guitar resonance.'
- The powder-smoke break is reinforced in the arrangement rather than normalized flat; it remains a break but avoids
  the prior roughly 7 dB loudness cliff.
- 'Loop contract: bars 65-80 are the sustaining combat loop. Both eight-bar lead clips return CC1 to the same boundary
  value, the second drum half has no terminal fill, and bar 80 A7 resolves directly to bar 65 D minor.'
- Any form section marked loopable should receive a self-loop tail-to-head transition audit in diagnostic bundles.
