schema: ambition.music.v1
id: salt_steel_and_starlight
title: "Salt, Steel, and Starlight \u2014 Two-Way Accordion (G)"
description: 'A 3:14 hauling shanty with a classic accordion left-hand pulse and audible two-way right-hand bellows motion:
  beat-2 chords roll low-to-high and beat-4 chords answer high-to-low with a contrasting tango-accordion reed color.'
seed: 314159
bpm: 118.76288659793815
meter:
  beats_per_bar: 4
  beat_unit: 4
key: E minor
duration_target_seconds: 194.0
notes: G keeps F's acoustically calibrated bass buttons on beats 1/3, but replaces the block-chord right hand with two directional
  rolled strokes. Beat 2 uses the regular accordion and rolls low-to-high; beat 4 uses GM program 23 (tango accordion) and
  rolls high-to-low. The opposite note-order motion and reed color provide the in/out gesture directly; there is no synthetic
  bellows-volume LFO. The renderer change is generic chord_hits direction + spread_ms support, not song-specific code.
