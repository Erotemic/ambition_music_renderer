  - {id: main_a, from: {bar: 9, beat: 1}, to: {bar: 25, beat: 1}, energy: 0.7, density: 0.55, role: 'verse: the lead guitar sings the tune'}
  - {id: main_b, from: {bar: 25, beat: 1}, to: {bar: 41, beat: 1}, energy: 0.82, density: 0.68, role: 'chorus: the full band'}
  - {id: main_c, from: {bar: 41, beat: 1}, to: {bar: 57, beat: 1}, energy: 0.88, density: 0.78, role: 'solo, first half'}
  - {id: main_d, from: {bar: 57, beat: 1}, to: {bar: 73, beat: 1}, energy: 0.94, density: 0.86, role: 'solo, the top: high licks and two guitars'}
  - {id: outro, from: {bar: 73, beat: 1}, to: {bar: 77, beat: 1}, energy: 0.65, density: 0.5, role: 'the tune one more time, and the last chord'}
