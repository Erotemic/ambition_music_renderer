processing:
  groups:
    lead:
      chain:
        - processor: pedalboard
          effects:
            - {effect: gain, gain_db: 12.0}
            - {effect: compressor, threshold_db: -24.0, ratio: 2.4, attack_ms: 8.0, release_ms: 110.0}
        - processor: lv2
          plugin_uri: http://guitarix.sourceforge.net/plugins/gxts9#ts9sim
          binary: lv2apply
          channel_mode: dual_mono
          wet_mix: 0.5
          params: {fslider0_: -4.0, fslider1_: 680.0, fslider2_: 0.68, BYPASS: 1.0}
        - processor: lv2
          plugin_uri: http://guitarix.sourceforge.net/plugins/gx_jcm800pre_st#_jcm800pre_st
          binary: lv2apply
          wet_mix: 0.58
          params: {P6v: 0.74, Middle: 0.68, Bass: 0.48, Treble: 0.6, WET_DRY: 60.0, GAIN: -2.0}
        - {processor: highpass, cutoff_hz: 110}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 4130, q: 3.0, db: -3.0}
            - {type: peak, hz: 4920, q: 3.0, db: -3.0}
            - {type: peak, hz: 6200, q: 3.5, db: -4.0}
        - {processor: lowpass, cutoff_hz: 8200}
        - {processor: compressor, threshold_db: -22.0, ratio: 2.0, attack_ms: 7.0, release_ms: 90.0}
        - processor: pedalboard
          effects:
            - {effect: delay, delay_ms: 409, feedback: 0.2, mix: 0.14}
        - {processor: gain, gain_db: 1.0}
        - {processor: balance, position: -0.15}
    slide:
      chain:
        - processor: pedalboard
          effects:
            - {effect: gain, gain_db: 4.0}
            - {effect: compressor, threshold_db: -24.0, ratio: 2.4, attack_ms: 8.0, release_ms: 110.0}
        - processor: lv2
          plugin_uri: http://guitarix.sourceforge.net/plugins/gxts9#ts9sim
          binary: lv2apply
          channel_mode: dual_mono
          wet_mix: 0.35
          params: {fslider0_: -4.0, fslider1_: 620.0, fslider2_: 0.5, BYPASS: 1.0}
        - {processor: highpass, cutoff_hz: 110}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 4920, q: 3.0, db: -3.0}
        - {processor: lowpass, cutoff_hz: 7000}
        - processor: pedalboard
          effects:
            - {effect: delay, delay_ms: 409, feedback: 0.22, mix: 0.16}
        - {processor: reverb, wet: 0.14, decay_seconds: 1.6}
        - {processor: balance, position: 0.45}
    solo:
