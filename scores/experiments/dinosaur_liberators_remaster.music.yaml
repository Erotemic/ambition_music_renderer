schema: ambition.musicir.v3
id: dinosaur_liberators_remaster
title: Dinosaur Liberators - Southern Rock Anthem (remaster experiment)
description: >-
  An experiment. The original dinosaur_liberators with sampled instruments and a few
  changes to the arrangement. Jon decides if it replaces the original.
notes:
  - 'The original is scores/examples/dinosaur_liberators.music.yaml (MusicIR v1). That file does not change.'
  - 'Kept: G major, 110 BPM, the six sections and their lengths, the chords, and every melody (the two phrases of the tune, the slide fill, solo licks A and B, the climax lick) at its original place.'
  - 'Changed, six chords: the tune holds its home note G where the original chord had an F sharp. Bars 10 and 18 are G over F sharp in place of B minor over F sharp (the bass line is the same). Bars 27, 31, 35 and 75 are Dsus4 in place of D. The tune does not change.'
  - 'Instruments: the Shinyguitar archtop plays the arpeggio through a clean amp (Jon picked it from a reel of four) and plays the tune through the Guitarix lead amp. The Emily guitar plays the solos through the same lead amp. Sampled bass, drum kit, piano and horns. The organ is still General MIDI.'
  - 'Jon, 2026-10-10, on the first render: the guitar timbre was wrong, most of all in the intro, and the ambient strings did not work in a southern rock power ballad. The intro guitar was a flatwound electric with no amp, with almost no sound above 3 kHz. The strings and the warm pad are gone; the slide guitar holds long notes in their place.'
  - 'Changed, solo sections: the original played a lick and then rested for two or three bars. New answer phrases fill those rests. The second time the climax lick plays, a second guitar plays harmony.'
  - 'Changed, verse and chorus: the slide guitar answers the tune in two silent places, and harmonizes the last chorus phrase.'
  - 'Changed, band: a heavier rhythm guitar from the chorus on, drum fills at the ends of phrases, a busier chorus piano, and a last note of G where the original ended on E.'
seed: 19770804
timebase: {ppq: 960}
