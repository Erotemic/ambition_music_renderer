        - {processor: lowpass, cutoff_hz: 12500}
        - {processor: compressor, threshold_db: -16.0, ratio: 2.0, attack_ms: 18.0, release_ms: 90.0, makeup_db: 1.0}
  master:
    chain:
      - {processor: highpass, cutoff_hz: 36}
      - processor: parametric_eq
        bands:
          - {type: peak, hz: 420, q: 0.8, db: -1.5}
          - {type: peak, hz: 3500, q: 0.8, db: 2.0}
      - {processor: compressor, threshold_db: -17.5, ratio: 3.0, attack_ms: 12.0, release_ms: 100.0, makeup_db: 2.0, knee_db: 6.0}
      - {processor: reverb, wet: 0.05, decay_seconds: 1.3}
      - {processor: stereo_width, amount: 0.08}
      - {processor: limiter, target_peak_db: -2.0, drive: 0.92, normalize: true}
  adaptive_sections:
    mode: composition_master
