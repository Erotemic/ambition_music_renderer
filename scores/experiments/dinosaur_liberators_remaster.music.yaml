          binary: lv2apply
          channel_mode: dual_mono
          wet_mix: 0.48
          params: {fslider0_: -5.0, fslider1_: 640.0, fslider2_: 0.62, BYPASS: 1.0}
        - processor: lv2
          plugin_uri: http://guitarix.sourceforge.net/plugins/gx_jcm800pre_st#_jcm800pre_st
          binary: lv2apply
          wet_mix: 0.52
          params: {P6v: 0.68, Middle: 0.64, Bass: 0.52, Treble: 0.58, WET_DRY: 58.0, GAIN: -3.0}
        - {processor: highpass, cutoff_hz: 75}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 260, q: 0.9, db: -1.2}
            - {type: peak, hz: 3200, q: 1.0, db: 0.7}
        - {processor: lowpass, cutoff_hz: 9800}
        - {processor: compressor, threshold_db: -22.0, ratio: 2.1, attack_ms: 8.0, release_ms: 90.0}
        - {processor: balance, position: 0.7}
    arpeggio:
      chain:
        - processor: lv2
          plugin_uri: http://guitarix.sourceforge.net/plugins/gx_redeye#chump
          binary: lv2apply
          channel_mode: dual_mono
          params: {Gain: 0.38, Tone: 0.62, Volume: 0.5}
        - {processor: highpass, cutoff_hz: 90}
        - processor: parametric_eq
          bands:
            - {type: peak, hz: 2800, q: 1.0, db: 3.0}
        - {processor: lowpass, cutoff_hz: 6000}
        - {processor: lowpass, cutoff_hz: 6000}
        - {processor: compressor, threshold_db: -22.0, ratio: 2.2, attack_ms: 15.0, release_ms: 120.0, makeup_db: 2.0}
        - processor: pedalboard
          effects:
            - {effect: chorus, rate_hz: 0.7, depth: 0.15, mix: 0.2}
        - {processor: reverb, wet: 0.12, decay_seconds: 1.5}
        - {processor: gain, gain_db: -10.0}
        - {processor: balance, position: -0.45}
    bass:
      chain:
        - {processor: highpass, cutoff_hz: 30}
        - processor: parametric_eq
          bands:
            - {type: low_shelf, hz: 85, q: 0.8, db: 1.3}
            - {type: peak, hz: 230, q: 0.9, db: -0.8}
            - {type: peak, hz: 850, q: 1.0, db: 0.8}
        - {processor: lowpass, cutoff_hz: 6200}
        - {processor: compressor, threshold_db: -25.0, ratio: 2.6, attack_ms: 22.0, release_ms: 125.0, makeup_db: 2.2}
    organ:
      chain:
        - {processor: highpass, cutoff_hz: 140}
        - processor: pedalboard
          effects:
            - {effect: distortion, drive_db: 6.0}
            - {effect: chorus, rate_hz: 5.6, depth: 0.16, mix: 0.4}
        - {processor: lowpass, cutoff_hz: 6500}
        - {processor: gain, gain_db: -1.5}
    piano:
      chain:
        - {processor: highpass, cutoff_hz: 110}
        - {processor: high_shelf, hz: 4500, gain_db: 1.5}
        - {processor: compressor, threshold_db: -20.0, ratio: 2.0, attack_ms: 12.0, release_ms: 100.0, makeup_db: 1.5}
        - {processor: gain, gain_db: 7.0}
    horn:
      chain:
        - {processor: highpass, cutoff_hz: 110}
        - {processor: lowpass, cutoff_hz: 8000}
        - {processor: reverb, wet: 0.14, decay_seconds: 1.6}
        - {processor: gain, gain_db: -3.0}
    drums:
      chain:
        - {processor: highpass, cutoff_hz: 32}
