schema: ambition.musicir.v3
id: embedded_theme_b
title: Embedded Theme (candidate B)
description: >-
  A second candidate for Mary-O world 1-2, the level below the ground. A funk riff for a
  Jazz Bass with silence after it, a chip that answers in the silence, and a long run that
  ends in one hit and a bar and a half of nothing.
notes:
  - 'Jon, 2026-10-11, on the first Embedded Theme (four drafts, then shipped): "it is just not doing it for me ... try something that is different ... forget all the feedback ... still a parody of Mario 1-2, and it still should be driven by the bass, but other than that just be musically inventive".'
  - 'Jon on the first render of this candidate: "I like the groove of this when it gets moving around the minute mark ... we are going to go with this, but we have got to polish it". The call and response was "far too pronounced"; "lose a little sustain in the bass to evoke the original"; "move it a smidge towards the mario underground theme".'
  - 'What it keeps from the model: a short riff for the bass in three pairs of a low note and its octave, short notes, the last pair on a note that does not resolve; silence after it; the riff again a fourth higher; then one long run and a long silence. The roots, the rhythm and the run are its own.'
  - 'The riff is in A, in sixteenth notes with a light swing, at 104 BPM. The pairs are on A, C and D, then on A, C and D sharp. Three low notes go up to the root each time: E, G, G sharp. The run ends with the same climb, slow: E, F, F sharp, G, G sharp, A.'
  - 'Embedded: a quiet square wave (the chip) has two notes in the silence, three times in the first cycle and after each run. In the bridge the chip has the riff and the bass has a slow tune.'
  - 'The bass is the Growlybass Jazz Bass. Its samples sound one octave below the key. Long notes use the sustained program and short notes the staccato program; a note with velocity 44 is a dead note.'
