        - type: peak
          hz: 280
          q: 0.8
          db: 0.6
        - type: peak
          hz: 3400
          q: 2.0
          db: -1.5
        - type: peak
          hz: 6500
          q: 2.8
          db: -2.2
      - processor: high_shelf
        hz: 7600
        gain_db: -1.6
      - processor: lowpass
        cutoff_hz: 10500
      - processor: compressor
        threshold_db: -20
        ratio: 1.22
        attack_ms: 18
        release_ms: 100
    shamisen_rhythm:
      chain:
