schema: ambition.musicir.v3
id: ninjas_need_love_too_japanese_taiko_bass_slow
title: Ninjas Need Love Too
description: Slower Japanese/hybrid ninja theme preserving the taiko-drive arrangement, with taiko pulled back,
  upright bass brought forward, and the entire cue reduced from 158 BPM to 140 BPM.
notes:
- 'Taiko is the primary drum pulse throughout the cue: a steady four-beat pattern starts on bar 1 and uses the same
  groove at the sustaining-loop boundary.'
- The acoustic kit is secondary glue only; taiko remains the primary beat but is pulled back 2.2 dB from the prior pass.
- Upright bass uses the Sonatina Performance Bass Solo Pizzicato patch when available, with the catalog bass.upright
  resolver retained as fallback.
- The moving pizzicato bassline stays near the shamisen lead event tempo and is raised a further 4.5 dB for stronger low-end presence.
- Global tempo is 140 BPM instead of 158 BPM; event timing, phrase structure, drum pulse, and loop geometry are otherwise unchanged.
- Koto is removed from this version.
- Rhythm shamisen answers four times per eight-bar phrase instead of once, keeping its color audible without becoming
  another continuous lead.
- Opening and sustaining-loop first half use the same taiko, bass, rhythm-shamisen, kit, and lead grammar so the
  full-song restart does not collapse into an intro state.
