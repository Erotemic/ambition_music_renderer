schema: ambition.musicir.v3
id: ninjas_need_love_too_japanese_taiko_bass_slow
title: Ninjas Need Love Too
description: A moonlit taiko-and-upright groove with a singing shamisen refrain, a tender shakuhachi reply, and a rising
  final return.
notes:
- 140 BPM, felt in half time. The E-G-A-B call returns with different endings; rests belong to the phrase.
- Taiko keeps the four-beat low/high pulse. Upright bass anchors two-bar harmonies and leaves room for the lead.
- The heart section opens onto C and G; shakuhachi takes the second half of each eight-bar sentence.
- The final sixteen bars restate the opening refrain. The B-minor turnaround leads to E at either loop destination.
- Bass Solo Pizzicato is an intentional realization override of bass.upright.
