schema: ambition.musicir.v3
id: embedded_theme_v1
title: Embedded Theme (first version)
description: >-
  Mary-O world 1-2, the level below the ground. Support Theme is her play on a ground
  theme; this is her play on an underground theme: a bass that has the tune, silence
  after each phrase, and a quiet, quick hi-hat.
notes:
  - 'Archive. Jon shipped this, then on 2026-10-11: "I do not like the new embedded theme. it is just not doing it for me". scores/active/embedded_theme.music.yaml replaced it.'
  - 'Fourth version. Jon on the first: too close to the model, and the percussion (bongos, woodblocks, timbales) was not good. On the second: the brushes were bad; he wanted something subtle with a faster beat, "ch chch ch chch", and less dissonance. On the third: the hi-hat was the right pattern but must be quieter; the bass was fast all the time and only went up and down a scale; he did not like the marimba.'
  - 'The bass has a slow tune of long notes that join, with a few quick runs. It moves by chord notes and leaps, not only by steps of a scale, and bar 4 leans on a note that is not in the chord. The last chord of each eight bars is B7, so D sharp is in the tune.'
  - 'The beat is straight sixteenth notes at 132 BPM. The hi-hat plays one eighth note and two sixteenth notes in each beat, very quietly. A soft kick and a side stick come in later. There is no other percussion.'
  - 'There is no marimba and no steel drum. An electric piano holds one long chord in each bar.'
  - 'The bridge is the motto of Support Theme (her level theme) in E minor, with its own rhythm: the levels of one world share one tune.'
  - 'Embedded: a square-wave buzzer sounds three times in the first section, and a square wave has a slow line above the bass in the last.'
seed: 20261011
timebase: {ppq: 960}
meter: 4/4
tempo: 132
key: E minor
end: {bar: 37, beat: 1}
form:
  - {id: tune_a, from: {bar: 1, beat: 1}, to: {bar: 9, beat: 1}, energy: 1.0, density: 1.0, role: 'the bass has the tune; a very quiet hi-hat; the buzzer, three times'}
  - {id: tune_b, from: {bar: 9, beat: 1}, to: {bar: 17, beat: 1}, energy: 1.0, density: 1.0, role: 'the tune again, with long chords on an electric piano and a soft kick'}
  - {id: bridge, from: {bar: 17, beat: 1}, to: {bar: 25, beat: 1}, energy: 1.0, density: 1.0, role: 'the Support Theme motto in the minor'}
  - {id: tune_c, from: {bar: 25, beat: 1}, to: {bar: 33, beat: 1}, energy: 1.0, density: 1.0, role: 'the tune with two more quick places, and a slow line above it'}
  - {id: way_out, from: {bar: 33, beat: 1}, to: {bar: 37, beat: 1}, energy: 1.0, density: 1.0, role: 'half notes down the scale and a long note on the fifth'}
harmony:
  every_bars: 1
  cycle: false
  progression: [Em, Em, C, D, Em, Em, Am, B7, Em, Em, C, D, Em, Em, Am, B7, Em, Em, C, C, Am, Am, D, D, Em, Em, C, D, Em, Em, Am, B7, Em, C, Am, B7]
instruments:
  - name: bass
    group: bass
    program: fingered_bass
    volume: 118
    pan: 64
    expression: 118
    mix_gain_db: 8.0
    instrument_backend: {kind: sfz, sfz_glob: '**/Swagbass/Swagbass/swagbass_clean.sfz', settings: {fold_to_range: false}}
  - {name: beep, group: beep, program: lead_square, volume: 90, pan: 86, expression: 104}
  - {name: lead, group: lead, program: lead_square, volume: 96, pan: 58, expression: 110}
  - {name: keys, group: keys, program: electric_piano_1, volume: 96, pan: 74, expression: 104}
  - {name: kit, group: drums, is_drum: true, volume: 100, pan: 64, expression: 110}
