parts:
  - id: bass_part
    instrument: bass
    voices:
      - id: bass_main
        clips:
          - id: bass_a1
            at: {bar: 1, beat: 1}
            use: theme
          - id: bass_a2
            at: {bar: 9, beat: 1}
            use: theme
          - id: bass_a3
            at: {bar: 25, beat: 1}
            use: theme_varied
          - id: bass_way_out
            at: {bar: 33, beat: 1}
            use: way_out
          - id: bass_bridge
            at: {bar: 17, beat: 1}
            use: bridge_bass
  - id: beep_part
    instrument: beep
    voices:
      - id: beep_main
        clips:
          - id: beep_a1_1
            at: {bar: 2, beat: 1}
            use: beep_1
          - id: beep_a1_2
            at: {bar: 6, beat: 1}
            use: beep_2
          - id: beep_a1_3
            at: {bar: 8, beat: 1}
            use: beep_1
  - id: lead_part
    instrument: lead
    voices:
      - id: lead_main
        clips:
          - id: lead_bridge_1
            at: {bar: 17, beat: 1}
            use: motto_em
          - id: lead_bridge_2
            at: {bar: 19, beat: 1}
            use: motto_c
          - id: lead_bridge_3
            at: {bar: 21, beat: 1}
            use: motto_am
          - id: lead_bridge_4
            at: {bar: 23, beat: 1}
            use: motto_d
          - id: lead_a3_above
            at: {bar: 25, beat: 1}
            use: above
            velocity_scale: 0.85
  - id: keys_part
    instrument: keys
    voices:
      - id: keys_main
        clips:
          - id: keys_a2
            at: {bar: 9, beat: 1}
            use: keys_theme
          - id: keys_a3
